<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روبوتيكو - منصة الإدارة الأكاديمية</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#2C687B;--primary-light:#3D8A9E;--primary-dark:#1A4A5A;
  --primary-bg:#EBF5F8;--primary-hover:#245a6b;
  --orange:#FF9A3C;--orange-light:#FFF3E8;--orange-dark:#E8862A;
  --white:#FFFFFF;--gray:#6B7280;--light-gray:#F3F6F8;
  --border:#E2ECF0;--success:#10B981;--danger:#EF4444;--warning:#F59E0B;
  --text:#1A2E35;--text-light:#4A6572;
}
body{font-family:'Cairo',sans-serif;background:var(--light-gray);color:var(--text);direction:rtl;overflow:hidden;height:100vh}

.app{display:flex;height:100vh;overflow:hidden}
/* SIDEBAR */
.sidebar{width:260px;background:linear-gradient(180deg,var(--primary-dark) 0%,#1e5568 100%);height:100vh;position:fixed;right:0;top:0;z-index:100;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,0.15);overflow:hidden}
.sidebar-logo{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;gap:12px}
.sidebar-logo-icon{width:44px;height:44px;background:var(--orange);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.sidebar-logo-text{color:white;font-weight:800;font-size:18px;line-height:1.2}
.sidebar-logo-sub{color:rgba(255,255,255,0.6);font-size:11px;font-weight:400}
.sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.sidebar-section{margin-bottom:24px}
.sidebar-section-title{color:rgba(255,255,255,0.4);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:0 8px;margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;cursor:pointer;color:rgba(255,255,255,0.75);font-size:13.5px;font-weight:600;transition:all .2s;margin-bottom:2px;position:relative}
.nav-item:hover{background:rgba(255,255,255,0.08);color:white}
.nav-item.active{background:var(--orange);color:white;box-shadow:0 4px 12px rgba(255,154,60,0.35)}
.nav-item .icon{font-size:17px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{background:var(--danger);color:white;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;margin-right:auto}
.sidebar-footer{padding:16px;border-top:1px solid rgba(255,255,255,0.1)}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,0.07);border-radius:10px}
.sidebar-avatar{width:36px;height:36px;background:var(--orange);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:white;flex-shrink:0}
.sidebar-user-info{flex:1;min-width:0}
.sidebar-user-name{color:white;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-role{color:rgba(255,255,255,0.5);font-size:11px}
.logout-btn{background:none;border:none;color:rgba(255,255,255,0.5);cursor:pointer;font-size:16px;padding:4px;transition:.2s}
.logout-btn:hover{color:var(--orange)}
/* MAIN */
.main{margin-right:260px;flex:1;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.topbar{background:white;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(44,104,123,0.06)}
.topbar-title{font-size:18px;font-weight:800;color:var(--primary)}
.topbar-breadcrumb{font-size:12px;color:var(--gray);font-weight:500}
.topbar-actions{display:flex;gap:10px;align-items:center}
.content{padding:24px 28px;flex:1;min-height:0}
/* CARDS */
.card{background:white;border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(44,104,123,0.07);border:1px solid rgba(44,104,123,0.08)}
.card-sm{background:white;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(44,104,123,0.05);border:1px solid rgba(44,104,123,0.06)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:white;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(44,104,123,0.07);border:1px solid rgba(44,104,123,0.08);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--primary)}
.stat-card.orange::before{background:var(--orange)}
.stat-card.success::before{background:var(--success)}
.stat-card.warning::before{background:var(--warning)}
.stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.stat-icon.blue{background:var(--primary-bg)}
.stat-icon.orange{background:var(--orange-light)}
.stat-icon.green{background:#ECFDF5}
.stat-icon.yellow{background:#FFFBEB}
.stat-number{font-size:28px;font-weight:900;color:var(--text);line-height:1}
.stat-label{font-size:12.5px;color:var(--gray);font-weight:600;margin-top:4px}
/* BTNS */
.btn{padding:9px 18px;border-radius:9px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-primary{background:var(--primary);color:white}
.btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px);box-shadow:0 4px 12px rgba(44,104,123,0.3)}
.btn-orange{background:var(--orange);color:white}
.btn-orange:hover{background:var(--orange-dark);transform:translateY(-1px);box-shadow:0 4px 12px rgba(255,154,60,0.3)}
.btn-success{background:var(--success);color:white}
.btn-success:hover{background:#059669}
.btn-danger{background:var(--danger);color:white}
.btn-danger:hover{background:#DC2626}
.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary)}
.btn-outline:hover{background:var(--primary-bg)}
.btn-ghost{background:var(--light-gray);color:var(--text)}
.btn-ghost:hover{background:var(--border)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:7px}
.btn-icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:8px}
.btn-wa{background:#25D366;color:white}
.btn-wa:hover{background:#1db954}
/* FORMS */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12.5px;font-weight:700;color:var(--text-light);margin-bottom:6px}
.form-control{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:9px;font-family:'Cairo',sans-serif;font-size:13px;color:var(--text);background:white;transition:.2s;outline:none}
.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(44,104,123,0.1)}
.form-control::placeholder{color:#B0C4CE}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
td:last-child,th:last-child{position:sticky;left:0;background:inherit;z-index:1;box-shadow:-2px 0 4px rgba(44,104,123,0.06)}
th:last-child{background:var(--primary-bg)}
tr:hover td:last-child{background:#FAFCFD}
th{background:var(--primary-bg);color:var(--primary);font-size:12px;font-weight:800;padding:12px 16px;text-align:right;border-bottom:2px solid var(--primary);white-space:nowrap}
td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:#FAFCFD}
tr:last-child td{border-bottom:none}
.empty-row td{text-align:center;color:var(--gray);padding:40px;font-size:14px}
/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.badge-success{background:#ECFDF5;color:#059669}
.badge-danger{background:#FEF2F2;color:#DC2626}
.badge-warning{background:#FFFBEB;color:#D97706}
.badge-primary{background:var(--primary-bg);color:var(--primary)}
.badge-orange{background:var(--orange-light);color:var(--orange-dark)}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:white;border-radius:20px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.modal-lg{max-width:720px}
.modal-sm{max-width:420px}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:white;z-index:1;border-radius:20px 20px 0 0}
.modal-title{font-size:16px;font-weight:800;color:var(--primary)}
.modal-close{background:var(--light-gray);border:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.2s;color:var(--gray)}
.modal-close:hover{background:var(--border);color:var(--danger)}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;background:#FAFBFC;border-radius:0 0 20px 20px}
/* LOGIN */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 50%,#3D8A9E 100%);position:relative;overflow:hidden}
.login-bg-shape{position:absolute;border-radius:50%;opacity:.08;background:white}
.login-card{background:white;border-radius:24px;padding:40px;width:100%;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,0.3);position:relative;z-index:1}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo-icon{width:72px;height:72px;background:var(--orange);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px}
.login-logo-text{font-size:24px;font-weight:900;color:var(--primary)}
.login-logo-sub{font-size:13px;color:var(--gray);font-weight:500}
.login-role-tabs{display:flex;background:var(--light-gray);border-radius:10px;padding:4px;margin-bottom:24px;gap:2px}
.login-role-tab{flex:1;padding:8px;text-align:center;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700;color:var(--gray);transition:.2s}
.login-role-tab.active{background:var(--primary);color:white;box-shadow:0 2px 8px rgba(44,104,123,0.3)}
.alert{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:16px}
.alert-danger{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA}
.alert-success{background:#ECFDF5;color:#059669;border:1px solid #A7F3D0}
.alert-warning{background:#FFFBEB;color:#D97706;border:1px solid #FDE68A}
/* TABS */
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:20px;gap:4px}
.tab{padding:10px 18px;font-size:13px;font-weight:700;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s}
.tab:hover{color:var(--primary)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--primary-bg);border-radius:8px 8px 0 0}
/* SEARCH */
.search-bar{position:relative}
.search-bar input{padding-right:38px}
.search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--gray);font-size:14px;pointer-events:none}
/* MISC */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.section-title{font-size:17px;font-weight:800;color:var(--text)}
.divider{height:1px;background:var(--border);margin:16px 0}
.text-muted{color:var(--gray);font-size:12px}
.text-primary{color:var(--primary)}
.text-orange{color:var(--orange)}
.text-success{color:var(--success)}
.text-danger{color:var(--danger)}
.fw-bold{font-weight:700}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.d-flex{display:flex}
.align-center{align-items:center}
.gap-2{gap:8px}
.gap-3{gap:12px}
.mb-3{margin-bottom:12px}
.mb-4{margin-bottom:16px}
.mt-3{margin-top:12px}
.mt-4{margin-top:16px}
.p-0{padding:0}
/* RECEIPT */
.receipt{background:white;border-radius:16px;padding:32px;border:2px solid var(--primary-bg)}
.receipt-header{text-align:center;margin-bottom:24px;padding-bottom:20px;border-bottom:2px dashed var(--border)}
.receipt-logo{font-size:28px;font-weight:900;color:var(--primary)}
.receipt-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--light-gray);font-size:13.5px}
.receipt-row.total{font-size:16px;font-weight:800;color:var(--primary);border-bottom:none;padding-top:12px;margin-top:4px;border-top:2px solid var(--primary)}
/* CONTENT CARD */
.lecture-card{background:white;border-radius:14px;border:1.5px solid var(--border);overflow:hidden;transition:.2s}
.lecture-card:hover{box-shadow:0 4px 16px rgba(44,104,123,0.1);border-color:var(--primary-light)}
.lecture-card.locked{opacity:.7}
.lecture-card-header{padding:16px;display:flex;align-items:center;gap:14px}
.lecture-num{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;flex-shrink:0}
.lecture-num.unlocked{background:var(--primary-bg);color:var(--primary)}
.lecture-num.locked{background:var(--light-gray);color:var(--gray)}
.lecture-card-body{padding:0 16px 16px}
/* ALERT BANNER */
.alert-banner{background:var(--orange-light);border:1px solid var(--orange);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.alert-banner-icon{font-size:20px;flex-shrink:0}
/* FILTER BAR */
.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.filter-select{padding:9px 14px;border:1.5px solid var(--border);border-radius:9px;font-family:'Cairo',sans-serif;font-size:13px;color:var(--text);background:white;outline:none;cursor:pointer;min-width:140px}
.filter-select:focus{border-color:var(--primary)}
/* AVATAR */
.avatar{width:36px;height:36px;border-radius:10px;background:var(--primary-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.avatar-lg{width:52px;height:52px;border-radius:14px;font-size:18px}
/* SCROLL */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--light-gray)}
::-webkit-scrollbar-thumb{background:var(--primary-light);border-radius:3px}
/* PRINT */
/* ═══ RESPONSIVE ═══════════════════════════════════════════ */
@media (max-width:768px){
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;min-height:0}
  .sidebar-nav{display:flex;flex-direction:row;flex-wrap:wrap;gap:2px;padding:8px;width:100%;overflow-x:auto}
  .sidebar-section{margin-bottom:0;display:flex;gap:2px;flex-wrap:wrap}
  .sidebar-section-title{display:none}
  .nav-item{padding:6px 10px;font-size:11px;border-radius:8px;flex-shrink:0}
  .sidebar-logo{padding:12px 16px;flex:1}
  .sidebar-footer{padding:8px 16px;border-top:none;border-left:1px solid rgba(255,255,255,.1)}
  .app{flex-direction:column;height:auto;overflow:auto}
  .main{margin-right:0;height:auto;overflow:visible}
  body{overflow:auto;height:auto}
  .content{padding:16px}
  .stat-grid{grid-template-columns:1fr 1fr!important}
  .form-row,.form-row-3{grid-template-columns:1fr!important}
  .grid-2,.grid-3{grid-template-columns:1fr!important}
  .table-wrap{font-size:12px}
  th,td{padding:8px 10px}
  .simple-header{flex-wrap:wrap;gap:8px;padding:12px 16px;height:auto}
  .simple-nav{flex-wrap:wrap;gap:4px}
  .simple-nav-item{padding:6px 10px;font-size:12px}
  .simple-content{padding:16px}
  .modal{margin:8px;max-width:calc(100vw - 16px)}
  .sidebar-user-name{font-size:11px}
}
@media (max-width:480px){
  .stat-grid{grid-template-columns:1fr!important}
  .sidebar-logo-text{font-size:15px}
  .content{padding:12px}
  .card{padding:16px}
}
@media print{
  body *{visibility:hidden!important}
  .print-receipt,.print-receipt *{visibility:visible!important}
  .print-receipt{
    position:fixed!important;top:0!important;left:0!important;right:0!important;
    width:100%!important;max-width:500px!important;margin:0 auto!important;
    padding:32px!important;background:white!important;z-index:9999!important;
    box-shadow:none!important;border:none!important;
  }
  .no-print{display:none!important}
  @page{margin:1cm;size:A5}
}
/* INSTRUCTOR/STUDENT LAYOUT */
.simple-layout{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.simple-header{background:var(--primary);padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(44,104,123,0.2)}
.simple-nav{display:flex;gap:4px;align-items:center}
.simple-nav-item{padding:8px 16px;border-radius:8px;color:rgba(255,255,255,0.75);font-size:13px;font-weight:700;cursor:pointer;transition:.2s}
.simple-nav-item:hover{background:rgba(255,255,255,0.1);color:white}
.simple-nav-item.active{background:var(--orange);color:white}
.simple-content{flex:1;padding:28px;background:var(--light-gray);overflow-y:auto;overflow-x:hidden}
.cred-box{background:var(--primary-bg);border:1.5px solid var(--primary);border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.cred-text{font-family:monospace;font-size:14px;font-weight:700;color:var(--primary);letter-spacing:1px}
</style>

function makeUsername(name){
  // transliterate Arabic initials → English prefix
  const arMap={'م':'m','أ':'a','ا':'a','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh','د':'d','ذ':'dh','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'a','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','ن':'n','ه':'h','و':'w','ي':'y','ى':'a','ة':'a','ء':'a','ئ':'y','ؤ':'w'};
  const n=(name||'').trim();
  let base='';
  for(const ch of n){
    if(/[a-zA-Z]/.test(ch)){base+=ch.toLowerCase();}
    else if(arMap[ch]){base+=arMap[ch];}
    else if(ch===' '&&base.length>0){break;}
  }
  base=(base||'student').substring(0,8);
  return base+Math.floor(100+Math.random()*900);
}
function makePass(){
  const up='ABCDEFGHJKMNPQRSTUVWXYZ';
  const lo='abcdefghjkmnpqrstuvwxyz';
  const nu='2345678923456789';
  const sy='@#$!%*&';
  const all=up+lo+nu+sy;
  let p=[
    up[Math.floor(Math.random()*up.length)],
    up[Math.floor(Math.random()*up.length)],
    lo[Math.floor(Math.random()*lo.length)],
    lo[Math.floor(Math.random()*lo.length)],
    nu[Math.floor(Math.random()*nu.length)],
    nu[Math.floor(Math.random()*nu.length)],
    sy[Math.floor(Math.random()*sy.length)],
    sy[Math.floor(Math.random()*sy.length)],
  ];
  // shuffle
  for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]];}
  return p.join('');
}

function load(){
  try{
    const s=localStorage.getItem(KEY);
    if(!s)return defaultData;
    const stored=JSON.parse(s);
    const merged={...defaultData,...stored};
    // Ensure array fields are never undefined
    ['trials','parentNotes','ratings','quizzes','instTasks','instFilesList','students','instructors','groups','attendance','instAttendance','payments'].forEach(k=>{if(!Array.isArray(merged[k]))merged[k]=defaultData[k]||[];});
    if(typeof merged.content!=='object'||Array.isArray(merged.content))merged.content={};
    if(typeof merged.lectureQs!=='object'||Array.isArray(merged.lectureQs))merged.lectureQs={};
    if(typeof merged.quizResults!=='object'||Array.isArray(merged.quizResults))merged.quizResults={};
    if(typeof merged.studentBadges!=='object'||Array.isArray(merged.studentBadges))merged.studentBadges={};
    if(typeof merged.certificates!=='object'||Array.isArray(merged.certificates))merged.certificates={};
    // Always restore system users with FULL defaults (overwrite any corrupted data)
    const systemUsers=defaultData.users;
    // Remove old system user entries
    merged.users=merged.users.filter(u=>!systemUsers.find(su=>su.id===u.id));
    // Add fresh system users from defaultData
    merged.users=[...systemUsers,...merged.users];
    return merged;
  }catch{return defaultData;}
}
function save(d){
  localStorage.setItem(KEY,JSON.stringify(d));

}

function useNotifications(data){
  return useMemo(()=>{
    const notes=[];
    const todayDate=new Date();
    todayDate.setHours(0,0,0,0);
    const tomorrowDate=new Date(todayDate);
    tomorrowDate.setDate(tomorrowDate.getDate()+1);

    // 1) Birthday tomorrow
    data.students.forEach(s=>{
      if(!s.dob)return;
      const dob=new Date(s.dob);
      const thisYear=new Date(todayDate.getFullYear(),dob.getMonth(),dob.getDate());
      const diff=Math.round((thisYear-todayDate)/(1000*60*60*24));
      if(diff===1){
        notes.push({type:'birthday',student:s,icon:'🎂',
          text:`غداً عيد ميلاد ${s.name}`,sub:`يتم ${calcAge(s.dob)+1} سنة`,
          action:s.phone?{label:'إرسال تهنئة',href:waLink(s.phone,`🎂 كل سنة وأنت بخير يا ${s.name}!
تمنياتنا لك بعيد ميلاد سعيد 🤖
فريق روبوتيكو`)}:null});
      }
    });

    // 2) Payment overdue - calculate actual unpaid months
    const cm=`${todayDate.getFullYear()}-${String(todayDate.getMonth()+1).padStart(2,'0')}`;
    data.students.forEach(s=>{
      if(!s.fee||!s.startDate)return;
      const att=data.attendance.filter(a=>a.studentId===s.id).length;
      if(att<4)return;
      // Count months since start
      const start=new Date(s.startDate);
      const monthsSinceStart=Math.max(1,(todayDate.getFullYear()-start.getFullYear())*12+(todayDate.getMonth()-start.getMonth())+1);
      const totalPaid=data.payments.filter(p=>p.studentId===s.id).reduce((sum,p)=>sum+(+p.amount||0),0);
      const totalOwed=monthsSinceStart*s.fee;
      const unpaidMonths=Math.max(0,Math.round((totalOwed-totalPaid)/s.fee));
      if(unpaidMonths<1)return;
      notes.push({type:'payment',student:s,icon:'💰',
        text:`${s.name} - متأخر ${unpaidMonths} شهر`,
        sub:`حضر ${att} محاضرة - المطلوب ${unpaidMonths*s.fee} جنيه (${unpaidMonths} × ${s.fee})`,
        action:s.phone?{label:'تذكير واتساب',href:waLink(s.phone,`مرحباً ${s.name}،
يوجد ${unpaidMonths} شهر متأخر بإجمالي ${unpaidMonths*s.fee} جنيه 💰
فريق روبوتيكو 🤖`)}:null});
    });

    // 3) Exam reminder every 8 lectures
    data.students.forEach(s=>{
      const att=data.attendance.filter(a=>a.studentId===s.id).length;
      if(att>0&&att%8===0){
        const examNum=att/8;
        const alreadyNotified=false; // could track in data; for now always show
        notes.push({type:'exam',student:s,icon:'📝',
          text:`${s.name} - موعد الاختبار الدوري ${examNum}`,sub:`أتم ${att} محاضرة - الاختبار بعد ${att} محاضرة`,
          action:s.phone?{label:'إشعار واتساب',href:waLink(s.phone,`مرحباً ${s.name}،
موعد الاختبار الدوري رقم ${examNum} قد حان بعد إتمامك ${att} محاضرات 📝
فريق روبوتيكو 🤖`)}:null});
      }
    });

    return notes;
  },[data]);
}

  const waMsg=`مرحباً ${student.name}،\nإيصال دفع رقم: ${payment.receiptNum}\nالمبلغ: ${payment.amount} جنيه\nعن: ${payment.month}\nتاريخ: ${formatDate(payment.date)}\nشكراً لثقتك في روبوتيكو 🤖`;
  function printThenWA(){
    window.print();
    if(student.phone){
      setTimeout(()=>window.open(waLink(student.phone,waMsg),'_blank'),800);
    }
  }
  return <Modal show={show} onClose={onClose} title="إيصال الدفع" size="modal-sm"
    footer={<>
      <button className="btn btn-ghost btn-sm no-print" onClick={onClose}>إغلاق</button>
      <button className="btn btn-primary btn-sm no-print" onClick={()=>window.print()}>🖨️ طباعة</button>
      {student.phone&&<button className="btn btn-wa btn-sm no-print" onClick={printThenWA}>📱 PDF + واتساب</button>}
    </>}>
    <div className="receipt print-receipt">
      <div className="receipt-header">
        <div style={{fontSize:30,marginBottom:4}}>🤖</div>
        <div className="receipt-logo">روبوتيكو</div>
        <div style={{fontSize:12,color:'var(--gray)',marginTop:4}}>أكاديمية البرمجة والروبوت</div>
      </div>
      <div style={{textAlign:'center',marginBottom:16}}>
        <span className="badge badge-primary" style={{fontSize:13}}>إيصال رقم: {payment.receiptNum}</span>
      </div>
      {[
        ['اسم الطالب',student.name],
        ['رقم الطالب',student.studentId],
        ['الكورس',student.course],
        ['الشهر',payment.month],
        ['تاريخ الدفع',formatDate(payment.date)],
      ].map(([k,v])=><div key={k} className="receipt-row"><span style={{color:'var(--gray)'}}>{k}</span><span style={{fontWeight:700}}>{v}</span></div>)}
      {payment.discount>0&&<div className="receipt-row"><span style={{color:'var(--gray)'}}>المبلغ الأصلي</span><span style={{fontWeight:700,textDecoration:'line-through',color:'var(--gray)'}}>{payment.originalAmount} جنيه</span></div>}
      {payment.discount>0&&<div className="receipt-row"><span style={{color:'var(--success)'}}>💚 خصم</span><span style={{fontWeight:700,color:'var(--success)'}}>- {payment.discount} جنيه</span></div>}
      <div className="receipt-row total"><span>المبلغ المدفوع</span><span style={{color:'var(--success)'}}>💰 {payment.amount} جنيه</span></div>
      <div style={{textAlign:'center',marginTop:20,fontSize:11.5,color:'var(--gray)'}}>شكراً لثقتك في روبوتيكو 🤖</div>
    </div>
  </Modal>;
}

// ─── STUDENT FORM ─────────────────────────────────────────────────────────────
function StudentForm({initial,groups,courseNames,data,onSave,onCancel,isEdit}){

  const age=calcAge(f.dob);

  if(!f.name.trim())errors.push('الاسم الكامل مطلوب');
  if(!f.phone.trim())errors.push('رقم الهاتف مطلوب');
  if(!f.startDate)errors.push('تاريخ البداية مطلوب');
  if(!f.studentId.trim())errors.push('كود الطالب مطلوب');
  if(f.studentId.trim()&&f.studentId.trim().length!==5)errors.push('كود الطالب يجب أن يكون 5 أرقام بالضبط');

      <div className="form-group">

        <input className="form-control" value={f.studentId} maxLength={5}
          onChange={e=>{const v=e.target.value.replace(/[^0-9]/g,'').slice(0,5);setF(p=>({...p,studentId:v}));}}
          placeholder="00001" inputMode="numeric"
          style={{borderColor:f.studentId&&f.studentId.length!==5?'var(--danger)':undefined,fontWeight:700,fontSize:15,letterSpacing:3}}/>
        <div style={{fontSize:11,marginTop:3,color:f.studentId&&f.studentId.length!==5?'var(--danger)':'var(--gray)'}}>
          {f.studentId.length}/5 {f.studentId.length===5?'✅':''}

      </div>
      <Input label="الاسم الكامل" required value={f.name} onChange={set('name')} placeholder="محمد أحمد"/>
    </div>
    <div className="form-row">
      <div>
        <Input label="تاريخ الميلاد" type="date" value={f.dob} onChange={set('dob')}/>
        {age!==null&&<div style={{marginTop:-10,marginBottom:12,fontSize:12.5,color:'var(--primary)',fontWeight:700,padding:'4px 12px',background:'var(--primary-bg)',borderRadius:6,display:'inline-block'}}>🎂 العمر: {age} سنة</div>}

// ─── PAYMENT ALERTS ───────────────────────────────────────────────────────────
function PaymentAlerts({students,attendance,payments}){
  const alerts=useMemo(()=>{
    return students.filter(s=>{
      if(!s.fee)return false;
      const att=attendance.filter(a=>a.studentId===s.id).length;
      if(att<4)return false;
      const now=new Date();
      const curMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      const hasPaid=payments.some(p=>p.studentId===s.id&&p.date?.startsWith(curMonth));
      return !hasPaid;
    });
  },[students,attendance,payments]);
  if(!alerts.length)return null;
  return <div className="alert-banner" style={{marginBottom:20}}>
    <span className="alert-banner-icon">🔔</span>
    <div>
      <div style={{fontWeight:800,fontSize:13}}>تنبيه المدفوعات ({alerts.length} طالب)</div>
      <div style={{fontSize:12,color:'var(--text-light)',marginTop:2}}>
        {alerts.slice(0,3).map(s=>s.name).join(' • ')}{alerts.length>3&&` و ${alerts.length-3} آخرين`}
      </div>
    </div>
  </div>;
}

// ─── BACKUP MODULE ─────────────────────────────────────────────────────────────
function BackupModule({data,setData}){
  const [importErr,setImportErr]=useState('');
  const [importOk,setImportOk]=useState(false);

  function doExport(){
    const json=JSON.stringify({_robotico_backup:true,exportedAt:new Date().toISOString(),data},null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`robotico_backup_${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function doImport(e){
    setImportErr('');setImportOk(false);
    const file=e.target.files?.[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const parsed=JSON.parse(ev.target.result);
        if(!parsed._robotico_backup||!parsed.data)throw new Error('الملف غير صالح — يجب أن يكون ملف نسخ احتياطي من روبوتيكو');
        if(!confirm('⚠️ استيراد البيانات سيستبدل جميع البيانات الحالية. هل أنت متأكد؟'))return;
        setData(parsed.data);
        save(parsed.data);
        setImportOk(true);
        setTimeout(()=>setImportOk(false),5000);
      }catch(err){setImportErr(err.message||'خطأ في قراءة الملف');}
    };
    reader.readAsText(file);
    e.target.value='';
  }

  const stats=[
    ['🎓 الطلاب',data.students?.length||0],
    ['✅ سجلات الحضور',data.attendance?.length||0],
    ['💰 سجلات الدفع',data.payments?.length||0],
    ['👨‍🏫 المحاضرون',data.instructors?.length||0],
    ['👥 المجموعات',data.groups?.length||0],
    ['🆓 محاضرات مجانية',(data.trials||[]).length],
    ['🏆 الشهادات',Object.keys(data.certificates||{}).length],
    ['📝 الواجبات',(data.homework||[]).length],
  ];

  return <div style={{maxWidth:620}}>
    <div className="card" style={{marginBottom:20,background:'linear-gradient(135deg,#EFF6FF,white)',border:'2px solid var(--primary)'}}>
      <div style={{fontWeight:900,fontSize:16,color:'var(--primary)',marginBottom:16}}>📊 ملخص البيانات الحالية</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:10}}>
        {stats.map(([k,v])=><div key={k} className="card-sm"><span style={{color:'var(--gray)',fontSize:12}}>{k}</span><span style={{fontWeight:800,fontSize:18,color:'var(--primary)',marginRight:8}}>{v}</span></div>)}
      </div>
      <div style={{marginTop:12,fontSize:11,color:'var(--gray)'}}>آخر تحديث: {new Date().toLocaleString('ar-EG')}</div>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div style={{fontWeight:800,fontSize:15,color:'var(--primary)',marginBottom:6}}>📤 تصدير نسخة احتياطية</div>
      <div style={{fontSize:13,color:'var(--gray)',marginBottom:16,lineHeight:1.7}}>تصدير جميع بيانات البرنامج (طلاب، حضور، مدفوعات، محتوى...) في ملف JSON يمكن حفظه واستعادته لاحقاً.</div>
      <button className="btn btn-primary" style={{padding:'11px 28px',fontSize:14}} onClick={doExport}>
        💾 تحميل نسخة احتياطية
      </button>
    </div>

    <div className="card">
      <div style={{fontWeight:800,fontSize:15,color:'var(--danger)',marginBottom:6}}>📥 استيراد نسخة احتياطية</div>
      <div style={{fontSize:13,color:'var(--gray)',marginBottom:12,lineHeight:1.7,padding:'10px 14px',background:'#FEF2F2',borderRadius:10,border:'1px solid #FCA5A5'}}>
        ⚠️ <strong>تحذير:</strong> الاستيراد سيحذف جميع البيانات الحالية ويستبدلها بالبيانات في الملف. تأكد من تصدير نسخة حالية أولاً.
      </div>
      <label className="btn btn-outline" style={{padding:'11px 28px',fontSize:14,cursor:'pointer',display:'inline-block'}}>
        📂 اختيار ملف النسخة الاحتياطية
        <input type="file" accept=".json" onChange={doImport} style={{display:'none'}}/>
      </label>
      {importErr&&<div className="alert alert-danger" style={{marginTop:10}}>❌ {importErr}</div>}
      {importOk&&<div className="alert alert-success" style={{marginTop:10}}>✅ تم استيراد البيانات بنجاح!</div>}
    </div>
  </div>;
}

// ─── GRADE FINAL EXAM MODAL ──────────────────────────────────────────────────
function GradeFinalExamModal({show,onClose,student,currentGrade,nextGrade,onPass,onFail}){
  const [decision,setDecision]=useState('');
  const [note,setNote]=useState('');
  const [confirmed,setConfirmed]=useState(false);

  if(!show)return null;

  function handleSave(){
    if(!decision){alert('يرجى تحديد نتيجة الاختبار');return;}
    if(decision==='pass'){onPass(note);}
    else{onFail(note);}
    setDecision('');setNote('');setConfirmed(false);
  }

  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal modal-sm">
      <div className="modal-header" style={{background:'linear-gradient(135deg,var(--primary-dark),var(--primary))',borderRadius:'20px 20px 0 0'}}>
        <span className="modal-title" style={{color:'white',fontSize:17}}>🎓 اختبار نهاية المستوى</span>
        <button className="modal-close" style={{background:'rgba(255,255,255,.2)',color:'white'}} onClick={onClose}>✕</button>
      </div>
      <div className="modal-body">
        <div style={{textAlign:'center',marginBottom:20}}>
          <div style={{width:64,height:64,background:'var(--orange-light)',borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',fontSize:32,margin:'0 auto 12px'}}>🏆</div>
          <div style={{fontWeight:900,fontSize:16,color:'var(--text)'}}>{student?.name}</div>
          <div style={{fontSize:13,color:'var(--gray)',marginTop:4}}>أتم 16 محاضرة في <strong style={{color:'var(--primary)'}}>{currentGrade}</strong></div>
        </div>

        <div style={{background:'var(--primary-bg)',borderRadius:12,padding:'14px 16px',marginBottom:16,border:'1.5px solid var(--primary)'}}>
          <div style={{fontWeight:700,fontSize:13,color:'var(--primary)',marginBottom:8}}>📋 نتيجة الاختبار النهائي</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <div onClick={()=>setDecision('pass')} style={{padding:'14px',borderRadius:10,cursor:'pointer',textAlign:'center',
              background:decision==='pass'?'#ECFDF5':'white',
              border:`2px solid ${decision==='pass'?'var(--success)':'var(--border)'}`,
              transition:'.2s',userSelect:'none'}}>
              <div style={{fontSize:28,marginBottom:4}}>✅</div>
              <div style={{fontWeight:800,fontSize:13,color:decision==='pass'?'var(--success)':'var(--gray)'}}>اجتاز المستوى</div>
              {nextGrade&&<div style={{fontSize:11,color:'var(--gray)',marginTop:4}}>ينتقل إلى {nextGrade}</div>}
            </div>
            <div onClick={()=>setDecision('fail')} style={{padding:'14px',borderRadius:10,cursor:'pointer',textAlign:'center',
              background:decision==='fail'?'#FEF2F2':'white',
              border:`2px solid ${decision==='fail'?'var(--danger)':'var(--border)'}`,
              transition:'.2s',userSelect:'none'}}>
              <div style={{fontSize:28,marginBottom:4}}>❌</div>
              <div style={{fontWeight:800,fontSize:13,color:decision==='fail'?'var(--danger)':'var(--gray)'}}>لم يجتز المستوى</div>
              <div style={{fontSize:11,color:'var(--gray)',marginTop:4}}>يعيد {currentGrade}</div>
            </div>
          </div>
        </div>

        <div className="form-group">
          <label className="form-label">ملاحظات (اختياري)</label>
          <textarea className="form-control" rows="2" value={note} onChange={e=>setNote(e.target.value)} placeholder="أي ملاحظات على أداء الطالب..."/>
        </div>

        {decision==='pass'&&nextGrade&&<div className="alert alert-success">
          ✅ سيتم ترحيل الطالب تلقائياً إلى <strong>{nextGrade}</strong> وإعادة تعيين سجل الحضور للـ Grade الجديد
        </div>}
        {decision==='pass'&&!nextGrade&&<div className="alert alert-success">
          🏆 الطالب أتم جميع المستويات! يمكن ترقيته لكورس آخر.
        </div>}
        {decision==='fail'&&<div className="alert alert-danger">
          ❌ سيبقى الطالب في <strong>{currentGrade}</strong> ويُعاد تعيين سجل حضوره
        </div>}
      </div>
      <div className="modal-footer">
        <button className="btn btn-ghost" onClick={onClose}>إلغاء</button>
        <button className="btn btn-primary" disabled={!decision} onClick={handleSave}>💾 تسجيل النتيجة</button>
      </div>
    </div>
  </div>;
}

// ─── STUDENTS MODULE ──────────────────────────────────────────────────────────
function StudentsModule({data,update,lang='ar'}){
  const [search,setSearch]=useState('');
  const [showAdd,setShowAdd]=useState(false);
  const [editSt,setEditSt]=useState(null);
  const [viewSt,setViewSt]=useState(null);
  const [showReceipt,setShowReceipt]=useState(null);
  const [gradeExam,setGradeExam]=useState(null); // {student}

  function handleGradePass(student,note){
    const gradeIdx=GRADES.indexOf(student.grade||'Grade 1');
    const nextGrade=gradeIdx<GRADES.length-1?GRADES[gradeIdx+1]:null;
    // Clear attendance for current grade lectures, move to next grade
    const newStudents=data.students.map(s=>s.id===student.id?{
      ...s,
      grade:nextGrade||s.grade,
      gradeHistory:[...(s.gradeHistory||[]),{grade:s.grade,result:'pass',note,date:today()}],
      // reset attendance counter by recording grade completion
      gradeCompletedAt:{...(s.gradeCompletedAt||{}),[s.grade]:today()},
    }:s);
    // Remove attendance records for this student (reset for new grade)
    const newAttendance=data.attendance.filter(a=>a.studentId!==student.id);
    update('students',newStudents);
    update('attendance',newAttendance);
    setGradeExam(null);
    alert(`✅ تم ترحيل ${student.name} إلى ${nextGrade||'(آخر مستوى)'} بنجاح!`);
    // Store certificate eligibility
    const certs={...(data.certificates||{}),[student.id+'_'+student.grade]:{studentName:student.name,grade:student.grade,course:student.course,date:today(),passed:true}};
    update('certificates',certs);
  }
  function handleGradeFail(student,note){
    const newStudents=data.students.map(s=>s.id===student.id?{
      ...s,
      gradeHistory:[...(s.gradeHistory||[]),{grade:s.grade,result:'fail',note,date:today()}],
    }:s);
    // Reset attendance for retry
    const newAttendance=data.attendance.filter(a=>a.studentId!==student.id);
    update('students',newStudents);
    update('attendance',newAttendance);
    setGradeExam(null);
    alert(`تم تسجيل إعادة ${student.name} للمستوى ${student.grade||'Grade 1'}`);
  }

  const [filterCourse,setFilterCourse]=useState('');
  const [filterGrade,setFilterGrade]=useState('');
  const [filterGroup,setFilterGroup]=useState('');
  const [filterStatus,setFilterStatus]=useState('');
  const filtered=useMemo(()=>data.students.filter(s=>
    ci(s.name,search)||ci(s.studentId,search)||s.course?.includes(search)||s.phone?.includes(search)
  ),[data.students,search]);

  function addStudent(f){
    const sid=f.studentId||makeStudentId(data.students);
    const pass=makePass();const uname=makeUsername(f.name);
    const newSt={...f,id:makeId(),studentId:sid,createdAt:today()};
    const newUser={id:makeId(),username:uname,password:pass,role:'student',name:f.name,phone:f.phone,studentId:newSt.id};
    update('students',[...data.students,newSt]);
    update('users',[...data.users,newUser]);
    alert(`✅ تم التسجيل!\nاسم المستخدم: ${uname}\nكلمة السر: ${pass}`);
    setShowAdd(false);
  }
  function editStudent(f){
    const st=data.students.map(s=>s.id===editSt.id?{...s,...f}:s);
    update('students',st);
    const usr=data.users.map(u=>u.studentId===editSt.id?{...u,name:f.name,phone:f.phone}:u);
    update('users',usr);
    setEditSt(null);
  }
  function deleteStudent(id){
    if(!confirm('هل أنت متأكد من حذف هذا الطالب؟'))return;
    update('students',data.students.filter(s=>s.id!==id));
    update('users',data.users.filter(u=>u.studentId!==id));
  }
  function getGroup(gid){return data.groups.find(g=>g.id===gid);}
  function getStudentUser(sid){return data.users.find(u=>u.studentId===sid);}

  return <div>
    <PaymentAlerts students={data.students} attendance={data.attendance} payments={data.payments}/>
    {(data.parentNotes||[]).filter(n=>!n.read).length>0&&<div className="alert-banner" style={{marginBottom:16,background:'#FEF2F2',borderColor:'var(--danger)'}}>
      <span style={{fontSize:24}}>📝</span>
      <div style={{flex:1}}>
        <div style={{fontWeight:800,fontSize:13,color:'var(--danger)'}}>{lang==='ar'?`${(data.parentNotes||[]).filter(n=>!n.read).length} ملاحظة جديدة من أولياء الأمور`:`${(data.parentNotes||[]).filter(n=>!n.read).length} new parent note(s)`}</div>
        <div style={{fontSize:12,color:'var(--text-light)',marginTop:4}}>
          {(data.parentNotes||[]).filter(n=>!n.read).slice(0,2).map(n=>`"${n.note.substring(0,60)}${n.note.length>60?'...':''}"  `)}
        </div>
      </div>
    </div>}
    <div className="card">
      <div className="section-header">
        <span className="section-title">قائمة الطلاب ({data.students.length})</span>
        <button className="btn btn-primary" onClick={()=>setShowAdd(true)}>➕ طالب جديد</button>
      </div>
      <div style={{marginBottom:16}}>
        <div className="search-bar">
          <span className="search-icon">🔍</span>
          <input className="form-control" placeholder="بحث بالاسم أو الرقم أو الكورس..." value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
      </div>
      <div className="table-wrap">
        <table>
          <thead><tr>
            <th>رقم</th><th>الاسم</th><th>الحالة</th><th>الكورس</th><th>Grade</th><th>المجموعة</th><th>الحضور</th><th>المدفوعات</th><th>الهاتف</th><th>إجراءات</th>
          </tr></thead>
          <tbody>
            {filtered.length===0?<tr><td colSpan="8" className="empty-row">🎓 لا يوجد طلاب مسجلون</td></tr>:
            filtered.map(s=>{
              const attCnt=data.attendance.filter(a=>a.studentId===s.id).length;
              const paysCnt=data.payments.filter(p=>p.studentId===s.id).length;
              const g=getGroup(s.groupId);
              const cm=new Date().toISOString().substr(0,7);
              const unpaid=s.fee&&attCnt>=4&&!data.payments.some(p=>p.studentId===s.id&&p.date?.startsWith(cm));
              return <tr key={s.id}>
                <td><span className="badge badge-primary">#{s.studentId}</span></td>
                <td><div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div className="avatar">{s.name[0]}</div>
                  <div>
                    <div style={{fontWeight:700}}>{s.name}</div>
                    {unpaid&&<span className="badge badge-warning" style={{fontSize:10}}>⚠️ لم يدفع</span>}
                  </div>
                </div></td>
                <td>{s.status==='suspended'?<span className="badge badge-warning">⏸️ موقف</span>:<span className="badge badge-success">✅ نشط</span>}</td>
                <td>{s.course}</td>
                <td>{s.grade?<span className="badge badge-orange">{s.grade}</span>:<span style={{color:'var(--gray)',fontSize:12}}>—</span>}</td>
                <td>{g?<span className="badge badge-primary">{g.name}</span>:<span style={{color:'var(--gray)',fontSize:12}}>—</span>}</td>
                <td><span className="badge badge-success">{attCnt}/16</span></td>
                <td><span className="badge badge-orange">{paysCnt} دفعة</span></td>
                <td>{s.phone&&<span style={{fontSize:12.5,fontFamily:'monospace'}}>{s.phone}</span>}</td>
                <td><div style={{display:'flex',gap:4}}>
                  <button className="btn btn-ghost btn-sm btn-icon" title="عرض" onClick={()=>setViewSt(s)}>👁️</button>
                  <button className="btn btn-outline btn-sm btn-icon" title="تعديل" onClick={()=>setEditSt(s)}>✏️</button>
                  {s.phone&&<a className="btn btn-wa btn-sm btn-icon" href={waLink(s.phone)} target="_blank" rel="noreferrer" title="واتساب">💬</a>}
                  {(()=>{const attCnt2=data.attendance.filter(a=>a.studentId===s.id).length;return attCnt2===16?<button className="btn btn-orange btn-sm btn-icon" title="اختبار نهاية المستوى" onClick={()=>setGradeExam(s)}>🏆</button>:null;})()}
                  <button className="btn btn-danger btn-sm btn-icon" title="حذف" onClick={()=>deleteStudent(s.id)}>🗑️</button>
                </div></td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
    </div>

    {/* Grade Exam Modal */}
    {(()=>{
    const certEntries=Object.entries(data.certificates||{}).filter(([k])=>k.split('_')[0]&&data.students.find(s=>s.id===k.split('_')[0]));
    if(certEntries.length===0)return null;
    return <div className="card" style={{marginBottom:16,border:'1.5px solid var(--orange)'}}>
      <div style={{fontWeight:800,marginBottom:12,color:'var(--orange-dark)'}}>🏆 شهادات جاهزة للطباعة</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
        {certEntries.map(([k,cert])=>{
          const st=data.students.find(s=>s.id===k.split('_')[0]);
          if(!st)return null;
          return <button key={k} className="btn btn-outline btn-sm" onClick={()=>setGradeExam({...st,_showCert:cert})}>
            🎓 {st.name} - {cert.grade}
          </button>;
        })}
      </div>
    </div>;
  })()}
  {gradeExam&&gradeExam._showCert?
    <CertificateGenerator student={gradeExam} grade={gradeExam._showCert.grade} course={gradeExam._showCert.course} date={gradeExam._showCert.date} onClose={()=>setGradeExam(null)}/>:
  gradeExam&&<GradeFinalExamModal
      show={!!gradeExam}
      onClose={()=>setGradeExam(null)}
      student={gradeExam}
      currentGrade={gradeExam.grade||'Grade 1'}
      nextGrade={GRADES[GRADES.indexOf(gradeExam.grade||'Grade 1')+1]||null}
      onPass={note=>handleGradePass(gradeExam,note)}
      onFail={note=>handleGradeFail(gradeExam,note)}
    />}

    {/* Add Student */}
    <Modal show={showAdd} onClose={()=>setShowAdd(false)} title="تسجيل طالب جديد" size="modal-lg">
      <StudentForm groups={data.groups} courseNames={data.courseNames||COURSES} data={data} onSave={addStudent} onCancel={()=>setShowAdd(false)}/>
    </Modal>

    {/* Edit Student */}
    {editSt&&<Modal show={!!editSt} onClose={()=>setEditSt(null)} title="تعديل بيانات الطالب" size="modal-lg">
      <StudentForm initial={editSt} groups={data.groups} courseNames={data.courseNames||COURSES} data={data} onSave={editStudent} onCancel={()=>setEditSt(null)} isEdit/>
    </Modal>}

    {/* View Student */}
    {viewSt&&<StudentDetail student={viewSt} data={data} update={update} onClose={()=>setViewSt(null)} setShowReceipt={setShowReceipt}/>}
    {showReceipt&&<ReceiptModal show={!!showReceipt} onClose={()=>setShowReceipt(null)} payment={showReceipt} student={data.students.find(s=>s.id===showReceipt.studentId)}/>}
  </div>;
}

function StudentDetail({student,data,update,onClose,setShowReceipt}){
  const [tab,setTab]=useState('info');
  const [payAmount,setPayAmount]=useState(student.fee||0);
  const [payDiscount,setPayDiscount]=useState(0);
  const [payMonthNum,setPayMonthNum]=useState(1);
  const finalAmount=Math.max(0,(+payAmount||0)-(+payDiscount||0));
  const atts=data.attendance.filter(a=>a.studentId===student.id).sort((a,b)=>a.lectureNum-b.lectureNum);
  const pays=data.payments.filter(p=>p.studentId===student.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const usr=data.users.find(u=>u.studentId===student.id);
  const grp=data.groups.find(g=>g.id===student.groupId);

  function addPayment(){
    if(!payAmount){alert('أدخل المبلغ');return;}
    const receiptNum='RCT-'+Date.now().toString().slice(-6);
    const monthLabel=`الشهر ${payMonthNum} من الكورس`;
    const p={id:makeId(),studentId:student.id,amount:finalAmount,originalAmount:+payAmount,discount:+payDiscount,month:monthLabel,date:today(),receiptNum};
    update('payments',[...data.payments,p]);
    setShowReceipt(p);
  }

  return <Modal show={true} onClose={onClose} title={`ملف الطالب: ${student.name}`} size="modal-lg"
    footer={<button className="btn btn-ghost" onClick={onClose}>إغلاق</button>}>
    <div className="tabs">
      {['info','attendance','payments','grades','credentials'].map((t,i)=>{
        const labels=['البيانات','الحضور','المدفوعات','السجل الدراسي','بيانات الدخول'];
        return <div key={t} className={`tab ${tab===t?'active':''}`} onClick={()=>setTab(t)}>{labels[i]}</div>;
      })}
    </div>
    {tab==='info'&&<div>
      <div style={{display:'flex',gap:16,alignItems:'flex-start',flexWrap:'wrap'}}>
        <div className="avatar-lg" style={{fontSize:22}}>{student.name[0]}</div>
        <div style={{flex:1}}>
          <div style={{fontSize:18,fontWeight:800,color:'var(--primary)'}}>{student.name}</div>
          <div style={{fontSize:13,color:'var(--gray)',marginTop:4}}>رقم: #{student.studentId}</div>
        </div>
        {student.phone&&<a className="btn btn-wa btn-sm" href={waLink(student.phone)} target="_blank" rel="noreferrer">💬 واتساب</a>}
      </div>
      <div className="divider"/>
      <div className="grid-2" style={{gap:12}}>
        {[['الكورس',student.course,'📚'],['Grade',student.grade||'—','🏅'],['المجموعة',grp?.name||'—','👥'],['تاريخ البداية',formatDate(student.startDate),'📅'],['العمر',(calcAge(student.dob)!==null?calcAge(student.dob)+' سنة':'—'),'🎂'],['الرسوم الشهرية',(student.fee||0)+' جنيه','💰'],['الهاتف',student.phone||'—','📱']].map(([k,v,ico])=>

    {tab==='payments'&&<div>
      <div className="card-sm" style={{marginBottom:16,border:'1.5px solid var(--primary)'}}>
        <div style={{fontWeight:800,marginBottom:14,fontSize:14,color:'var(--primary)'}}>➕ تسجيل دفعة جديدة</div>
        <div className="form-row">

            <input className="form-control" type="number" min="1" max="36" inputMode="numeric"
              value={payMonthNum}

              placeholder="1"

          <Input label="المبلغ الأصلي (جنيه)" type="number" value={payAmount} onChange={e=>setPayAmount(e.target.value)}/>

        </div>
        {+payDiscount>0&&<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 14px',background:'#ECFDF5',borderRadius:9,marginBottom:8,border:'1px solid #A7F3D0'}}>
          <span style={{fontSize:13,fontWeight:700,color:'var(--success)'}}>💚 خصم: {payDiscount} جنيه</span>
          <span style={{fontSize:15,fontWeight:900,color:'var(--success)'}}>المبلغ النهائي: {finalAmount} جنيه</span>

        <button className="btn btn-success" style={{width:'100%',padding:'11px'}} onClick={addPayment}>💰 تسجيل الدفع ({finalAmount} جنيه) وإنشاء إيصال</button>
      </div>
      {pays.length===0?<div style={{textAlign:'center',color:'var(--gray)',padding:20}}>لا توجد مدفوعات مسجلة</div>:
      <div>
        <div style={{fontWeight:700,marginBottom:10,fontSize:13}}>سجل المدفوعات ({pays.length})</div>
        {pays.map(p=><div key={p.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 14px',borderRadius:10,border:'1px solid var(--border)',marginBottom:8,background:'white'}}>
          <div>

            {student.phone&&<a className="btn btn-wa btn-sm" href={waLink(student.phone,`مرحباً ${student.name}،
إيصال رقم: ${p.receiptNum}
المبلغ: ${p.amount} جنيه
عن: ${p.month}
تاريخ: ${formatDate(p.date)}
شكراً لثقتك في روبوتيكو 🤖`)} target="_blank" rel="noreferrer">💬</a>}

    {tab==='grades'&&<div>

            </div>

بيانات دخول منصة روبوتيكو:
اسم المستخدم: ${usr.username}
كلمة المرور: ${usr.password}
${student.status==='suspended'?'⚠️ ملاحظة: حسابك موقوف حالياً':''}`)} target="_blank" rel="noreferrer">💬 إرسال بيانات الدخول</a>}

}

// ─── ATTENDANCE MODULE ────────────────────────────────────────────────────────
function AttendanceModule({data,update}){
  const [selectedGroup,setSelectedGroup]=useState('');
  const [selectedStudents,setSelectedStudents]=useState([]); // multi-select
  const [lectureNum,setLectureNum]=useState('1');
  const [lectureName,setLectureName]=useState(data.lectureNames?.[0]||LECTURE_NAMES[0]);
  const [attDate,setAttDate]=useState(today());
  const [msg,setMsg]=useState('');

  const grp=data.groups.find(g=>g.id===selectedGroup);
  const groupStudents=useMemo(()=>
    selectedGroup ? data.students.filter(s=>s.groupId===selectedGroup&&s.status!=='suspended') : []
  ,[data.students,selectedGroup]);

  function toggleStudent(sid){
    setSelectedStudents(prev=>prev.includes(sid)?prev.filter(x=>x!==sid):[...prev,sid]);
  }
  function selectAll(){setSelectedStudents(groupStudents.map(s=>s.id));}
  function clearAll(){setSelectedStudents([]);}

  function register(){
    if(!selectedGroup){setMsg('❌ اختر المجموعة أولاً');return;}
    if(selectedStudents.length===0){setMsg('❌ اختر طالباً واحداً على الأقل');return;}
    let added=0,skipped=0;
    let newAtt=[...data.attendance];
    selectedStudents.forEach(sid=>{
      const exists=newAtt.some(a=>a.studentId===sid&&a.lectureNum===+lectureNum);
      if(exists){skipped++;return;}
      newAtt.push({id:makeId(),studentId:sid,lectureNum:+lectureNum,lectureName,date:attDate});
      added++;
    });
    update('attendance',newAtt);
    // Check if any student completed 16 lectures
    const completed16=selectedStudents.filter(sid=>{
      const cnt=newAtt.filter(a=>a.studentId===sid).length;
      return cnt===16;
    });
    if(completed16.length>0){
      const names=completed16.map(sid=>data.students.find(s=>s.id===sid)?.name||'').join('، ');
      setMsg(`🏆 ${names} أتمّوا 16 محاضرة! يرجى إجراء اختبار نهاية المستوى`);
    } else {
      const skipTxt=skipped>0?` (${skipped} مسجّل مسبقاً)`:'';
      setMsg(`✅ تم تسجيل حضور ${added} طالب بنجاح${skipTxt}`);
      setTimeout(()=>setMsg(''),4000);
    }
    setSelectedStudents([]);
  }

  const recentAtt=data.attendance.slice(-10).reverse();
  return <div className="grid-2" style={{alignItems:'start'}}>
    <div>
      <div className="card" style={{marginBottom:16}}>
        <div className="section-title" style={{marginBottom:16}}>✅ تسجيل حضور طلاب</div>
        {msg&&<div className={`alert ${msg.startsWith('✅')?'alert-success':'alert-warning'}`} style={{whiteSpace:'pre-line'}}>{msg}</div>}

        {/* Step 1: Group */}
        <div style={{background:'var(--primary-bg)',borderRadius:12,padding:'14px 16px',marginBottom:16,border:'1.5px solid var(--primary)'}}>
          <div style={{fontWeight:800,fontSize:13,color:'var(--primary)',marginBottom:10}}>① اختر المجموعة</div>
          <select className="form-control" value={selectedGroup} onChange={e=>{setSelectedGroup(e.target.value);setSelectedStudents([]);}}>
            <option value="">-- اختر المجموعة --</option>
            {data.groups.map(g=>{
              const cnt=data.students.filter(s=>s.groupId===g.id&&s.status!=='suspended').length;
              return <option key={g.id} value={g.id}>{g.name} ({cnt} طالب) {g.days?.join('،')} {g.time||''}</option>;
            })}
          </select>
          {grp&&<div style={{marginTop:8,display:'flex',gap:6,flexWrap:'wrap'}}>
            {grp.days?.map(d=><span key={d} className="badge badge-primary" style={{fontSize:11}}>{d}</span>)}
            {grp.time&&<span className="badge badge-orange" style={{fontSize:11}}>⏰ {grp.time}</span>}
            {grp.course&&<span className="badge badge-success" style={{fontSize:11}}>📚 {grp.course}</span>}
          </div>}
        </div>

        {/* Step 2: Students */}
        {selectedGroup&&<div style={{background:'#F0FBF7',borderRadius:12,padding:'14px 16px',marginBottom:16,border:'1.5px solid var(--success)'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <div style={{fontWeight:800,fontSize:13,color:'var(--success)'}}>② اختر الطلاب ({selectedStudents.length}/{groupStudents.length})</div>
            <div style={{display:'flex',gap:6}}>
              <button className="btn btn-ghost btn-sm" style={{fontSize:11}} onClick={selectAll}>الكل</button>
              <button className="btn btn-ghost btn-sm" style={{fontSize:11}} onClick={clearAll}>لا شيء</button>
            </div>
          </div>
          {groupStudents.length===0?
            <div style={{textAlign:'center',color:'var(--gray)',padding:'16px 0',fontSize:13}}>لا يوجد طلاب في هذه المجموعة</div>:
            <div style={{display:'flex',flexDirection:'column',gap:6,maxHeight:220,overflowY:'auto'}}>
              {groupStudents.map(s=>{
                const sel=selectedStudents.includes(s.id);
                const alreadyAtt=data.attendance.some(a=>a.studentId===s.id&&a.lectureNum===+lectureNum);
                const attCount=data.attendance.filter(a=>a.studentId===s.id).length;
                return <div key={s.id} onClick={()=>!alreadyAtt&&toggleStudent(s.id)}
                  style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',borderRadius:9,cursor:alreadyAtt?'not-allowed':'pointer',
                    background:alreadyAtt?'#F9FAFB':sel?'#DCFCE7':'white',
                    border:`1.5px solid ${alreadyAtt?'var(--border)':sel?'var(--success)':'var(--border)'}`,
                    opacity:alreadyAtt?.6:1,transition:'.15s',userSelect:'none'}}>
                  <div style={{width:20,height:20,borderRadius:5,border:`2px solid ${alreadyAtt?'#CBD5E0':sel?'var(--success)':'#CBD5E0'}`,
                    background:alreadyAtt?'#CBD5E0':sel?'var(--success)':'white',
                    display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    {sel&&!alreadyAtt&&<span style={{color:'white',fontSize:12,fontWeight:900}}>✓</span>}
                    {alreadyAtt&&<span style={{color:'white',fontSize:10,fontWeight:900}}>✓</span>}
                  </div>
                  <div className="avatar" style={{width:30,height:30,fontSize:12,flexShrink:0}}>{s.name?.[0]}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.name}</div>
                    <div style={{fontSize:11,color:'var(--gray)'}}>#{s.studentId} • حضر {attCount}/16</div>
                  </div>
                  {alreadyAtt&&<span className="badge badge-success" style={{fontSize:10,flexShrink:0}}>مسجّل ✓</span>}
                </div>;
              })}
            </div>}
        </div>}

        {/* Step 3: Lecture info */}
        {selectedGroup&&<div style={{background:'var(--orange-light)',borderRadius:12,padding:'14px 16px',marginBottom:16,border:'1.5px solid var(--orange)'}}>
          <div style={{fontWeight:800,fontSize:13,color:'var(--orange-dark)',marginBottom:10}}>③ بيانات المحاضرة</div>
          <div className="form-row">
            <Select label="رقم المحاضرة" value={lectureNum} onChange={e=>{const n=e.target.value;setLectureNum(n);setLectureName(data.lectureNames?.[+n-1]||LECTURE_NAMES[+n-1]);}}>
              {Array.from({length:16},(_,i)=><option key={i+1} value={i+1}>المحاضرة {i+1}</option>)}
            </Select>
            <Input label="التاريخ" type="date" value={attDate} onChange={e=>setAttDate(e.target.value)}/>
          </div>
          <Input label="اسم المحاضرة" value={lectureName} onChange={e=>setLectureName(e.target.value)}/>
        </div>}

        <button className="btn btn-primary" style={{width:'100%',padding:'12px',fontSize:14}} onClick={register}
          disabled={!selectedGroup||selectedStudents.length===0}>
          ✅ تسجيل حضور {selectedStudents.length>0?`(${selectedStudents.length} طالب)`:''}
        </button>
      </div>
    </div>
    <div className="card">
      <div className="section-title" style={{marginBottom:16}}>📋 آخر سجلات الحضور</div>
      {recentAtt.length===0?<div style={{textAlign:'center',color:'var(--gray)',padding:30}}>لا توجد سجلات حضور</div>:
      recentAtt.map(a=>{
        const st=data.students.find(s=>s.id===a.studentId);
        const g=data.groups.find(gr=>gr.id===st?.groupId);
        return <div key={a.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid var(--border)'}}>
          <div className="avatar" style={{background:'var(--primary-bg)',color:'var(--primary)',fontWeight:900}}>{a.lectureNum}</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:13}}>{st?.name||'—'}</div>
            <div style={{fontSize:11.5,color:'var(--gray)'}}>{g?.name||''} • {a.lectureName} • {formatDate(a.date)}</div>
          </div>
          <span className="badge badge-success">✓</span>
        </div>;
      })}
    </div>
  </div>;
}

// ─── PAYMENTS MODULE ──────────────────────────────────────────────────────────
function PaymentsModule({data,update}){
  const [showReceipt,setShowReceipt]=useState(null);
  const [editPay,setEditPay]=useState(null);
  const [search,setSearch]=useState('');
  const alerts=data.students.filter(s=>{
    if(!s.fee)return false;
    const att=data.attendance.filter(a=>a.studentId===s.id).length;
    if(att<4)return false;
    const cm=new Date().toISOString().substr(0,7);
    return !data.payments.some(p=>p.studentId===s.id&&p.date?.startsWith(cm));
  });
  const allPays=useMemo(()=>data.payments.filter(p=>{
    const st=data.students.find(s=>s.id===p.studentId);
    return !search||st?.name?.includes(search)||st?.studentId?.includes(search);
  }).sort((a,b)=>new Date(b.date)-new Date(a.date)),[data.payments,data.students,search]);

  const totalMonth=useMemo(()=>{const cm=new Date().toISOString().substr(0,7);return data.payments.filter(p=>p.date?.startsWith(cm)).reduce((s,p)=>s+(+p.amount||0),0);},[data.payments]);

  return <div>
    {alerts.length>0&&<div className="alert-banner" style={{marginBottom:20}}>
      <span style={{fontSize:24}}>🔔</span>
      <div style={{flex:1}}>
        <div style={{fontWeight:800}}>{alerts.length} طالب لم يدفع هذا الشهر (حضر 4+ محاضرات)</div>
        <div style={{fontSize:12,marginTop:4,display:'flex',flexWrap:'wrap',gap:8,marginTop:8}}>
          {alerts.map(s=><a key={s.id} className="btn btn-wa btn-sm"
            href={waLink(s.phone,'مرحباً '+s.name+',\nنذكركم بسداد رسوم شهر '+new Date().toLocaleDateString('ar-EG',{month:'long',year:'numeric'})+' وقيمتها '+s.fee+' جنيه\nشكراً 🤖')}
            target="_blank" rel="noreferrer">💬 {s.name}</a>)}
        </div>
      </div>
    </div>}
    {(()=>{
      const expectedMonthly=data.students.filter(s=>s.status!=='suspended'&&s.fee).reduce((sum,s)=>sum+(+s.fee||0),0);
      const collectionRate=expectedMonthly>0?Math.round((totalMonth/expectedMonthly)*100):0;
      return <div className="stat-grid" style={{gridTemplateColumns:'repeat(4,1fr)',marginBottom:16}}>
        <div className="stat-card"><div className="stat-icon green">💰</div><div className="stat-number">{totalMonth.toLocaleString()}</div><div className="stat-label">تم تحصيله هذا الشهر (جنيه)</div></div>
        <div className="stat-card success"><div className="stat-icon blue">🎯</div>
          <div className="stat-number" style={{fontSize:22}}>{expectedMonthly.toLocaleString()}</div>
          <div className="stat-label">المتوقع شهرياً (جنيه)</div>
          <div style={{marginTop:6,height:6,background:'var(--border)',borderRadius:4,overflow:'hidden'}}>
            <div style={{width:`${Math.min(collectionRate,100)}%`,height:'100%',background:'var(--success)',borderRadius:4,transition:'.5s'}}/>
          </div>
          <div style={{fontSize:11,color:'var(--gray)',marginTop:4}}>{collectionRate}% تم تحصيله</div>
        </div>
        <div className="stat-card orange"><div className="stat-icon orange">📋</div><div className="stat-number">{data.payments.length}</div><div className="stat-label">إجمالي الدفعات</div></div>
        <div className="stat-card warning"><div className="stat-icon yellow">⚠️</div><div className="stat-number">{alerts.length}</div><div className="stat-label">متأخرون هذا الشهر</div></div>
      </div>;
    })()}
    <div className="card">
      <div className="section-header">
        <span className="section-title">سجل المدفوعات</span>
        <div className="search-bar"><span className="search-icon">🔍</span>
          <input className="form-control" placeholder="بحث..." value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
      </div>
      <div className="table-wrap"><table>
        <thead><tr><th>إيصال</th><th>الطالب</th><th>الشهر</th><th>المبلغ</th><th>التاريخ</th><th>إجراءات</th></tr></thead>
        <tbody>{allPays.length===0?<tr><td colSpan="6" className="empty-row">لا توجد مدفوعات</td></tr>:
          allPays.map(p=>{const st=data.students.find(s=>s.id===p.studentId);return <tr key={p.id}>
            <td><span className="badge badge-primary">{p.receiptNum}</span></td>
            <td><div style={{fontWeight:700}}>{st?.name||'—'}</div><div style={{fontSize:11.5,color:'var(--gray)'}}>#{st?.studentId}</div></td>
            <td>{p.month}</td>
            <td><span style={{fontWeight:800,color:'var(--success)'}}>{p.amount} جنيه</span></td>
            <td>{formatDate(p.date)}</td>
            <td><div style={{display:'flex',gap:4}}>
              <button className="btn btn-ghost btn-sm" onClick={()=>setShowReceipt(p)}>🖨️ إيصال</button>

// ─── INSTRUCTORS MODULE ───────────────────────────────────────────────────────
function InstructorsModule({data,update,lang='ar'}){

  const [newCreds,setNewCreds]=useState(null);

  const [filterSpec,setFilterSpec]=useState(''); // {name,username,pass,phone,id}
  const emptyF={name:'',phone:'',specialization:'',email:'',status:'active'};
  const [f,setF]=useState(emptyF);
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));

  function addInst(){
    if(!f.name.trim()){alert(lang==='ar'?'الاسم مطلوب':'Name is required');return;}
    const pass=makePass();const uname=makeUsername(f.name);
    const inst={...f,id:makeId(),createdAt:today()};
    const usr={id:makeId(),username:uname,password:pass,role:'instructor',name:f.name,phone:f.phone,instructorId:inst.id};
    update('instructors',[...data.instructors,inst]);
    update('users',[...data.users,usr]);
    setNewCreds({name:f.name,username:uname,pass,phone:f.phone,instId:inst.id});
    setShowAdd(false);setF(emptyF);
  }
  function saveEdit(){
    if(!editInst.name?.trim()){alert('الاسم مطلوب');return;}
    update('instructors',data.instructors.map(i=>i.id===editInst.id?editInst:i));
    update('users',data.users.map(u=>u.instructorId===editInst.id?{...u,name:editInst.name,phone:editInst.phone}:u));
    setEditInst(null);

    if(!confirm(lang==='ar'?'حذف المحاضر؟':'Delete instructor?'))return;

// ─── INSTRUCTOR ATTENDANCE ────────────────────────────────────────────────────
function InstAttModule({data,update}){
  const [f,setF]=useState({instructorId:'',groupId:'',lectureNum:'1',date:today()});
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const [msg,setMsg]=useState('');
  const recent=data.instAttendance.slice(-8).reverse();

  const selectedGroup=data.groups.find(g=>g.id===f.groupId);
  const autoHours=selectedGroup?.lectureHours||1.5;

  function register(){
    if(!f.instructorId||!f.groupId){setMsg('❌ اختر المحاضر والمجموعة');return;}
    update('instAttendance',[...data.instAttendance,{id:makeId(),...f,lectureNum:+f.lectureNum,lectureHours:autoHours}]);
    setMsg(`✅ تم تسجيل حضور المحاضر (${autoHours} ساعة)`);
    setTimeout(()=>setMsg(''),3000);
  }
  return <div className="grid-2" style={{alignItems:'start'}}>
    <div className="card">
      <div className="section-title" style={{marginBottom:16}}>تسجيل حضور محاضر</div>
      {msg&&<div className={`alert ${msg.startsWith('✅')?'alert-success':'alert-danger'}`}>{msg}</div>}
      <Select label="المحاضر" value={f.instructorId} onChange={set('instructorId')}>
        <option value="">-- اختر المحاضر --</option>
        {data.instructors.map(i=><option key={i.id} value={i.id}>{i.name}</option>)}
      </Select>
      <Select label="المجموعة" value={f.groupId} onChange={set('groupId')}>
        <option value="">-- اختر المجموعة --</option>
        {data.groups.map(g=><option key={g.id} value={g.id}>{g.name} ({g.lectureHours||1.5} ساعة)</option>)}
      </Select>
      {f.groupId&&<div style={{background:'var(--primary-bg)',borderRadius:10,padding:'10px 14px',marginBottom:12,border:'1.5px solid var(--primary)',display:'flex',alignItems:'center',gap:10}}>
        <span style={{fontSize:20}}>⏱️</span>
        <div>
          <div style={{fontWeight:800,fontSize:13,color:'var(--primary)'}}>مدة المحاضرة: {autoHours} ساعة</div>
          <div style={{fontSize:11,color:'var(--gray)',marginTop:2}}>
            مُحدَّدة في إعدادات المجموعة
            {selectedGroup?.time&&` • الوقت: ${selectedGroup.time}`}
          </div>
        </div>
      </div>}
      <Select label="رقم المحاضرة" value={f.lectureNum} onChange={set('lectureNum')}>
        {Array.from({length:16},(_,i)=><option key={i+1} value={i+1}>المحاضرة {i+1}</option>)}
      </Select>
      <Input label="التاريخ" type="date" value={f.date} onChange={set('date')}/>
      <button className="btn btn-primary" style={{width:'100%'}} onClick={register}>✅ تسجيل الحضور</button>
    </div>
    <div className="card">
      <div className="section-title" style={{marginBottom:16}}>آخر سجلات المحاضرين</div>
      {recent.length===0?<div style={{textAlign:'center',color:'var(--gray)',padding:30}}>لا توجد سجلات</div>:
      recent.map(a=>{
        const inst=data.instructors.find(i=>i.id===a.instructorId);
        const grp=data.groups.find(g=>g.id===a.groupId);
        const hrs=a.lectureHours||grp?.lectureHours||1.5;
        return <div key={a.id} style={{display:'flex',gap:10,alignItems:'center',padding:'10px 0',borderBottom:'1px solid var(--border)'}}>
          <div className="avatar" style={{background:'var(--orange-light)',color:'var(--orange-dark)'}}>{inst?.name?.[0]||'؟'}</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:13}}>{inst?.name||'—'}</div>
            <div style={{fontSize:11.5,color:'var(--gray)'}}>{grp?.name} • م{a.lectureNum} • {hrs}س • {formatDate(a.date)}</div>
          </div>
          <span className="badge badge-primary" style={{fontSize:11}}>{hrs}س</span>
        </div>;
      })}
    </div>
  </div>;
}

// ─── GROUPS MODULE ────────────────────────────────────────────────────────────
function GroupsModule({data,update}){
  const [showAdd,setShowAdd]=useState(false);
  const [editGroup,setEditGroup]=useState(null);
  const [f,setF]=useState({name:'',course:'',days:[],timeStart:'',timeEnd:'',time:'',instructorIds:[]});
  const set=k=>e=>setF(p=>({...p,[k]:v}));

  function toggleDay(d,formObj,setFormObj){setFormObj(p=>({...p,days:p.days.includes(d)?p.days.filter(x=>x!==d):[...p.days,d]}));}
  function toggleInst(id,formObj,setFormObj){setFormObj(p=>({...p,instructorIds:p.instructorIds.includes(id)?p.instructorIds.filter(x=>x!==id):[...p.instructorIds,id]}));}
  function buildTime(f){return f.timeStart&&f.timeEnd?`${f.timeStart} - ${f.timeEnd}`:f.timeStart||f.timeEnd||'';}

  function addGroup(){
    if(!f.name.trim()){alert('اسم المجموعة مطلوب');return;}
    if(!f.course){alert('يجب اختيار الكورس المرتبط بالمجموعة');return;}
    const time=buildTime(f);
    update('groups',[...data.groups,{...f,time,id:makeId(),createdAt:today()}]);
    setShowAdd(false);setF({name:'',course:'',days:[],timeStart:'',timeEnd:'',time:'',instructorIds:[]});
  }
  function saveEdit(){
    if(!editGroup.name.trim()){alert('الاسم مطلوب');return;}
    const time=buildTime(editGroup);
    update('groups',data.groups.map(g=>g.id===editGroup.id?{...editGroup,time}:g));
    setEditGroup(null);
  }
  function deleteGroup(id){
    if(!confirm('حذف المجموعة؟'))return;
    update('groups',data.groups.filter(g=>g.id!==id));
  }

  const DayPicker=({obj,setObj})=><div style={{display:'flex',flexWrap:'wrap',gap:6}}>
    {DAYS.map(d=><label key={d} style={{display:'flex',alignItems:'center',gap:5,cursor:'pointer',padding:'5px 12px',borderRadius:8,
      border:`1.5px solid ${obj.days?.includes(d)?'var(--primary)':'var(--border)'}`,
      background:obj.days?.includes(d)?'var(--primary-bg)':'white',fontSize:13,fontWeight:obj.days?.includes(d)?700:400}}>
      <input type="checkbox" checked={obj.days?.includes(d)||false} onChange={()=>setObj(p=>({...p,days:p.days?.includes(d)?p.days.filter(x=>x!==d):[...(p.days||[]),d]}))} style={{display:'none'}}/>{d}
    </label>)}
  </div>;

  const InstPicker=({obj,setObj})=><div style={{display:'flex',flexWrap:'wrap',gap:6}}>
    {data.instructors.map(i=><label key={i.id} style={{display:'flex',alignItems:'center',gap:5,cursor:'pointer',padding:'5px 12px',borderRadius:8,
      border:`1.5px solid ${obj.instructorIds?.includes(i.id)?'var(--orange)':'var(--border)'}`,
      background:obj.instructorIds?.includes(i.id)?'var(--orange-light)':'white',fontSize:13,fontWeight:obj.instructorIds?.includes(i.id)?700:400}}>
      <input type="checkbox" checked={obj.instructorIds?.includes(i.id)||false} onChange={()=>setObj(p=>({...p,instructorIds:p.instructorIds?.includes(i.id)?p.instructorIds.filter(x=>x!==i.id):[...(p.instructorIds||[]),i.id]}))} style={{display:'none'}}/>{i.name}
    </label>)}
    {data.instructors.length===0&&<span style={{fontSize:12,color:'var(--gray)'}}>لا يوجد محاضرون</span>}
  </div>;

  const TimeRow=({obj,setObj})=><div className="form-row">
    <div className="form-group">
      <label className="form-label">وقت البداية</label>
      <select className="form-control" value={obj.timeStart||''} onChange={e=>setObj(p=>({...p,timeStart:e.target.value}))}>
        <option value="">-- اختر --</option>
        {TIME_SLOTS.map(t=><option key={t}>{t}</option>)}
      </select>
    </div>
    <div className="form-group">
      <label className="form-label">وقت الانتهاء</label>
      <select className="form-control" value={obj.timeEnd||''} onChange={e=>setObj(p=>({...p,timeEnd:e.target.value}))}>
        <option value="">-- اختر --</option>
        {TIME_SLOTS.map(t=><option key={t}>{t}</option>)}
      </select>
    </div>
  </div>;

  return <div>
