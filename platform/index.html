}


// ─── CONTENT QUESTIONS EDITOR ────────────────────────────────────────────────
function ContentQuestionsEditor({data,update,ckey,lang='ar'}){
  const qs=(data.lectureQs||{})[ckey]||[];
  function setQs(newQs){update('lectureQs',{...(data.lectureQs||{}),[ckey]:newQs});}
  function addQ(type='mcq'){setQs([...qs,{q:'',imageUrl:'',type,options:['','','',''],correct:0,answerType:'mcq'}]);}
  function removeQ(i){if(!confirm('حذف السؤال؟'))return;setQs(qs.filter((_,j)=>j!==i));}
  function setQF(i,k,v){const n=[...qs];n[i]={...n[i],[k]:v};setQs(n);}
  function setOpt(qi,oi,v){const n=[...qs];const o=[...n[qi].options];o[oi]=v;n[qi]={...n[qi],options:o};setQs(n);}

  const typeLabels={mcq:'اختيار من متعدد',text:'إجابة نصية',image_answer:'رفع صورة كإجابة',voice_answer:'تسجيل صوتي كإجابة'};

  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:8}}>
      <span style={{fontWeight:700,fontSize:14}}>{qs.length} سؤال تفاعلي</span>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        {Object.entries(typeLabels).map(([type,label])=>
          <button key={type} className="btn btn-ghost btn-sm" style={{fontSize:11}} onClick={()=>addQ(type)}>➕ {label}</button>)}
      </div>
    </div>
    {qs.length===0&&<div style={{textAlign:'center',padding:30,color:'var(--gray)'}}>
      <div style={{fontSize:32}}>❓</div>
      <div style={{fontSize:13,marginTop:8}}>اضغط أحد أزرار الإضافة أعلاه</div>
    </div>}
    {qs.map((q,qi)=><div key={qi} style={{padding:'14px',borderRadius:12,border:'1.5px solid var(--primary)',marginBottom:12,background:'var(--primary-bg)'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <span style={{fontWeight:800,color:'var(--primary)',fontSize:13}}>سؤال {qi+1} — <span style={{color:'var(--orange-dark)'}}>{typeLabels[q.type||'mcq']}</span></span>
        <button className="btn btn-danger btn-sm btn-icon" onClick={()=>removeQ(qi)}>✕</button>
      </div>
      <Input label="نص السؤال" value={q.q} onChange={e=>setQF(qi,'q',e.target.value)} placeholder="اكتب السؤال..."/>
      <Input label="رابط صورة للسؤال (اختياري)" value={q.imageUrl||''} onChange={e=>setQF(qi,'imageUrl',e.target.value)} placeholder="https://..."/>
      {q.imageUrl&&<img src={q.imageUrl} alt="سؤال" style={{maxHeight:140,borderRadius:8,marginBottom:8,objectFit:'cover'}} onError={e=>e.target.style.display='none'}/>}
      {(q.type==='mcq'||!q.type)&&<div>
        <div style={{fontSize:12,fontWeight:700,color:'var(--primary)',marginBottom:6}}>الخيارات (انقر الدائرة للإجابة الصحيحة):</div>
        {(q.options||['','','','']).map((opt,oi)=><div key={oi} style={{display:'flex',gap:8,marginBottom:6,alignItems:'center'}}>
          <div onClick={()=>setQF(qi,'correct',oi)} style={{width:22,height:22,borderRadius:'50%',border:`2px solid ${q.correct===oi?'var(--success)':'var(--border)'}`,background:q.correct===oi?'var(--success)':'white',cursor:'pointer',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
            {q.correct===oi&&<span style={{color:'white',fontSize:12,fontWeight:900}}>✓</span>}
          </div>
          <input className="form-control" value={opt} onChange={e=>setOpt(qi,oi,e.target.value)} placeholder={`خيار ${oi+1}`} style={{flex:1}}/>
        </div>)}
      </div>}
      {q.type==='text'&&<div style={{padding:'8px 12px',background:'white',borderRadius:8,fontSize:12,color:'var(--gray)'}}>
        💬 الطالب سيكتب إجابة نصية
      </div>}
      {q.type==='image_answer'&&<div style={{padding:'8px 12px',background:'white',borderRadius:8,fontSize:12,color:'var(--gray)'}}>
        📸 الطالب سيرفع صورة كإجابة
      </div>}
      {q.type==='voice_answer'&&<div style={{padding:'8px 12px',background:'white',borderRadius:8,fontSize:12,color:'var(--gray)'}}>
        🎙️ الطالب سيسجل صوتاً كإجابة
      </div>}
    </div>)}
    {qs.length>0&&<div className="alert alert-success">✅ يتم الحفظ تلقائياً</div>}
  </div>;
}

// ─── COURSE MANAGER MODAL ────────────────────────────────────────────────────
function CourseManagerModal({courseNames,onSave,onClose}){
  const [names,setNames]=useState([...courseNames]);
  const [newName,setNewName]=useState('');

  function addCourse(){
    if(!newName.trim())return;
    if(names.includes(newName.trim())){alert('هذا الكورس موجود بالفعل');return;}
    setNames(p=>[...p,newName.trim()]);
    setNewName('');
  }
  function renameCourse(i,val){setNames(p=>{const n=[...p];n[i]=val;return n;});}
  function deleteCourse(i){
    if(!confirm(`حذف كورس "${names[i]}"؟
سيتم تحديث سجلات الطلاب المرتبطين.`))return;
    setNames(p=>p.filter((_,j)=>j!==i));
  }
  function handleSave(){
    const clean=names.map(n=>n.trim()).filter(Boolean);
    if(clean.length===0){alert('يجب أن يكون هناك كورس واحد على الأقل');return;}
    onSave(clean);
    onClose();
  }

  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal modal-sm">
      <div className="modal-header">
        <span className="modal-title">⚙️ إدارة الكورسات</span>
        <button className="modal-close" onClick={onClose}>✕</button>
      </div>
      <div className="modal-body">
        <div style={{marginBottom:16}}>
          <div style={{display:'flex',gap:8,marginBottom:8}}>
            <input className="form-control" value={newName} onChange={e=>setNewName(e.target.value)}
              placeholder="اسم الكورس الجديد..." onKeyDown={e=>e.key==='Enter'&&addCourse()}
              style={{flex:1}}/>
            <button className="btn btn-primary btn-sm" onClick={addCourse}>➕ إضافة</button>
          </div>
        </div>
        <div style={{fontWeight:700,fontSize:13,marginBottom:8,color:'var(--gray)'}}>الكورسات الحالية:</div>
        <div style={{display:'flex',flexDirection:'column',gap:8,maxHeight:300,overflowY:'auto'}}>
          {names.map((name,i)=><div key={i} style={{display:'flex',gap:8,alignItems:'center',padding:'8px 10px',borderRadius:9,background:'var(--light-gray)',border:'1.5px solid var(--border)'}}>
            <div style={{width:26,height:26,background:'var(--primary)',borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontWeight:800,fontSize:12,flexShrink:0}}>{i+1}</div>
            <input className="form-control" value={name} onChange={e=>renameCourse(i,e.target.value)}
              style={{flex:1,background:'white'}}/>
            <button className="btn btn-danger btn-sm btn-icon" onClick={()=>deleteCourse(i)} disabled={names.length<=1}>🗑️</button>
          </div>)}
        </div>
        <div style={{marginTop:12,padding:'8px 12px',background:'#FFFBEB',borderRadius:8,fontSize:12,color:'var(--orange-dark)'}}>
          ⚠️ تعديل الأسماء سيتم تطبيقه تلقائياً على سجلات الطلاب والمحتوى التعليمي
        </div>
      </div>
      <div className="modal-footer">
        <button className="btn btn-ghost" onClick={onClose}>إلغاء</button>
        <button className="btn btn-primary" onClick={handleSave}>💾 حفظ التغييرات</button>
      </div>
    </div>
  </div>;
}

// ─── CONTENT MODULE ───────────────────────────────────────────────────────────
function ContentModule({data,update}){
  const courseNames=(data.courseNames&&data.courseNames.length>0)?data.courseNames:COURSES;
  const [contentTab,setContentTab]=useState('content');
  const [selCourse,setSelCourse]=useState(()=>courseNames[0]||COURSES[0]);
  const [showCourseManager,setShowCourseManager]=useState(false);

  // Sync selCourse when courseNames changes (e.g. after rename)
  React.useEffect(()=>{
    if(!courseNames.includes(selCourse)){
      setSelCourse(courseNames[0]||COURSES[0]);
    }
  },[JSON.stringify(data.courseNames)]);
  const [selGrade,setSelGrade]=useState('Grade 1');
  const [selLec,setSelLec]=useState(1);

  function contentKey(course,grade,lec){return `${course}||${grade}||${lec}`;}
  const key=contentKey(selCourse,selGrade,selLec);
  const c=data.content?.[key]||{title:'',description:'',videoUrl:'',materials:'',lectureName:`المحاضرة ${selLec}`};

  function setField(k){return e=>{
    const newContent={...data.content,[key]:{...c,[k]:e.target.value}};
    update('content',newContent);
  };}

  function countFilled(course,grade){
    return Array.from({length:16},(_,i)=>{
      const k=contentKey(course,grade,i+1);
      const lc=data.content?.[k];
      return lc?.description||lc?.videoUrl;
    }).filter(Boolean).length;
  }

  return <div>
    <div className="card" style={{marginBottom:16}}>
      <div className="section-title" style={{marginBottom:14}}>📚 اختر الكورس والـ Grade</div>
      <div className="form-row">
        <div className="form-group">
          <label className="form-label">الكورس</label>
          <div style={{display:'flex',gap:8}}>
            <select className="form-control" value={selCourse} onChange={e=>{setSelCourse(e.target.value);setSelLec(1);}}>
              {courseNames.map((c,i)=><option key={i} value={c}>{c}</option>)}
            </select>
            <button className="btn btn-primary btn-sm" style={{flexShrink:0,whiteSpace:'nowrap'}} onClick={()=>setShowCourseManager(true)}>⚙️ إدارة الكورسات</button>
          </div>
        </div>
        <div className="form-group">
          <label className="form-label">Grade</label>
          <div style={{display:'flex',gap:8}}>
            <select className="form-control" value={selGrade} onChange={e=>{setSelGrade(e.target.value);setSelLec(1);}}>
              {getGrades(data).map(g=><option key={g}>{g}</option>)}
            </select>
            <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
              <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>update('numGrades',Math.max(1,(data.numGrades||8)-1))} title="تقليل">−</button>
              <span style={{fontSize:12,fontWeight:700,color:'var(--primary)',minWidth:30,textAlign:'center'}}>{data.numGrades||8}</span>
              <button className="btn btn-ghost btn-sm btn-icon" onClick={()=>update('numGrades',(data.numGrades||8)+1)} title="زيادة">+</button>
            </div>
          </div>
        </div>
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
        {getGrades(data).map(g=>{
          const filled=countFilled(selCourse,g);
          return <div key={g} onClick={()=>{setSelGrade(g);setSelLec(1);}}
            style={{padding:'6px 14px',borderRadius:8,cursor:'pointer',fontSize:12,fontWeight:700,
              background:selGrade===g?'var(--primary)':'white',
              color:selGrade===g?'white':'var(--text)',
              border:`1.5px solid ${selGrade===g?'var(--primary)':'var(--border)'}`,transition:'.2s'}}>
            {g} {filled>0&&<span style={{opacity:.7}}>({filled}/16)</span>}
          </div>;
        })}
      </div>
    </div>
    <div className="grid-2" style={{alignItems:'flex-start',gap:20}}>
      <div className="card">
        <div className="section-title" style={{marginBottom:12}}>{selCourse} - {selGrade}</div>
        <div style={{display:'flex',flexDirection:'column',gap:4,maxHeight:500,overflowY:'auto'}}>
          {Array.from({length:16},(_,i)=>{
            const k=contentKey(selCourse,selGrade,i+1);
            const lc=data.content?.[k];
            const hasContent=lc?.description||lc?.videoUrl;
            const hasInstContent=lc?.instFiles||lc?.instNotes;
            return <div key={i+1} onClick={()=>setSelLec(i+1)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:10,cursor:'pointer',background:selLec===i+1?'var(--primary-bg)':'white',border:`1.5px solid ${selLec===i+1?'var(--primary)':'var(--border)'}`,transition:'.2s'}}>
              <div style={{width:30,height:30,borderRadius:8,background:selLec===i+1?'var(--primary)':'var(--border)',color:selLec===i+1?'white':'var(--gray)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:13,flexShrink:0}}>{i+1}</div>
              <span style={{flex:1,fontSize:13,fontWeight:selLec===i+1?700:500}}>{lc?.lectureName||`المحاضرة ${i+1}`}</span>
              <div style={{display:'flex',gap:3}}>
              {hasContent&&<span style={{fontSize:10,color:'var(--success)',fontWeight:700}}>🎓</span>}
              {hasInstContent&&<span style={{fontSize:10,color:'var(--orange-dark)',fontWeight:700}}>👨‍🏫</span>}
            </div>
            </div>;
          })}
        </div>
      </div>
      <div className="card">
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
          <div style={{width:34,height:34,background:'var(--primary)',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontWeight:800}}>{selLec}</div>
          <div>
            <div style={{fontWeight:800,fontSize:14,color:'var(--primary)'}}>{selCourse} — {selGrade}</div>
            <div style={{fontSize:12,color:'var(--gray)'}}>محاضرة {selLec}</div>
          </div>
        </div>
        <Input label="اسم المحاضرة" value={c.lectureName||`المحاضرة ${selLec}`} onChange={setField('lectureName')}/>
        <div style={{display:'flex',borderRadius:10,overflow:'hidden',border:'1.5px solid var(--border)',marginBottom:14}}>
          {[['student','🎓 محتوى الطالب'],['instructor','👨‍🏫 محتوى المحاضر']].map(([id,lbl])=>
            <div key={id} onClick={()=>setContentTab(id)} style={{flex:1,padding:'9px',textAlign:'center',cursor:'pointer',fontWeight:700,fontSize:13,
              background:contentTab===id?'var(--primary)':'white',color:contentTab===id?'white':'var(--gray)',transition:'.2s'}}>
              {lbl}
            </div>)}
        </div>
        {contentTab==='student'&&<div>
          <div style={{padding:'8px 12px',background:'#ECFDF5',borderRadius:8,marginBottom:10,fontSize:12,color:'var(--success)',fontWeight:600}}>
            🎓 يراه الطالب بعد حضور هذه المحاضرة
          </div>
          <Input label="عنوان المحتوى" value={c.title||''} onChange={setField('title')}/>
          <Textarea label="وصف المحاضرة" value={c.description||''} onChange={setField('description')} rows="4" placeholder="اكتب وصف المحاضرة..."/>
          <Input label="رابط الفيديو (YouTube)" value={c.videoUrl||''} onChange={setField('videoUrl')} placeholder="https://youtube.com/..."/>
          <Textarea label="روابط مواد الطالب (سطر لكل رابط)" value={c.materials||''} onChange={setField('materials')} rows="3" placeholder="https://drive.google.com/..."/>
          <div className="divider"/>
          <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>❓ أسئلة تفاعلية للطالب</div>
          <ContentQuestionsEditor data={data} update={update} ckey={key} lang="ar"/>
        </div>}
        {contentTab==='instructor'&&<div>
          <div style={{padding:'8px 12px',background:'#FFFBEB',borderRadius:8,marginBottom:10,fontSize:12,color:'var(--orange-dark)',fontWeight:600}}>
            👨‍🏫 يراه المحاضر قبل هذه المحاضرة (المحاضرة القادمة في مجموعته)
          </div>
          <Input label="ملاحظات للمحاضر" value={c.instNotes||''} onChange={setField('instNotes')} placeholder="تعليمات خاصة بهذه المحاضرة..."/>
          <Textarea label="روابط ملفات المحاضر (سطر لكل رابط)" value={c.instFiles||''} onChange={setField('instFiles')} rows="5" placeholder="https://drive.google.com/..."/>
        </div>}
        <div className="alert alert-success" style={{marginTop:12}}>✅ يتم الحفظ تلقائياً</div>
      </div>
    </div>
    {showCourseManager&&<CourseManagerModal
      courseNames={courseNames}
      onSave={newNames=>{
        const oldNames=courseNames;
        const renamedMap={};
        oldNames.forEach((old,i)=>{if(newNames[i]&&newNames[i]!==old)renamedMap[old]=newNames[i];});
        if(Object.keys(renamedMap).length>0){
          const newStudents=data.students.map(s=>s.course&&renamedMap[s.course]?{...s,course:renamedMap[s.course]}:s);
          update('students',newStudents);
          const newContent={};
          Object.entries(data.content||{}).forEach(([k,v])=>{
            const parts=k.split('||');
            if(parts.length===3&&renamedMap[parts[0]]){parts[0]=renamedMap[parts[0]];}
            newContent[parts.join('||')]=v;
          });
          update('content',newContent);
        }
        update('courseNames',newNames);
        if(selCourse&&renamedMap[selCourse])setSelCourse(renamedMap[selCourse]);
      }}
      onClose={()=>setShowCourseManager(false)}
    />}
  </div>;
}

// ─── BROADCAST MODULE ─────────────────────────────────────────────────────────

  const [filter,setFilter]=useState('all');
  const [selIds,setSelIds]=useState([]);
  const [sent,setSent]=useState(false);
  const [autoIdx,setAutoIdx]=useState(-1);

  const allRecipients=useMemo(()=>{
    let list=[];
    if(filter==='all')list=data.students.filter(s=>s.phone&&s.status!=='suspended').map(s=>({...s,_type:'student'}));
    else if(filter==='all_inc_inactive')list=data.students.filter(s=>s.phone).map(s=>({...s,_type:'student'}));
    else if(filter==='trials')list=(data.trials||[]).filter(t=>t.phone&&!t.converted).map(t=>({...t,_type:'trial'}));
    else if(filter==='unpaid'){const cm=new Date().toISOString().substr(0,7);list=data.students.filter(s=>s.phone&&s.fee&&data.attendance.filter(a=>a.studentId===s.id).length>=4&&!data.payments.some(p=>p.studentId===s.id&&p.date?.startsWith(cm))).map(s=>({...s,_type:'student'}));}
    else list=data.students.filter(s=>s.phone&&s.groupId===filter).map(s=>({...s,_type:'student'}));
    return list;
  },[data,filter]);

  useEffect(()=>{setSelIds(allRecipients.map(s=>s.id));setSent(false);},[filter]);

  const selected=allRecipients.filter(s=>selIds.includes(s.id));
  const toggleSel=id=>setSelIds(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const selAll=()=>setSelIds(allRecipients.map(s=>s.id));
  const selNone=()=>setSelIds([]);

  function openAll(){
    if(!msg.trim()){alert(lang==='ar'?'اكتب الرسالة أولاً':'Write your message first');return;}
    if(selected.length===0){alert(lang==='ar'?'اختر مستلماً على الأقل':'Select at least one recipient');return;}
    // Open all chats sequentially with delay so browser doesn't block
    selected.forEach((s,i)=>{
      setTimeout(()=>{
        const text=msg.replace(/{name}/g,s.name||'');
        window.open(waLink(s.phone,text),'_blank');
      },i*700);
    });
    setSent(true);
    setTimeout(()=>setSent(false),6000);
  }

  return <div>
    <div style={{background:'linear-gradient(135deg,#25D366,#128C7E)',borderRadius:16,padding:'20px 24px',marginBottom:20,display:'flex',alignItems:'center',gap:16}}>
      <div style={{width:56,height:56,background:'rgba(255,255,255,.15)',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,flexShrink:0}}>📢</div>
      <div>
        <div style={{color:'white',fontWeight:900,fontSize:18}}>{lang==='ar'?'الإرسال الجماعي عبر واتساب':'WhatsApp Bulk Messaging'}</div>
        <div style={{color:'rgba(255,255,255,.8)',fontSize:13,marginTop:4}}>{lang==='ar'?'أرسل رسالة لكل الطلاب أو مجموعة محددة بخطوة واحدة':'Send a message to all students or a specific group in one step'}</div>
      </div>
    </div>
    <div className="grid-2" style={{alignItems:'flex-start',gap:20}}>
      <div className="card">
        <div style={{fontWeight:800,fontSize:15,marginBottom:16,color:'var(--primary)'}}>✍️ {lang==='ar'?'كتابة الرسالة':'Compose Message'}</div>
        <Select label={lang==='ar'?'إرسال إلى':'Send To'} value={filter} onChange={e=>setFilter(e.target.value)}>
          <option value="all">{lang==='ar'?'🎓 جميع الطلاب النشطين':'🎓 All Active Students'}</option>
          <option value="all_inc_inactive">{lang==='ar'?'👥 جميع الطلاب (نشطين + غير نشطين)':'👥 All Students (Active + Inactive)'}</option>
          <option value="trials">{lang==='ar'?'🆓 المسجلون للمحاضرة المجانية':'🆓 Free Trial Leads'}</option>
          <option value="unpaid">{lang==='ar'?'💰 المتأخرون في الدفع':'💰 Overdue Payments'}</option>
          {data.groups.map(g=><option key={g.id} value={g.id}>👥 {g.name}</option>)}
        </Select>
        <Textarea label={lang==='ar'?'نص الرسالة':'Message Text'} value={msg} onChange={e=>{setMsg(e.target.value);setSent(false);}} rows="7"
          placeholder={lang==='ar'?'اكتب رسالتك هنا... استخدم {name} وسيُستبدل باسم كل شخص':'Write your message here... Use {name} for person name'}/>
        {msg&&<div style={{background:'var(--primary-bg)',borderRadius:10,padding:'12px 14px',marginBottom:14,border:'1.5px solid var(--primary)'}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--primary)',marginBottom:6}}>👁️ {lang==='ar'?'معاينة':'Preview'}</div>
          <div style={{fontSize:13,lineHeight:1.7,whiteSpace:'pre-wrap'}}>{msg.replace(/{name}/g,selected[0]?.name||'الطالب')}</div>
        </div>}
        <button className="btn btn-wa" style={{width:'100%',padding:'13px',fontSize:14,fontWeight:800,justifyContent:'center'}} onClick={openAll}>
          💬 {lang==='ar'?`إرسال لـ ${selected.length} شخص`:`Send to ${selected.length} people`}
        </button>
        {sent&&<div className="alert alert-success" style={{marginTop:10}}>✅ {lang==='ar'?`تم فتح ${selected.length} محادثة — اسمح للمتصفح بالـ popups`:`Opened ${selected.length} chats — allow popups in browser`}</div>}
        <div style={{marginTop:8,fontSize:12,color:'var(--gray)',background:'var(--light-gray)',borderRadius:8,padding:'8px 12px'}}>
          ⚠️ {lang==='ar'?'واتساب لا يسمح بالإرسال الآلي — سيتم فتح المحادثات تلقائياً مع الرسالة جاهزة، فقط اسمح للمتصفح بالـ popups':'WhatsApp does not allow automated sending — chats will open automatically with message ready, just allow browser popups'}
        </div>
      </div>
      <div className="card">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
          <div>
            <div style={{fontWeight:800,fontSize:15,color:'var(--primary)'}}>👥 {lang==='ar'?'المستلمون':'Recipients'}</div>
            <div style={{fontSize:12,color:'var(--gray)',marginTop:2}}>{selected.length} / {allRecipients.length} {lang==='ar'?'محدد':'selected'}</div>
          </div>
          <div style={{display:'flex',gap:6}}>
            <button className="btn btn-ghost btn-sm" onClick={selAll}>{lang==='ar'?'الكل':'All'}</button>
            <button className="btn btn-ghost btn-sm" onClick={selNone}>{lang==='ar'?'لا شيء':'None'}</button>
          </div>
        </div>
        {allRecipients.length===0?
          <div style={{textAlign:'center',color:'var(--gray)',padding:40}}>
            <div style={{fontSize:40,marginBottom:8}}>📭</div>
            <div style={{fontWeight:700}}>{lang==='ar'?'لا يوجد أرقام هاتف':'No phone numbers'}</div>
          </div>:
          <div style={{maxHeight:'calc(100vh - 340px)',overflowY:'auto',display:'flex',flexDirection:'column',gap:6,paddingLeft:4}}>
            {allRecipients.map(s=>{
              const isSel=selIds.includes(s.id);
              return <div key={s.id} onClick={()=>toggleSel(s.id)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:10,cursor:'pointer',
                background:isSel?'var(--primary-bg)':'white',
                border:`1.5px solid ${isSel?'var(--primary)':'var(--border)'}`,
                transition:'.15s',userSelect:'none'}}>
                <div style={{width:20,height:20,borderRadius:5,border:`2px solid ${isSel?'var(--primary)':'#CBD5E0'}`,background:isSel?'var(--primary)':'white',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  {isSel&&<span style={{color:'white',fontSize:13,fontWeight:900}}>✓</span>}
                </div>
                <div className="avatar" style={{width:32,height:32,fontSize:13,flexShrink:0}}>{s.name?.[0]||'؟'}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.name}</div>
                  <div style={{fontSize:11,color:'var(--gray)',fontFamily:'monospace'}}>{s.phone}</div>
                </div>
                {isSel&&msg&&<a onClick={e=>e.stopPropagation()} className="btn btn-wa btn-sm btn-icon" style={{flexShrink:0}} href={waLink(s.phone,msg.replace(/{name}/g,s.name))} target="_blank" rel="noreferrer">💬</a>}
              </div>;
            })}
          </div>}
      </div>
    </div>
  </div>;
}


// ─── USERS MODULE ─────────────────────────────────────────────────────────────
function UsersModule({data,update,currentUser}){
  const [editUser,setEditUser]=useState(null);
  const [editPass,setEditPass]=useState('');
  const [editUname,setEditUname]=useState('');
  const [showPass,setShowPass]=useState(false);
  // Admin own credentials
  const [myUname,setMyUname]=useState('');
  const [myPass,setMyPass]=useState('');
  const [myPass2,setMyPass2]=useState('');
  const [myMsg,setMyMsg]=useState('');

  function saveUserEdit(){
    if(!editUname.trim()){alert('اسم المستخدم لا يمكن أن يكون فارغاً');return;}
    const users=data.users.map(u=>u.id===editUser.id?{...u,username:editUname,password:editPass||u.password}:u);
    update('users',users);setEditUser(null);
  }
  function openEdit(u){setEditUser(u);setEditUname(u.username);setEditPass('');}

  function saveMyCredentials(){
    if(!myUname.trim()){setMyMsg('❌ اسم المستخدم مطلوب');return;}
    if(myPass&&myPass!==myPass2){setMyMsg('❌ كلمتا المرور غير متطابقتين');return;}
    const users=data.users.map(u=>u.id===currentUser.id?{...u,username:myUname,password:myPass||u.password}:u);
    update('users',users);
    setMyMsg('✅ تم تحديث بيانات الدخول بنجاح');
    setMyPass('');setMyPass2('');
    setTimeout(()=>setMyMsg(''),3000);
  }

  const adminUser=data.users.find(u=>u.id===currentUser.id);
  const nonStudentUsers=(data.users||[]).filter(u=>u.role!=='student');
  const roleLabel={admin:'إدارة',instructor:'محاضر',student:'طالب'};
  const roleColor={admin:'badge-danger',instructor:'badge-orange',student:'badge-success'};

  return <div>
    {/* Admin own credentials card */}
    <div className="card" style={{marginBottom:20,border:'2px solid var(--primary)'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <div style={{width:44,height:44,background:'var(--primary)',borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>🔐</div>
        <div><div style={{fontWeight:800,fontSize:15,color:'var(--primary)'}}>بيانات دخول الإدارة</div><div style={{fontSize:12,color:'var(--gray)'}}>تغيير اسم المستخدم وكلمة المرور الخاصة بك</div></div>
      </div>
      {myMsg&&<div className={`alert ${myMsg.startsWith('✅')?'alert-success':'alert-danger'}`}>{myMsg}</div>}
      <div className="form-row">
        <Input label="اسم المستخدم الجديد" value={myUname||adminUser?.username||''} onChange={e=>setMyUname(e.target.value)} placeholder={adminUser?.username}/>
        <div className="form-group">
          <label className="form-label">اسم المستخدم الحالي</label>
          <div className="cred-box"><span className="cred-text">{adminUser?.username}</span></div>
        </div>
      </div>
      <div className="form-row">
        <Input label="كلمة المرور الجديدة" type={showPass?'text':'password'} value={myPass} onChange={e=>setMyPass(e.target.value)} placeholder="أدخل كلمة مرور جديدة"/>
        <Input label="تأكيد كلمة المرور" type={showPass?'text':'password'} value={myPass2} onChange={e=>setMyPass2(e.target.value)} placeholder="أعد إدخال كلمة المرور"/>
      </div>
      <div style={{display:'flex',gap:10,alignItems:'center'}}>
        <button className="btn btn-primary" onClick={saveMyCredentials}>💾 حفظ التغييرات</button>
        <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',fontSize:13,color:'var(--gray)',fontWeight:600}}>
          <input type="checkbox" checked={showPass} onChange={e=>setShowPass(e.target.checked)}/> إظهار كلمة المرور
        </label>
      </div>
    </div>

    <div className="card">
      <div className="section-title" style={{marginBottom:16}}>جميع المستخدمين ({data.users.length})</div>
      <div className="table-wrap"><table>
        <thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الدور</th><th>إجراءات</th></tr></thead>
        <tbody>{nonStudentUsers.map(u=><tr key={u.id}>
          <td><div style={{display:'flex',alignItems:'center',gap:8}}>
            <div className="avatar" style={{fontSize:13}}>{u.name?.[0]||'؟'}</div>
            <div style={{fontWeight:700}}>{u.name}</div>
          </div></td>
          <td><span className="badge badge-primary" style={{fontFamily:'monospace',fontSize:12}}>{u.username}</span></td>
          <td><div style={{fontFamily:'monospace',fontSize:12,color:'var(--gray)',letterSpacing:1}}>{u.role==='student'?'••••••••':u.password}</div></td>
          <td><span className={`badge ${roleColor[u.role]||'badge-primary'}`}>{roleLabel[u.role]||u.role}</span></td>
          <td><button className="btn btn-outline btn-sm" onClick={()=>openEdit(u)}>✏️ تعديل</button></td>
        </tr>)}</tbody>
      </table></div>
    </div>
    {editUser&&<Modal show={!!editUser} onClose={()=>setEditUser(null)} title={`تعديل: ${editUser.name}`} size="modal-sm"
      footer={<><button className="btn btn-ghost" onClick={()=>setEditUser(null)}>إلغاء</button><button className="btn btn-primary" onClick={saveUserEdit}>💾 حفظ</button></>}>
      <div className="alert alert-warning" style={{fontSize:12}}>⚠️ تغيير بيانات هذا المستخدم سيؤثر على دخوله للمنصة</div>
      <Input label="اسم المستخدم" value={editUname} onChange={e=>setEditUname(e.target.value)}/>
      <Input label="كلمة المرور الجديدة" type="password" value={editPass} onChange={e=>setEditPass(e.target.value)} placeholder="اتركه فارغاً للإبقاء على الحالية"/>
    </Modal>}
  </div>;
}

// ─── ANSWER DISPLAY COMPONENT (shared) ───────────────────────────────────────
function AnswerDisplay({question, ans, qi}){
  const type = question.type || 'mcq';  // default to mcq if no type set
  const isCorrect = type==='mcq' ? ans===question.correct : null;

  const wrapStyle = {
    marginBottom:8, borderRadius:10,
    background: isCorrect===true ? '#ECFDF5' : isCorrect===false ? '#FEF2F2' : '#F8FAFF',
    border: `1.5px solid ${isCorrect===true?'#86EFAC':isCorrect===false?'#FCA5A5':'#C7D7FD'}`,
    overflow:'hidden'
  };

  return <div style={wrapStyle}>
    {/* Question */}
    <div style={{padding:'8px 12px',background:'rgba(0,0,0,.03)',borderBottom:'1px solid rgba(0,0,0,.06)',display:'flex',alignItems:'center',gap:8}}>
      <span style={{width:22,height:22,borderRadius:'50%',background:'var(--primary)',color:'white',fontSize:11,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{qi+1}</span>
      <span style={{fontSize:12.5,fontWeight:700,flex:1}}>{question.q}</span>
      {question.imageUrl&&<img src={question.imageUrl} alt="" style={{height:36,borderRadius:5,objectFit:'cover'}} onError={e=>e.target.style.display='none'}/>}
    </div>

    {/* Answer */}
    <div style={{padding:'10px 12px'}}>
      {/* MCQ */}
      {type==='mcq'&&<>
        {(question.options||[]).filter(Boolean).map((opt,oi)=>{
          const chosen = ans===oi;
          const correct = oi===question.correct;
          if(!chosen && !correct) return null; // only show chosen + correct
          return <div key={oi} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 10px',borderRadius:8,marginBottom:4,
            background:correct?'#DCFCE7':chosen&&!correct?'#FEE2E2':'transparent',
            border:`1.5px solid ${correct?'#86EFAC':chosen&&!correct?'#FCA5A5':'transparent'}`}}>
            <span style={{fontSize:14}}>{correct?'✅':chosen&&!correct?'❌':'○'}</span>
            <span style={{fontSize:13,fontWeight:700,flex:1}}>{opt}</span>
            {correct&&<span style={{fontSize:10,background:'#BBF7D0',color:'#166534',borderRadius:4,padding:'1px 5px',fontWeight:800}}>الصحيحة</span>}
            {chosen&&!correct&&<span style={{fontSize:10,background:'#FECACA',color:'#991B1B',borderRadius:4,padding:'1px 5px',fontWeight:800}}>إجابة الطالب</span>}
          </div>;
        })}
        {ans==null&&<div style={{fontSize:12,color:'var(--gray)',fontStyle:'italic',display:'flex',alignItems:'center',gap:6}}>
          <span>⚪</span><span>لم يختر إجابة</span>
        </div>}
        {/* Show all options if student got it wrong to give full context */}
        {ans!=null&&ans!==question.correct&&(question.options||[]).filter(Boolean).map((opt,oi)=>{
          if(oi===question.correct||oi===ans) return null;
          return null; // already shown above
        })}
      </>}

      {/* Text */}
      {type==='text'&&<div>
        <div style={{fontSize:11,color:'var(--gray)',marginBottom:5,fontWeight:700}}>✍️ إجابة الطالب:</div>
        {ans ? <div style={{padding:'8px 12px',background:'white',border:'1.5px solid #C7D7FD',borderRadius:8,fontSize:13,fontWeight:600,color:'#1E3A5F',lineHeight:1.6,whiteSpace:'pre-wrap'}}>{ans}</div>
          : <div style={{fontSize:12,color:'var(--gray)',fontStyle:'italic'}}>⚪ لم يكتب إجابة</div>}
      </div>}

      {/* Image */}
      {type==='image_answer'&&<div>
        <div style={{fontSize:11,color:'var(--gray)',marginBottom:6,fontWeight:700}}>🖼️ صورة الإجابة:</div>
        {ans ? <div style={{textAlign:'center'}}>
          <img src={ans} alt="إجابة الطالب" style={{maxWidth:'100%',maxHeight:200,borderRadius:10,border:'2px solid #C7D7FD',objectFit:'contain',cursor:'pointer'}}
            onClick={()=>window.open(ans,'_blank')}/>
          <div style={{fontSize:10,color:'var(--gray)',marginTop:4}}>اضغط لعرض بالحجم الكامل</div>
        </div>
        : <div style={{fontSize:12,color:'var(--gray)',fontStyle:'italic'}}>⚪ لم يرفع صورة</div>}
      </div>}

      {/* Voice */}
      {type==='voice_answer'&&<div>
        <div style={{fontSize:11,color:'var(--gray)',marginBottom:6,fontWeight:700}}>🎙️ تسجيل صوتي:</div>
        {ans ? <div style={{background:'linear-gradient(135deg,#EEF7FF,#DBEAFE)',borderRadius:10,padding:'10px 14px',border:'1.5px solid #93C5FD',display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:22,flexShrink:0}}>🎵</span>
          <audio src={ans} controls style={{flex:1,height:34}}/>
        </div>
        : <div style={{fontSize:12,color:'var(--gray)',fontStyle:'italic'}}>⚪ لم يسجّل صوتاً</div>}
      </div>}
    </div>
  </div>;
}

// ─── INSTRUCTOR HOMEWORK TAB ─────────────────────────────────────────────────
function InstructorHomeworkTab({data,update,myStudents,myInst,lang='ar'}){
  const [selStudent,setSelStudent]=useState(null);
  const [selQuiz,setSelQuiz]=useState(null);
  const [gradeVal,setGradeVal]=useState('');
  const [gradeNote,setGradeNote]=useState('');

  function getQuizzes(sid){
    return Object.entries(data.quizResults||{})
      .filter(([k])=>k.startsWith(sid+'_'))
      .map(([k,v])=>({...v,key:k}))
      .sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt));
  }
  function saveGrade(quizKey){
    if(!gradeVal){alert('أدخل الدرجة');return;}
    update('quizResults',{...(data.quizResults||{}),[quizKey]:{
      ...(data.quizResults||{})[quizKey],
      teacherGrade:+gradeVal,teacherNote:gradeNote,gradedAt:new Date().toISOString()
    }});
    setGradeVal('');setGradeNote('');setSelQuiz(null);
  }

  const pendingCount=myStudents.filter(s=>getQuizzes(s.id).some(q=>q.teacherGrade==null)).length;

  return <div className="grid-2" style={{alignItems:'start',gap:16}}>
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div style={{fontWeight:800,fontSize:15}}>📝 {lang==='ar'?'واجبات طلابي':'My Students Homework'}</div>
        {pendingCount>0&&<span className="badge badge-warning">{pendingCount} بانتظار التقييم</span>}
      </div>
      {myStudents.length===0?<div style={{textAlign:'center',color:'var(--gray)',padding:30}}>لا يوجد طلاب</div>:
      myStudents.map(s=>{
        const quizzes=getQuizzes(s.id);
        const ungraded=quizzes.filter(q=>q.teacherGrade==null).length;
        const isSel=selStudent===s.id;
        return <div key={s.id} style={{marginBottom:8}}>
          <div onClick={()=>setSelStudent(isSel?null:s.id)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderRadius:10,cursor:'pointer',
            background:isSel?'var(--primary-bg)':'white',border:`1.5px solid ${isSel?'var(--primary)':'var(--border)'}`,transition:'.15s',userSelect:'none'}}>
            <div className="avatar" style={{flexShrink:0}}>{s.name[0]}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:13}}>{s.name}</div>
              <div style={{fontSize:11,color:'var(--gray)'}}>{quizzes.length} واجب مُسلَّم</div>
            </div>
            {ungraded>0&&<span className="badge badge-warning">{ungraded} جديد</span>}
            <span style={{color:'var(--gray)',fontSize:12}}>{isSel?'▲':'▼'}</span>
          </div>
          {isSel&&quizzes.length>0&&<div style={{padding:'10px 14px 4px',borderRadius:'0 0 10px 10px',border:'1.5px solid var(--primary)',borderTop:'none',background:'var(--primary-bg)'}}>
            {quizzes.map(q=>{
              const ckey=q.key.split('_').slice(1).join('_');
              const qs=(data.lectureQs||{})[ckey]||[];
              return <div key={q.key} style={{padding:'10px 12px',borderRadius:9,marginBottom:8,background:'white',border:`1.5px solid ${q.teacherGrade!=null?'#A7F3D0':'#FDE68A'}`}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:13}}>محاضرة {q.lectureNum}</div>
                    <div style={{fontSize:11,color:'var(--gray)'}}>{q.submittedAt?new Date(q.submittedAt).toLocaleDateString('ar-EG'):''} • النتيجة: {q.score}/{q.total}</div>
                  </div>
                  <div style={{display:'flex',gap:6,alignItems:'center'}}>
                    {q.teacherGrade!=null?<span style={{fontWeight:800,color:'var(--success)',fontSize:13}}>🎯 {q.teacherGrade}/100</span>:
                    <button className="btn btn-primary btn-sm" style={{fontSize:11}} onClick={e=>{e.stopPropagation();setSelQuiz({key:q.key,lectureNum:q.lectureNum,score:q.score,total:q.total,studentName:s.name});}}>✏️ تقييم</button>}
                  </div>
                </div>
                {/* Show actual answers */}
                {qs.length>0&&<div style={{borderTop:'1px solid var(--border)',paddingTop:8}}>
                  <div style={{fontSize:11,fontWeight:700,color:'var(--primary)',marginBottom:6}}>📋 إجابات الطالب:</div>
                  {qs.map((question,qi)=><AnswerDisplay key={qi} question={question} ans={q.answers?.[qi]} qi={qi}/>)}
                </div>}
                {q.teacherNote&&<div style={{fontSize:11,color:'var(--gray)',marginTop:4,fontStyle:'italic',borderTop:'1px solid var(--border)',paddingTop:6}}>ملاحظة: {q.teacherNote}</div>}
              </div>;
            })}
          </div>}
        </div>;
      })}
    </div>
    <div>
      {selQuiz?<div className="card" style={{border:'1.5px solid var(--primary)'}}>
        <div style={{fontWeight:800,fontSize:15,marginBottom:12,color:'var(--primary)'}}>✏️ تقييم — {selQuiz.studentName} — م{selQuiz.lectureNum}</div>
        <div style={{padding:'10px 14px',background:'var(--primary-bg)',borderRadius:10,marginBottom:12}}>
          <div style={{fontSize:13}}>النتيجة التلقائية: <strong>{selQuiz.score}/{selQuiz.total}</strong></div>
        </div>
        <Input label="الدرجة (من 100)" type="number" value={gradeVal} onChange={e=>setGradeVal(e.target.value)} placeholder="85"/>
        <Textarea label="ملاحظة للطالب (اختياري)" value={gradeNote} onChange={e=>setGradeNote(e.target.value)} rows="2"/>
        <div style={{display:'flex',gap:8,marginTop:4}}>
          <button className="btn btn-primary" style={{flex:1}} onClick={()=>saveGrade(selQuiz.key)}>💾 حفظ التقييم</button>
          <button className="btn btn-ghost" onClick={()=>setSelQuiz(null)}>إلغاء</button>
        </div>
      </div>:
      <div className="card" style={{textAlign:'center',padding:40,color:'var(--gray)'}}>
        <div style={{fontSize:40,marginBottom:8}}>📝</div>
        <div style={{fontWeight:700}}>اختر طالباً لمراجعة واجباته</div>
      </div>}
    </div>
  </div>;
}

// ─── INSTRUCTOR PORTAL ────────────────────────────────────────────────────────
function InstructorPanel({data,setData,currentUser,setCurrentUser,lang='ar',toggleLang}){
  const [tab,setTab]=useState('students');
  const [evalStudent,setEvalStudent]=useState(null);
  const [evalStars,setEvalStars]=useState(0);
  const [evalLecture,setEvalLecture]=useState(1);
  const [evalNote,setEvalNote]=useState('');
  const [evalMsg,setEvalMsg]=useState('');
  const update=(k,v)=>setData(p=>{const n={...p,[k]:v};save(n);return n;});
  const myInst=data.instructors.find(i=>data.users.find(u=>u.instructorId===i.id&&u.id===currentUser.id));
  const myGroups=data.groups.filter(g=>g.instructorIds?.includes(myInst?.id));
  const myStudents=data.students.filter(s=>myGroups.some(g=>g.id===s.groupId)&&s.status!=='suspended');

  function submitEval(){
    if(!evalStars){setEvalMsg(lang==='ar'?'❌ اختر تقييماً':'❌ Select a rating');return;}
    const newNote={
      id:makeId(),
      studentId:evalStudent.id,
      parentName:lang==='ar'?`المحاضر: ${myInst?.name||currentUser.name}`:`Instructor: ${myInst?.name||currentUser.name}`,
      note:(evalNote?`[م${evalLecture}] ${evalNote}`:(lang==='ar'?`[المحاضرة ${evalLecture}] تقييم المحاضر: ${evalStars}/5 نجوم`:`[Lecture ${evalLecture}] Instructor rating: ${evalStars}/5 stars`)),
      stars:evalStars,
      lectureNum:evalLecture,
      fromInstructor:true,
      instructorName:myInst?.name||currentUser.name,
      createdAt:today(),
      read:false
    };
    update('parentNotes',[...(data.parentNotes||[]),newNote]);
    setEvalMsg(lang==='ar'?'✅ تم إرسال التقييم لولي الأمر':'✅ Evaluation sent to parent');
    setTimeout(()=>{setEvalStudent(null);setEvalStars(0);setEvalNote('');setEvalMsg('');},2000);
  }

  const [attF,setAttF]=useState({studentId:'',lectureNum:'1',date:today()});
  const [attMsg,setAttMsg]=useState('');

  function markAtt(){
    if(!attF.studentId){setAttMsg('❌ اختر طالباً');return;}
    const exists=data.attendance.some(a=>a.studentId===attF.studentId&&a.lectureNum===+attF.lectureNum);
    if(exists){setAttMsg('⚠️ تم تسجيل الحضور مسبقاً');return;}
    const ln=(data.lectureNames||LECTURE_NAMES)[+attF.lectureNum-1];
    update('attendance',[...data.attendance,{id:makeId(),studentId:attF.studentId,lectureNum:+attF.lectureNum,lectureName:ln,date:attF.date}]);
    setAttMsg('✅ تم تسجيل الحضور');setTimeout(()=>setAttMsg(''),3000);
  }

  return <div className="simple-layout">
    <header className="simple-header">
      <div style={{display:'flex',alignItems:'center',gap:12}}>
        <div style={{width:38,height:38,background:'var(--orange)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>🤖</div>
        <div style={{color:'white',fontWeight:800,fontSize:17}}>روبوتيكو</div>
        <span style={{background:'var(--orange)',color:'white',fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:6}}>محاضر</span>
      </div>
      <div className="simple-nav">
        <div className={`simple-nav-item ${tab==='students'?'active':''}`} onClick={()=>setTab('students')}>👥 {lang==='ar'?'طلابي':'My Students'}</div>
        <div className={`simple-nav-item ${tab==='attendance'?'active':''}`} onClick={()=>setTab('attendance')}>✅ {lang==='ar'?'تسجيل حضور':'Mark Attendance'}</div>
        <div className={`simple-nav-item ${tab==='homework'?'active':''}`} style={{position:'relative'}} onClick={()=>setTab('homework')}>
          📝 {lang==='ar'?'الواجبات':'Homework'}
          {(()=>{const cnt=myStudents.filter(s=>Object.entries(data.quizResults||{}).some(([k,v])=>k.startsWith(s.id+'_')&&v.teacherGrade==null)).length;return cnt>0?<span style={{position:'absolute',top:2,right:2,background:'var(--danger)',color:'white',borderRadius:'50%',width:16,height:16,fontSize:10,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center'}}>{cnt}</span>:null;})()}
        </div>
        <div className={`simple-nav-item ${tab==='tasks'?'active':''}`} style={{position:'relative'}} onClick={()=>setTab('tasks')}>
          📋 {lang==='ar'?'مهامي':'My Tasks'}
          {(data.instTasks||[]).filter(t=>t.instructorId===myInst?.id&&!t.done).length>0&&<span style={{position:'absolute',top:2,right:2,background:'var(--danger)',color:'white',borderRadius:'50%',width:16,height:16,fontSize:10,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center'}}>{(data.instTasks||[]).filter(t=>t.instructorId===myInst?.id&&!t.done).length}</span>}
        </div>
        <div className={`simple-nav-item ${tab==='content'?'active':''}`} onClick={()=>setTab('content')}>📁 {lang==='ar'?'ملفاتي':'My Files'}</div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <span style={{color:'rgba(255,255,255,.8)',fontSize:13,fontWeight:600}}>{currentUser.name}</span>
        <button onClick={toggleLang} className="btn btn-ghost btn-sm" style={{fontWeight:700}}>🌐 {T[lang].lang}</button>
        <button className="btn btn-ghost btn-sm" onClick={()=>setCurrentUser(null)}>{T[lang].logout}</button>
      </div>
    </header>
    <div className="simple-content">
      {tab==='students'&&<div>
        <div style={{marginBottom:20}}>
          <div style={{fontSize:20,fontWeight:800,color:'var(--primary)',marginBottom:4}}>مرحباً، {currentUser.name} 👋</div>
          <div style={{fontSize:13,color:'var(--gray)'}}>لديك {myGroups.length} مجموعة و {myStudents.length} طالب</div>
        </div>
        {myGroups.map(g=>{
          const gStudents=myStudents.filter(s=>s.groupId===g.id);
          return <div key={g.id} className="card" style={{marginBottom:16}}>
            <div className="section-header">
              <div>
                <span className="section-title">{g.name}</span>
                <div style={{display:'flex',gap:4,marginTop:4}}>
                  {g.days?.map(d=><span key={d} className="badge badge-primary" style={{fontSize:11}}>{d}</span>)}
                  {g.time&&<span className="badge badge-orange" style={{fontSize:11}}>⏰ {g.time}</span>}
                </div>
              </div>
              <span className="badge badge-success">{gStudents.length} طالب</span>
            </div>
            <div className="table-wrap"><table>
              <thead><tr><th>رقم</th><th>الطالب</th><th>الحضور</th><th>آخر محاضرة</th><th>{lang==='ar'?'تقييم':'Eval'}</th></tr></thead>
              <tbody>{gStudents.length===0?<tr><td colSpan="5" className="empty-row">لا يوجد طلاب في هذه المجموعة</td></tr>:
              gStudents.map(s=>{
                const atts=data.attendance.filter(a=>a.studentId===s.id);
                const last=atts.length?atts.sort((a,b)=>b.lectureNum-a.lectureNum)[0]:null;
                return <tr key={s.id}>
                  <td><span className="badge badge-primary">#{s.studentId}</span></td>
                  <td><div style={{display:'flex',alignItems:'center',gap:8}}><div className="avatar">{s.name[0]}</div><span style={{fontWeight:700}}>{s.name}</span></div></td>
                  <td><span className="badge badge-success">{atts.length}/16</span></td>
                  <td>{last?`م${last.lectureNum} - ${formatDate(last.date)}`:<span style={{color:'var(--gray)',fontSize:12}}>لم يحضر</span>}</td>
                  <td><button className="btn btn-orange btn-sm" style={{fontSize:11}} onClick={()=>{setEvalStudent(s);setEvalStars(0);setEvalLecture(1);setEvalNote('');setEvalMsg('');}}>⭐ {lang==='ar'?'تقييم':'Eval'}</button></td>
                </tr>;
              })}</tbody>
            </table></div>
          </div>;
        })}
        {myGroups.length===0&&<div className="card" style={{textAlign:'center',padding:60,color:'var(--gray)'}}>
          <div style={{fontSize:48,marginBottom:12}}>👥</div>
          <div style={{fontSize:16,fontWeight:700}}>{lang==='ar'?'لم يتم تعيينك في أي مجموعة بعد':'You have no assigned groups yet'}</div>
        </div>}
      </div>}
      {tab==='attendance'&&<div className="card" style={{maxWidth:500}}>
        <div className="section-title" style={{marginBottom:16}}>تسجيل حضور طالب</div>
        {attMsg&&<div className={`alert ${attMsg.startsWith('✅')?'alert-success':'alert-warning'}`}>{attMsg}</div>}
        <Select label="الطالب" value={attF.studentId} onChange={e=>setAttF(p=>({...p,studentId:e.target.value}))}>
          <option value="">-- اختر طالباً --</option>
          {myStudents.map(s=><option key={s.id} value={s.id}>#{s.studentId} - {s.name}</option>)}
        </Select>
        <Select label="المحاضرة" value={attF.lectureNum} onChange={e=>setAttF(p=>({...p,lectureNum:e.target.value}))}>
          {Array.from({length:16},(_,i)=><option key={i+1} value={i+1}>المحاضرة {i+1}</option>)}
        </Select>
        <Input label="التاريخ" type="date" value={attF.date} onChange={e=>setAttF(p=>({...p,date:e.target.value}))}/>
        <button className="btn btn-primary" style={{width:'100%'}} onClick={markAtt}>✅ تسجيل الحضور</button>
      </div>}

      {tab==='homework'&&<InstructorHomeworkTab data={data} update={update} myStudents={myStudents} myInst={myInst} lang={lang}/>}

      {tab==='tasks'&&<div style={{maxWidth:600}}>
        {(()=>{
          const myTasks=(data.instTasks||[]).filter(t=>t.instructorId===myInst?.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
          return myTasks.length===0?<div className="card" style={{textAlign:'center',padding:40,color:'var(--gray)'}}>
            <div style={{fontSize:36,marginBottom:8}}>📋</div>
            <div style={{fontWeight:700}}>{lang==='ar'?'لا توجد مهام مسندة إليك':'No tasks assigned to you'}</div>
          </div>:
          myTasks.map(t=><div key={t.id} className="card" style={{marginBottom:10,opacity:t.done?.7:1,border:`1.5px solid ${t.done?'var(--border)':'var(--primary)'}`}}>
            <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
              <input type="checkbox" checked={t.done} onChange={()=>update('instTasks',(data.instTasks||[]).map(x=>x.id===t.id?{...x,done:!x.done}:x))} style={{width:20,height:20,marginTop:2,cursor:'pointer',flexShrink:0}}/>
              <div style={{flex:1}}>
                <div style={{fontWeight:800,fontSize:14,textDecoration:t.done?'line-through':'none'}}>{t.title}</div>
                {t.body&&<div style={{fontSize:13,color:'var(--text-light)',marginTop:4,lineHeight:1.6}}>{t.body}</div>}
                {t.dueDate&&<div style={{fontSize:12,color:'var(--orange-dark)',marginTop:6,fontWeight:700}}>📅 {lang==='ar'?'الموعد:':'Due:'} {formatDate(t.dueDate)}</div>}
              </div>
            </div>
          </div>);
        })()}
      </div>}

      {tab==='content'&&<div style={{maxWidth:640}}>
        {myGroups.length===0&&<div className="card" style={{textAlign:'center',padding:40,color:'var(--gray)'}}>
          <div style={{fontSize:36,marginBottom:8}}>📚</div>
          <div style={{fontWeight:700}}>لا توجد مجموعات مسندة إليك</div>
        </div>}
        {myGroups.map(grp=>{
          const grpStudents=data.students.filter(s=>s.groupId===grp.id);
          if(grpStudents.length===0)return null;
          const sample=grpStudents[0];
          const atts=data.attendance.filter(a=>a.studentId===sample.id);
          const nextLec=Array.from({length:16},(_,i)=>i+1).find(n=>!atts.find(a=>a.lectureNum===n))||1;
          const ckey=`${sample.course||COURSES[0]}||${sample.grade||'Grade 1'}||${nextLec}`;
          const c=(data.content||{})[ckey]||{};
          const hasContent=c.instNotes||c.instFiles||(data.instFilesList||[]).some(f=>f.instructorId===myInst?.id);
          return <div key={grp.id} className="card" style={{marginBottom:16,border:`1.5px solid ${hasContent?'var(--orange)':'var(--border)'}`}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
              <div style={{width:38,height:38,background:'var(--orange-light)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:17,color:'var(--orange-dark)',flexShrink:0}}>{nextLec}</div>
              <div>
                <div style={{fontWeight:800,fontSize:15}}>{grp.name}</div>
                <div style={{fontSize:12,color:'var(--gray)'}}>
                  {lang==='ar'?'المحاضرة القادمة':'Next Lecture'}: <strong style={{color:'var(--orange-dark)'}}>{nextLec}</strong> — {sample.course} {sample.grade}
                </div>
              </div>
            </div>
            {c.instNotes&&<div style={{padding:'10px 14px',background:'#FFFBEB',borderRadius:10,marginBottom:10,border:'1px solid #FDE68A'}}>
              <div style={{fontSize:12,fontWeight:700,color:'var(--orange-dark)',marginBottom:4}}>📝 ملاحظات الإدارة:</div>
              <div style={{fontSize:13,lineHeight:1.7}}>{c.instNotes}</div>
            </div>}
            {c.instFiles&&c.instFiles.trim()&&<div style={{marginBottom:10}}>
              <div style={{fontSize:12,fontWeight:700,color:'var(--primary)',marginBottom:6}}>📁 ملفات المحاضرة:</div>
              {c.instFiles.split('\n').filter(Boolean).map((link,i)=><a key={i} href={link} target="_blank" rel="noreferrer"
                className="btn btn-outline btn-sm" style={{display:'flex',alignItems:'center',gap:6,marginBottom:6,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                🔗 {lang==='ar'?'رابط':'Link'} {i+1}: <span style={{overflow:'hidden',textOverflow:'ellipsis'}}>{link.substring(0,40)}...</span>
              </a>)}
            </div>}
            {!c.instNotes&&!c.instFiles&&<div style={{color:'var(--gray)',fontSize:13,textAlign:'center',padding:'16px 0'}}>
              {lang==='ar'?'لا يوجد محتوى خاص بالمحاضر لهذه المحاضرة':'No instructor content for this lecture'}
            </div>}
          </div>;
        })}
        {/* Admin uploaded files */}
        {(()=>{
          const myFiles=(data.instFilesList||[]).filter(f=>f.instructorId===myInst?.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
          if(myFiles.length===0)return null;
          return <div className="card" style={{border:'1.5px solid var(--primary)'}}>
            <div style={{fontWeight:800,fontSize:15,marginBottom:12,color:'var(--primary)'}}>📤 {lang==='ar'?'ملفات من الإدارة العامة':'Files from Super Admin'}</div>
            {myFiles.map(f=>{
              if(!f.seen)setTimeout(()=>update('instFilesList',(data.instFilesList||[]).map(x=>x.id===f.id?{...x,seen:true}:x)),800);
              return <div key={f.id} style={{display:'flex',gap:10,padding:'10px 12px',borderRadius:10,marginBottom:8,background:f.seen?'var(--light-gray)':'var(--primary-bg)',border:`1.5px solid ${f.seen?'var(--border)':'var(--primary)'}`}}>
                <span style={{fontSize:20,flexShrink:0}}>{f.fileData?'📄':'🔗'}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700}}>{f.title}</div>
                  {f.note&&<div style={{fontSize:12,color:'var(--gray)',marginTop:2}}>{f.note}</div>}
                  <div style={{fontSize:11,color:f.seen?'var(--gray)':'var(--primary)',marginTop:2}}>{f.seen?'✓ تم الاطلاع':'● جديد'} • {formatDate(f.createdAt)}</div>
                </div>
                <a href={f.url||f.fileData} target="_blank" rel="noreferrer" download={f.fileName||undefined} className="btn btn-primary btn-sm" style={{flexShrink:0}}>
                  {f.fileData?'⬇️':'👁️'}
                </a>
              </div>;
            })}
          </div>;
        })()}
      </div>}
    </div>

    {/* Student Evaluation Modal */}
    {evalStudent&&<div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget){setEvalStudent(null);}}}>
      <div className="modal modal-sm">
        <div className="modal-header" style={{background:'linear-gradient(135deg,var(--orange-dark),var(--orange))',borderRadius:'20px 20px 0 0'}}>
          <span className="modal-title" style={{color:'white'}}>⭐ {lang==='ar'?'تقييم الطالب':'Student Evaluation'}</span>
          <button className="modal-close" style={{background:'rgba(255,255,255,.2)',color:'white'}} onClick={()=>setEvalStudent(null)}>✕</button>
        </div>
        <div className="modal-body">
          <div style={{textAlign:'center',marginBottom:20}}>
            <div className="avatar-lg" style={{margin:'0 auto 10px',background:'var(--orange-light)',color:'var(--orange-dark)',fontSize:22}}>{evalStudent.name[0]}</div>
            <div style={{fontWeight:800,fontSize:16}}>{evalStudent.name}</div>
            <div style={{fontSize:12.5,color:'var(--gray)',marginTop:3}}>{evalStudent.course} • {evalStudent.grade}</div>
          </div>

          <div className="form-group">
            <label className="form-label">{lang==='ar'?'التقييم (من 5 نجوم)':'Rating (out of 5)'} <span style={{color:'var(--danger)'}}>*</span></label>
            <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:8}}>
              {[1,2,3,4,5].map(n=><span key={n} onClick={()=>setEvalStars(n)}
                style={{fontSize:36,cursor:'pointer',transition:'.15s',
                  color:n<=evalStars?'#F59E0B':'#D1D5DB',
                  transform:n<=evalStars?'scale(1.2)':'scale(1)',display:'inline-block'}}>★</span>)}
            </div>
            {evalStars>0&&<div style={{textAlign:'center',fontSize:13,fontWeight:700,marginTop:8,color:'var(--orange-dark)'}}>
              {lang==='ar'
                ?['','ضعيف 😟','مقبول 🙂','جيد 👍','جيد جداً ⭐','ممتاز 🏆'][evalStars]
                :['','Poor 😟','Fair 🙂','Good 👍','Very Good ⭐','Excellent 🏆'][evalStars]}
            </div>}
          </div>

          <div className="form-group">
            <label className="form-label">{lang==='ar'?'رقم المحاضرة':'Lecture Number'} <span style={{color:'var(--danger)'}}>*</span></label>
            <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:4}}>
              {Array.from({length:16},(_,i)=><div key={i+1} onClick={()=>setEvalLecture(i+1)}
                style={{width:38,height:38,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontWeight:800,fontSize:13,
                  background:evalLecture===i+1?'var(--primary)':'var(--light-gray)',
                  color:evalLecture===i+1?'white':'var(--gray)',
                  border:`1.5px solid ${evalLecture===i+1?'var(--primary)':'var(--border)'}`,transition:'.15s'}}>
                {i+1}
              </div>)}
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">{lang==='ar'?'ملاحظات للطالب وولي الأمر':'Notes for student & parent'}</label>
            <textarea className="form-control" rows="4" value={evalNote} onChange={e=>setEvalNote(e.target.value)} placeholder="ملاحظاتك..."/>
          </div>

          <div style={{padding:'10px 14px',background:'var(--primary-bg)',borderRadius:10,fontSize:12.5,color:'var(--primary)',fontWeight:600}}>
            💡 {lang==='ar'?'سيتم إرسال هذا التقييم تلقائياً لولي الأمر عبر المنصة':'This evaluation will be sent automatically to the parent via the platform'}
          </div>

          {evalMsg&&<div className={`alert ${evalMsg.startsWith('✅')?'alert-success':'alert-danger'}`} style={{marginTop:12}}>{evalMsg}</div>}
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={()=>setEvalStudent(null)}>{lang==='ar'?'إلغاء':'Cancel'}</button>
          <button className="btn btn-orange" onClick={submitEval}>⭐ {lang==='ar'?'إرسال التقييم':'Send Evaluation'}</button>
        </div>
      </div>
    </div>}
  </div>;
}

// ─── LECTURE QUIZ WIDGET ─────────────────────────────────────────────────────
function LectureQuizWidget({questions,lectureNum,data,update,studentId,ckey}){
  const savedKey=`quiz_${ckey}`;
  const [answers,setAnswers]=useState(()=>{
    try{const s=localStorage.getItem(savedKey);return s?JSON.parse(s):{};}catch{return {};}
  });
  const [submitted,setSubmitted]=useState(()=>{
    try{return !!localStorage.getItem(savedKey+'_done');}catch{return false;}
  });
  const [recording,setRecording]=useState(null);
  const [mediaRec,setMediaRec]=useState(null);

  if(!questions||questions.length===0)return null;

  const mcqQs=questions.filter(q=>!q.type||q.type==='mcq');
  const score=submitted?mcqQs.filter((q,i)=>{
    const qi=questions.indexOf(q);
    return answers[qi]===q.correct;
  }).length:0;

  function handleImageUpload(qi,e){
    const file=e.target.files[0];if(!file)return;
    if(file.size>2*1024*1024){alert('حجم الصورة أكبر من 2MB');return;}
    const reader=new FileReader();
    reader.onload=ev=>{
      const a={...answers,[qi]:ev.target.result};
      setAnswers(a);
      localStorage.setItem(savedKey,JSON.stringify(a));
    };
    reader.readAsDataURL(file);
  }

  async function startRecording(qi){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const rec=new MediaRecorder(stream);
      const chunks=[];
      rec.ondataavailable=e=>chunks.push(e.data);
      rec.onstop=()=>{
        const blob=new Blob(chunks,{type:'audio/webm'});
        const reader=new FileReader();
        reader.onload=ev=>{
          const a={...answers,[qi]:ev.target.result};
          setAnswers(a);
          localStorage.setItem(savedKey,JSON.stringify(a));
        };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(t=>t.stop());
        setRecording(null);setMediaRec(null);
      };
      rec.start();
      setRecording(qi);setMediaRec(rec);
    }catch{alert('يرجى السماح بالوصول للميكروفون');}
  }

  function stopRecording(){if(mediaRec){mediaRec.stop();}}

  function handleSubmit(){
    localStorage.setItem(savedKey+'_done','1');
    localStorage.setItem(savedKey,JSON.stringify(answers));
    setSubmitted(true);
    // Save to data if studentId available
    if(studentId&&data&&update){
      const existing=(data.quizResults||{});
      update('quizResults',{...existing,[`${studentId}_${ckey}`]:{answers,score,total:mcqQs.length,submittedAt:new Date().toISOString(),lectureNum}});
    }
  }

  return <div style={{marginTop:12,padding:'14px',background:'#EEF7FF',borderRadius:12,border:'1.5px solid #93C5FD'}}>
    <div style={{fontWeight:800,fontSize:14,color:'#1D4ED8',marginBottom:12}}>❓ أسئلة المحاضرة {lectureNum}</div>
    {questions.map((q,qi)=>{
      const type=q.type||'mcq';
      return <div key={qi} style={{marginBottom:14,padding:'12px',background:'white',borderRadius:10,border:'1px solid #BFDBFE'}}>
        <div style={{fontWeight:700,fontSize:13,marginBottom:8,color:'#1E3A5F'}}>{qi+1}. {q.q}</div>
        {q.imageUrl&&<img src={q.imageUrl} alt="" style={{maxWidth:'100%',maxHeight:160,borderRadius:8,marginBottom:8,objectFit:'cover'}} onError={e=>e.target.style.display='none'}/>}
        {type==='mcq'&&(q.options||[]).filter(Boolean).map((opt,oi)=><div key={oi} onClick={()=>{if(!submitted)setAnswers(p=>{const n={...p,[qi]:oi};localStorage.setItem(savedKey,JSON.stringify(n));return n;})}}
          style={{padding:'8px 12px',borderRadius:8,marginBottom:5,cursor:submitted?'default':'pointer',fontSize:13,
            background:submitted?(oi===q.correct?'#DCFCE7':answers[qi]===oi?'#FEE2E2':'#F8F9FA'):(answers[qi]===oi?'#DBEAFE':'#F8F9FA'),
            border:`1.5px solid ${submitted?(oi===q.correct?'#86EFAC':answers[qi]===oi?'#FCA5A5':'#E5E7EB'):(answers[qi]===oi?'#93C5FD':'#E5E7EB')}`,
            fontWeight:answers[qi]===oi?700:400}}>
          {submitted&&oi===q.correct?'✅ ':''}{submitted&&answers[qi]===oi&&oi!==q.correct?'❌ ':''}{opt}
        </div>)}
        {type==='text'&&<textarea className="form-control" rows="2" disabled={submitted}
          value={answers[qi]||''} onChange={e=>{if(!submitted){const a={...answers,[qi]:e.target.value};setAnswers(a);localStorage.setItem(savedKey,JSON.stringify(a));}}}
          placeholder="اكتب إجابتك هنا..." style={{fontSize:13}}/>}
        {type==='image_answer'&&<div>
          {answers[qi]?<div>
            <img src={answers[qi]} alt="إجابتك" style={{maxWidth:'100%',maxHeight:160,borderRadius:8,marginBottom:8}}/>
            {!submitted&&<button className="btn btn-ghost btn-sm" onClick={()=>{const a={...answers};delete a[qi];setAnswers(a);}}>🗑️ حذف وإعادة الرفع</button>}
          </div>:!submitted&&<div>
            <label className="btn btn-outline btn-sm" style={{cursor:'pointer'}}>
              📸 ارفع صورة كإجابة
              <input type="file" accept="image/*" style={{display:'none'}} onChange={e=>handleImageUpload(qi,e)}/>
            </label>
          </div>}
        </div>}
        {type==='voice_answer'&&<div>
          {answers[qi]?<div>
            <audio src={answers[qi]} controls style={{width:'100%',marginBottom:6}}/>
            {!submitted&&<button className="btn btn-ghost btn-sm" onClick={()=>{const a={...answers};delete a[qi];setAnswers(a);}}>🗑️ إعادة التسجيل</button>}
          </div>:!submitted&&<div>
            {recording===qi?
              <button className="btn btn-danger btn-sm" style={{animation:'pulse 1s infinite'}} onClick={stopRecording}>⏹️ إيقاف التسجيل</button>:
              <button className="btn btn-primary btn-sm" onClick={()=>startRecording(qi)}>🎙️ ابدأ التسجيل</button>}
          </div>}
        </div>}
      </div>;
    })}
    {!submitted?
      <button className="btn btn-primary btn-sm" style={{width:'100%',padding:'10px'}} onClick={handleSubmit}>
        📝 تسليم الإجابات
      </button>:
      <div style={{textAlign:'center',padding:'12px',background:score===mcqQs.length&&mcqQs.length>0?'#DCFCE7':'#FEF3C7',borderRadius:10,fontWeight:800,fontSize:14}}>
        {mcqQs.length>0?`📊 النتيجة: ${score}/${mcqQs.length}`:''} ✅ تم التسليم
      </div>}
  </div>;
}

      </div>}
    </div>
    {showCert&&<CertificateGenerator student={myStudent} grade={showCert.grade} course={showCert.course} date={showCert.date} onClose={()=>setShowCert(null)} readOnly/>}
  </div>;
}
