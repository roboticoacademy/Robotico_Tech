// ─── ROOT APP ─────────────────────────────────────────────────────────────────
function App(){
  const [data,setData]=useState(load);

  React.useEffect(()=>{
    async function loadFromFirebase(){
      try{
        if(!window.db) return;

        const { doc, getDoc } = await import(
          "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js"
        );

        const snap = await getDoc(
          doc(window.db, "robotico", "mainData")
        );

        if(snap.exists()){
          const firebaseData = snap.data();

          setData(prev=>{
            const merged = {...prev, ...firebaseData};

            // Ensure array fields are never undefined
            [
              'trials','parentNotes','ratings','quizzes','instTasks',
              'instFilesList','students','instructors','groups',
              'attendance','instAttendance','payments'
            ].forEach(k=>{
              if(!Array.isArray(merged[k])){
                merged[k]=prev[k]||[];
              }
            });

            return merged;
          });

          console.log("✅ Robotico data loaded from Firebase");
        }else{
          console.log("⚠️ No Robotico data found in Firebase");
        }
      }catch(error){
        console.error("❌ Firebase load error:",error);
      }
    }

    loadFromFirebase();
  },[]);
  const [lang,setLang]=useState(()=>{try{return localStorage.getItem('robotico_lang')||'ar';}catch{return 'ar';}});
  const [currentUser,setCurrentUser]=useState(()=>{
    try{const s=sessionStorage.getItem('robotico_session');return s?JSON.parse(s):null;}catch{return null;}
  });

  function toggleLang(){const nl=lang==='ar'?'en':'ar';localStorage.setItem('robotico_lang',nl);setLang(nl);}
  function doLogin(u){
    // Block suspended/inactive users
    if(u.role==='student'){
      const st=data.students.find(s=>s.id===u.studentId);
      if(!st){alert(lang==='ar'?'لم يتم العثور على بيانات الطالب.':'Student record not found.');return;}
      if(st.status==='suspended'){alert(lang==='ar'?'⏸️ حسابك موقوف حالياً. تواصل مع الإدارة.':'⏸️ Your account is currently suspended. Please contact the administration.');return;}
    }
    if(u.role==='instructor'){const inst=data.instructors.find(i=>data.users.find(us=>us.instructorId===i.id&&us.id===u.id));if(inst?.status==='inactive'||inst?.status==='suspended'){alert(lang==='ar'?'حسابك غير نشط. تواصل مع الإدارة.':'Your account is inactive. Contact admin.');return;}}
    // Ensure role is correct from defaultData if it's a system user
    const sysUser=defaultData.users.find(su=>su.id===u.id);
    const finalUser=sysUser?{...u,role:sysUser.role,name:u.name||sysUser.name}:u;
    sessionStorage.setItem('robotico_session',JSON.stringify(finalUser));setCurrentUser(finalUser);
  }
  function logout(){sessionStorage.removeItem('robotico_session');setCurrentUser(null);}

  // Also block parent if student is suspended
  function doParentLogin(u){
    const st=data.students.find(s=>s.id===u.studentId);
    if(st?.status==='suspended'){alert(lang==='ar'?'حساب الطالب موقوف. تواصل مع الإدارة.':'Student account is suspended. Contact admin.');return;}
    // Ensure role is correct from defaultData if it's a system user
    const sysUser=defaultData.users.find(su=>su.id===u.id);
    const finalUser=sysUser?{...u,role:sysUser.role,name:u.name||sysUser.name}:u;
    sessionStorage.setItem('robotico_session',JSON.stringify(finalUser));setCurrentUser(finalUser);
  }

  const appProps={data,setData,currentUser,setCurrentUser:logout,lang,toggleLang};
  if(!currentUser) return <LangContext.Provider value={lang}><LoginPage data={data} setCurrentUser={doLogin} setParentUser={doParentLogin} lang={lang} toggleLang={toggleLang}/></LangContext.Provider>;
  return <LangContext.Provider value={lang}>
    {currentUser.role==='admin'&&<AdminPanel {...appProps}/>}
    {currentUser.role==='super_admin'&&<SuperAdminPanel {...appProps}/>}
    {currentUser.role==='instructor'&&<InstructorPanel {...appProps}/>}
    {currentUser.role==='student'&&<StudentPanel {...appProps}/>}
    {currentUser.role==='parent'&&<ParentPanel {...appProps}/>}
    {!['admin','super_admin','instructor','student','parent'].includes(currentUser.role)&&
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:12}}>
        <div style={{fontSize:18,fontWeight:700,color:'red'}}>خطأ: دور غير معروف "{currentUser.role}"</div>
        <button onClick={()=>setCurrentUser(null)} style={{padding:'8px 16px',background:'#eee',border:'none',borderRadius:8,cursor:'pointer'}}>خروج</button>
      </div>}
  </LangContext.Provider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
