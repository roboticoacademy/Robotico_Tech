// ─── TRIALS MODULE ────────────────────────────────────────────────────────────
function TrialsModule({data,update,lang='ar'}){
  const [showAdd,setShowAdd]=useState(false);
  const [search,setSearch]=useState('');
  const [selIds,setSelIds]=useState([]);
  const [broadMsg,setBroadMsg]=useState('');
  const [editTrial,setEditTrial]=useState(null);
  const [filterConverted,setFilterConverted]=useState('');
  const emptyF={name:'',phone:'',age:'',course:COURSES[0],date:today(),notes:'',source:''};
  const [f,setF]=useState(emptyF);
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));

  const filtered=(data.trials||[]).filter(t=>
    (ci(t.name,search)||ci(t.phone,search)||ci(t.course,search))&&
    (!filterConverted||(filterConverted==='converted'?t.converted:!t.converted))
  ).sort((a,b)=>new Date(b.date)-new Date(a.date));

  const unconverted=filtered.filter(t=>!t.converted);
  const converted=filtered.filter(t=>t.converted);

  function addTrial(){
    if(!f.name.trim()||!f.phone.trim()){alert(lang==='ar'?'الاسم والهاتف مطلوبان':'Name and phone required');return;}
    update('trials',[...(data.trials||[]),{...f,id:makeId(),createdAt:today()}]);
    setShowAdd(false);setF(emptyF);
  }

  function convertToStudent(trial){
    if(!confirm(lang==='ar'?`تحويل ${trial.name} إلى طالب مسجل؟`:`Convert ${trial.name} to registered student?`))return;
    const sid=makeStudentId(data.students);
    const pass=makePass();const uname=makeUsername(trial.name);
    const newSt={id:makeId(),studentId:sid,name:trial.name,phone:trial.phone,
      course:trial.course,grade:'Grade 1',startDate:today(),fee:500,status:'active',
      dob:'',groupId:'',createdAt:today()};
    const newUser={id:makeId(),username:uname,password:pass,role:'student',name:trial.name,phone:trial.phone,studentId:newSt.id};
    update('students',[...data.students,newSt]);
    update('users',[...data.users,newUser]);
    update('trials',(data.trials||[]).filter(t=>t.id!==trial.id));
    alert(`✅ ${lang==='ar'?'تم التحويل وحذفه من المحاضرة المجانية!\nاسم المستخدم':'Converted & removed from trials!\nUsername'}: ${uname}\n${lang==='ar'?'كلمة السر':'Password'}: ${pass}`);
  }

  function deleteTrial(id){
    if(!confirm(lang==='ar'?'حذف؟':'Delete?'))return;
    update('trials',(data.trials||[]).filter(t=>t.id!==id));
  }

  function toggleSel(id){setSelIds(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);}
  function selAll(){setSelIds(unconverted.filter(t=>t.phone).map(t=>t.id));}
  function selNone(){setSelIds([]);}

  const selTrials=unconverted.filter(t=>selIds.includes(t.id)&&t.phone);

  return <div>
    {/* Stats row */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:20}}>
      {[
        {icon:'📋',label:lang==='ar'?'إجمالي المسجلين':'Total Leads',val:(data.trials||[]).length,bg:'var(--primary-bg)'},
        {icon:'⏳',label:lang==='ar'?'لم يتحولوا بعد':'Pending',val:unconverted.length,bg:'#FFFBEB'},
        {icon:'✅',label:lang==='ar'?'تحولوا لطلاب':'Converted',val:converted.length,bg:'#ECFDF5'},
      ].map(s=><div key={s.label} className="card" style={{textAlign:'center',background:s.bg}}>
        <div style={{fontSize:28}}>{s.icon}</div>
        <div style={{fontWeight:900,fontSize:22,color:'var(--primary)'}}>{s.val}</div>
        <div style={{fontSize:12,color:'var(--gray)',fontWeight:600}}>{s.label}</div>
      </div>)}
    </div>

    {/* Broadcast to selected */}
    {selIds.length>0&&<div className="card" style={{marginBottom:16,border:'2px solid var(--orange)'}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
        <span style={{fontSize:20}}>📢</span>
        <span style={{fontWeight:800,fontSize:14,color:'var(--orange-dark)'}}>{lang==='ar'?`إرسال لـ ${selTrials.length} مسجل محدد`:`Send to ${selTrials.length} selected`}</span>
        <button className="btn btn-ghost btn-sm" style={{marginRight:'auto'}} onClick={selNone}>{lang==='ar'?'إلغاء التحديد':'Deselect all'}</button>
      </div>
      <textarea className="form-control" rows="3" value={broadMsg} onChange={e=>setBroadMsg(e.target.value)}
        placeholder={lang==='ar'?'اكتب رسالتك... استخدم {name} لاسم المسجل':'Write your message... use {name} for lead name'}/>
      <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:10}}>
        {selTrials.map(t=>{
          const msg=broadMsg?broadMsg.replace(/{name}/g,t.name):(lang==='ar'?`مرحباً ${t.name}، نتشرف بدعوتك لمعرفة المزيد عن روبوتيكو 🤖`:`Hello ${t.name}, we'd love to have you join Robotico! 🤖`);
          return <a key={t.id} className="btn btn-wa btn-sm" href={waLink(t.phone,msg)} target="_blank" rel="noreferrer">💬 {t.name}</a>;
        })}
      </div>
    </div>}

    <div className="card">
      <div className="section-header">
        <span className="section-title">{lang==='ar'?'المسجلون للمحاضرة المجانية':'Free Trial Registrations'}</span>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-ghost btn-sm" onClick={selAll}>{lang==='ar'?'تحديد الكل':'Select all'}</button>
          <button className="btn btn-primary" onClick={()=>setShowAdd(true)}>➕ {lang==='ar'?'تسجيل جديد':'New Registration'}</button>
        </div>
      </div>
      <div className="filter-bar" style={{marginBottom:10}}>
        <div className="search-bar" style={{flex:1,marginBottom:0}}>
          <span className="search-icon">🔍</span>
          <input className="form-control" style={{paddingRight:36}} placeholder={lang==='ar'?'بحث...':'Search...'} value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <select className="filter-select" value={filterConverted} onChange={e=>setFilterConverted(e.target.value)}>
          <option value="">📊 الكل</option>
          <option value="pending">⏳ لم يتحولوا</option>
          <option value="converted">✅ تحولوا لطلاب</option>
        </select>
        {filterConverted&&<button className="btn btn-ghost btn-sm" onClick={()=>setFilterConverted('')}>✕</button>}
      </div>
      <div className="table-wrap"><table>
        <thead><tr>
          <th>✓</th>
          <th>{lang==='ar'?'الاسم':'Name'}</th>
          <th>{lang==='ar'?'الهاتف':'Phone'}</th>
          <th>{lang==='ar'?'الكورس':'Course'}</th>
          <th>{lang==='ar'?'تاريخ التسجيل':'Date'}</th>
          <th>{lang==='ar'?'الحالة':'Status'}</th>
          <th>{lang==='ar'?'إجراءات':'Actions'}</th>
        </tr></thead>
        <tbody>{filtered.length===0?<tr><td colSpan="7" className="empty-row">🆓 {lang==='ar'?'لا توجد تسجيلات':'No registrations'}</td></tr>:
          filtered.map(t=><tr key={t.id}>
            <td>{!t.converted&&t.phone&&<input type="checkbox" checked={selIds.includes(t.id)} onChange={()=>toggleSel(t.id)} style={{width:16,height:16}}/>}</td>
            <td><div style={{fontWeight:700}}>{t.name}</div>{t.notes&&<div style={{fontSize:11,color:'var(--gray)'}}>{t.notes}</div>}</td>
            <td>{t.phone&&<span style={{fontFamily:'monospace',fontSize:12.5}}>{t.phone}</span>}</td>
            <td><span className="badge badge-primary">{t.course}</span></td>
            <td>{formatDate(t.date)}</td>
            <td>{t.converted?<span className="badge badge-success">✅ {lang==='ar'?'تحول لطالب':'Enrolled'}</span>:<span className="badge badge-warning">⏳ {lang==='ar'?'بانتظار التحويل':'Pending'}</span>}</td>
            <td><div style={{display:'flex',gap:4}}>
              {!t.converted&&<button className="btn btn-success btn-sm" style={{fontSize:11}} onClick={()=>convertToStudent(t)}>🎓 {lang==='ar'?'تحويل لطالب':'Enroll'}</button>}
              {t.phone&&<a className="btn btn-wa btn-sm btn-icon" href={waLink(t.phone)} target="_blank" rel="noreferrer">💬</a>}
              <button className="btn btn-danger btn-sm btn-icon" onClick={()=>deleteTrial(t.id)}>🗑️</button>
            </div></td>
          </tr>)}
        </tbody>
      </table></div>
    </div>

    <Modal show={showAdd} onClose={()=>setShowAdd(false)} title={lang==='ar'?'تسجيل في المحاضرة المجانية':'Free Trial Registration'}
      footer={<><button className="btn btn-ghost" onClick={()=>setShowAdd(false)}>{lang==='ar'?'إلغاء':'Cancel'}</button><button className="btn btn-orange" onClick={addTrial}>➕ {lang==='ar'?'تسجيل':'Register'}</button></>}>
      <div className="form-row">
        <Input label={lang==='ar'?'الاسم الكامل':'Full Name'} required value={f.name} onChange={set('name')} placeholder={lang==='ar'?'محمد أحمد':'John Smith'}/>
        <Input label={lang==='ar'?'رقم الهاتف':'Phone'} required value={f.phone} onChange={set('phone')} placeholder="01XXXXXXXXX"/>
      </div>
      <div className="form-row">
        <Input label={lang==='ar'?'العمر':'Age'} type="number" value={f.age} onChange={set('age')} placeholder="10"/>
        <Select label={lang==='ar'?'الكورس المهتم به':'Interested Course'} value={f.course} onChange={set('course')}>
          {(data.courseNames||COURSES).map((c,i)=><option key={i} value={c}>{c}</option>)}
        </Select>
      </div>
      <div className="form-row">
        <Input label={lang==='ar'?'تاريخ المحاضرة المجانية':'Trial Date'} type="date" value={f.date} onChange={set('date')}/>
        <Input label={lang==='ar'?'مصدر المعرفة بنا':'Source'} value={f.source} onChange={set('source')} placeholder={lang==='ar'?'سوشيال ميديا، صديق...':'Social, Friend...'}/>
      </div>
      <Textarea label={lang==='ar'?'ملاحظات':'Notes'} value={f.notes} onChange={set('notes')} rows="2" placeholder={lang==='ar'?'أي ملاحظات على الطالب...':'Any notes...'}/>
    </Modal>
  </div>;
}

// ─── RATINGS MODULE ────────────────────────────────────────────────────────────
function RatingsModule({data,update,lang='ar'}){
  const ratings=data.ratings||[];
  // Separate: parent notes vs instructor evaluations
  const parentNotes=(data.parentNotes||[]).filter(n=>!n.fromInstructor);
  const instEvals=(data.parentNotes||[]).filter(n=>n.fromInstructor);
  const notes=parentNotes; // alias for display

  function markRatingRead(id){update('ratings',ratings.map(r=>r.id===id?{...r,read:true}:r));}
  function markNoteRead(id){update('parentNotes',(data.parentNotes||[]).map(n=>n.id===id?{...n,read:true}:n));}
  function deleteRating(id){if(confirm(lang==='ar'?'حذف؟':'Delete?'))update('ratings',ratings.filter(r=>r.id!==id));}
  function deleteNote(id){if(confirm(lang==='ar'?'حذف؟':'Delete?'))update('parentNotes',(data.parentNotes||[]).filter(n=>n.id!==id));}

  const avgRating=ratings.length?Math.round(ratings.reduce((s,r)=>s+(r.stars||0),0)/ratings.length*10)/10:0;
  const stars=n=>Array.from({length:5},(_,i)=><span key={i} style={{fontSize:18,color:i<n?'#F59E0B':'#D1D5DB'}}>★</span>);

  return <div>
    {/* Stats */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:20}}>
      <div className="card" style={{textAlign:'center',background:'#FFFBEB'}}>
        <div style={{fontSize:32}}>⭐</div>
        <div style={{fontWeight:900,fontSize:26,color:'#D97706'}}>{avgRating||'—'}</div>
        <div style={{fontSize:12,color:'var(--gray)'}}>متوسط التقييم</div>
        <div style={{marginTop:6}}>{ratings.length>0&&stars(Math.round(avgRating))}</div>
      </div>
      <div className="card" style={{textAlign:'center',background:'var(--primary-bg)'}}>
        <div style={{fontSize:32}}>💬</div>
        <div style={{fontWeight:900,fontSize:26,color:'var(--primary)'}}>{ratings.length}</div>
        <div style={{fontSize:12,color:'var(--gray)'}}>{lang==='ar'?'تقييم':'Reviews'}</div>
      </div>
      <div className="card" style={{textAlign:'center',background:parentNotes.filter(n=>!n.read).length?'#FEF2F2':'var(--light-gray)'}}>
        <div style={{fontSize:32}}>📝</div>
        <div style={{fontWeight:900,fontSize:26,color:parentNotes.filter(n=>!n.read).length?'var(--danger)':'var(--text)'}}>{parentNotes.filter(n=>!n.read).length}</div>
        <div style={{fontSize:12,color:'var(--gray)'}}>{lang==='ar'?'ملاحظة غير مقروءة':'Unread Notes'}</div>
      </div>
    </div>

    {/* Parent Notes */}
    <div className="card" style={{marginBottom:16}}>
      <div className="section-title" style={{marginBottom:14}}>📝 {lang==='ar'?'ملاحظات أولياء الأمور':'Parent Notes'} ({parentNotes.filter(n=>!n.read).length} {lang==='ar'?'جديدة':'new'})</div>
      {parentNotes.length===0?<div style={{textAlign:'center',color:'var(--gray)',padding:24}}>{lang==='ar'?'لا توجد ملاحظات':'No notes yet'}</div>:
      parentNotes.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(n=>{
        const st=data.students.find(s=>s.id===n.studentId);
        return <div key={n.id} style={{padding:'12px 14px',borderRadius:10,marginBottom:8,background:n.read?'white':'#FEF2F2',border:`1.5px solid ${n.read?'var(--border)':'#FECACA'}`}}>
          <div style={{display:'flex',alignItems:'flex-start',gap:8}}>
            <div style={{flex:1}}>
              {!n.read&&<span className="badge badge-danger" style={{fontSize:10,marginBottom:4}}>● {lang==='ar'?'جديد':'New'}</span>}
              <div style={{fontWeight:700,fontSize:13,marginBottom:4}}>{n.note}</div>
              <div style={{fontSize:11.5,color:'var(--gray)'}}>👪 {lang==='ar'?'ولي أمر':'Parent'}: {st?.name||'—'} • {formatDate(n.createdAt)}</div>
            </div>
            <div style={{display:'flex',gap:4}}>
              {!n.read&&<button className="btn btn-ghost btn-sm" style={{fontSize:11}} onClick={()=>markNoteRead(n.id)}>✓ {lang==='ar'?'تم':'Done'}</button>}
              <button className="btn btn-danger btn-sm btn-icon" onClick={()=>deleteNote(n.id)}>🗑️</button>
            </div>
          </div>
        </div>;
      })}
    </div>

    {/* Instructor Evaluations */}
    <div className="card" style={{marginBottom:16}}>
      <div className="section-title" style={{marginBottom:14}}>👨‍🏫 {lang==='ar'?'تقييمات المحاضرين':'Instructor Evaluations'} ({instEvals.filter(n=>!n.read).length} {lang==='ar'?'جديدة':'new'})</div>
      {instEvals.length===0?<div style={{textAlign:'center',color:'var(--gray)',padding:24}}>{lang==='ar'?'لا توجد تقييمات من المحاضرين':'No instructor evaluations yet'}</div>:
      instEvals.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(n=>{
        const st=data.students.find(s=>s.id===n.studentId);
        return <div key={n.id} style={{padding:'12px 14px',borderRadius:10,marginBottom:8,background:n.read?'white':'#FFFBEB',border:`1.5px solid ${n.read?'var(--border)':'#FDE68A'}`}}>
          <div style={{display:'flex',alignItems:'flex-start',gap:8}}>
            <div style={{flex:1}}>
              {!n.read&&<span className="badge badge-warning" style={{fontSize:10,marginBottom:4}}>● {lang==='ar'?'جديد':'New'}</span>}
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                <span style={{fontWeight:700,fontSize:13}}>👨‍🏫 {n.instructorName||n.parentName}</span>
                {n.lectureNum&&<span style={{background:'var(--primary-bg)',color:'var(--primary)',borderRadius:6,padding:'2px 8px',fontSize:11,fontWeight:700}}>م{n.lectureNum}</span>}
                <div style={{display:'flex',gap:1}}>{[1,2,3,4,5].map(i=><span key={i} style={{fontSize:14,color:i<=(n.stars||0)?'#F59E0B':'#D1D5DB'}}>★</span>)}</div>
              </div>
              <div style={{fontSize:13,marginBottom:4}}>{n.note}</div>
              <div style={{fontSize:11.5,color:'var(--gray)'}}>🎓 {lang==='ar'?'الطالب':'Student'}: {st?.name||'—'} • {formatDate(n.createdAt)}</div>
            </div>
            <div style={{display:'flex',gap:4}}>
              {!n.read&&<button className="btn btn-ghost btn-sm" style={{fontSize:11}} onClick={()=>markNoteRead(n.id)}>✓</button>}
              <button className="btn btn-danger btn-sm btn-icon" onClick={()=>deleteNote(n.id)}>🗑️</button>
            </div>
          </div>
        </div>;
      })}
    </div>

    {/* Customer Ratings */}
    <div className="card">
      <div className="section-title" style={{marginBottom:14}}>⭐ {lang==='ar'?'تقييمات العملاء':'Customer Reviews'} ({ratings.length})</div>
      {ratings.length===0?<div style={{textAlign:'center',color:'var(--gray)',padding:24}}>{lang==='ar'?'لا توجد تقييمات':'No reviews yet'}</div>:
      ratings.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(r=>{
        const st=data.students.find(s=>s.id===r.studentId);
        return <div key={r.id} style={{padding:'12px 14px',borderRadius:10,marginBottom:8,background:r.read?'white':'#FFFBEB',border:`1.5px solid ${r.read?'var(--border)':'#FDE68A'}`}}>
          <div style={{display:'flex',alignItems:'flex-start',gap:8}}>
            <div style={{flex:1}}>
              {!r.read&&<span className="badge badge-warning" style={{fontSize:10,marginBottom:4}}>● {lang==='ar'?'جديد':'New'}</span>}
              <div style={{marginBottom:6}}>{stars(r.stars||0)}</div>
              {r.review&&<div style={{fontSize:13,marginBottom:6,lineHeight:1.6}}>"{r.review}"</div>}
              <div style={{fontSize:11.5,color:'var(--gray)'}}>👪 {lang==='ar'?'ولي أمر':'Parent'}: {st?.name||r.parentName||'—'} • {formatDate(r.createdAt)}</div>
            </div>
            <div style={{display:'flex',gap:4}}>
              {!r.read&&<button className="btn btn-ghost btn-sm" style={{fontSize:11}} onClick={()=>markRatingRead(r.id)}>✓</button>}
              <button className="btn btn-danger btn-sm btn-icon" onClick={()=>deleteRating(r.id)}>🗑️</button>
            </div>
          </div>
        </div>;
      })}
    </div>
  </div>;
}

// ─── INSTRUCTOR SALARY MODULE ────────────────────────────────────────────────
function InstSalaryModule({data,update,lang='ar'}){
  const [selInst,setSelInst]=useState(null);
  const [hourRate,setHourRate]=useState('');
  const [showSet,setShowSet]=useState(false);

  // Each instAttendance record = one lecture session
  // Each lecture = group.lectureHours (default 1.5 hr if not set)
  function getInstStats(inst){
    const sessions=data.instAttendance.filter(a=>a.instructorId===inst.id);
    const totalSessions=sessions.length;
    // Get lecture duration from groups (default 1.5 hr per session)
    const totalHours=sessions.reduce((sum,a)=>{
      const grp=data.groups.find(g=>g.id===a.groupId);
      const hrs=grp?.lectureHours||1.5;
      return sum+hrs;
    },0);
    const rate=inst.hourlyRate||0;
    const salary=Math.round(totalHours*rate);
    return {totalSessions,totalHours:Math.round(totalHours*10)/10,salary};
  }

  function saveRate(){
    if(!selInst)return;
    update('instructors',data.instructors.map(i=>i.id===selInst.id?{...i,hourlyRate:+hourRate}:i));
    setShowSet(false);setSelInst(null);setHourRate('');
  }

  // Group settings - set lecture duration per group
  const [showGroupHrs,setShowGroupHrs]=useState(null);
  const [grpHrs,setGrpHrs]=useState('');

  function saveGroupHrs(){
    update('groups',data.groups.map(g=>g.id===showGroupHrs.id?{...g,lectureHours:+grpHrs}:g));
    setShowGroupHrs(null);setGrpHrs('');
  }

  // Month filter
  const [filterMonth,setFilterMonth]=useState(new Date().toISOString().substr(0,7));

  function getInstMonthStats(inst){
    const sessions=data.instAttendance.filter(a=>a.instructorId===inst.id&&a.date?.startsWith(filterMonth));
    const totalSessions=sessions.length;
    const totalHours=sessions.reduce((sum,a)=>{
      const grp=data.groups.find(g=>g.id===a.groupId);
      return sum+(grp?.lectureHours||1.5);
    },0);
    const rate=inst.hourlyRate||0;
    const salary=Math.round(totalHours*rate);
    return {totalSessions,totalHours:Math.round(totalHours*10)/10,salary};
  }

  const totalSalaries=data.instructors.reduce((s,i)=>s+getInstMonthStats(i).salary,0);

  const expectedMonthlyRevenue=useMemo(()=>
    data.students.filter(s=>s.status!=='suspended'&&s.fee).reduce((sum,s)=>sum+(+s.fee||0),0)
  ,[data.students]);

  return <div>
    {/* Header */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:14,marginBottom:20}}>
      <div className="stat-card"><div className="stat-icon blue">👨‍🏫</div><div className="stat-number">{data.instructors.length}</div><div className="stat-label">{lang==='ar'?'إجمالي المحاضرين':'Total Instructors'}</div></div>
      <div className="stat-card orange"><div className="stat-icon orange">⏱️</div><div className="stat-number">{data.instructors.reduce((s,i)=>s+getInstStats(i).totalHours,0)}</div><div className="stat-label">{lang==='ar'?'إجمالي ساعات العمل':'Total Work Hours'}</div></div>
      <div className="stat-card warning"><div className="stat-icon yellow">💵</div><div className="stat-number">{totalSalaries.toLocaleString()}</div><div className="stat-label">{lang==='ar'?'إجمالي رواتب الشهر':'Month Total Salaries'}</div></div>
      <div className="stat-card success" style={{borderLeft:'4px solid var(--success)'}}>
        <div className="stat-icon green">🎯</div>
        <div className="stat-number" style={{fontSize:20,color:'var(--success)'}}>{expectedMonthlyRevenue.toLocaleString()}</div>
        <div className="stat-label">{lang==='ar'?'إيراد متوقع شهرياً (جنيه)':'Expected Monthly Revenue'}</div>
        <div style={{marginTop:6,fontSize:11,color:'var(--gray)'}}>
          {data.students.filter(s=>s.status!=='suspended'&&s.fee).length} طالب نشط
        </div>
      </div>
    </div>

    {/* Month filter + Group hours settings */}
    <div className="grid-2" style={{gap:16,marginBottom:20,alignItems:'start'}}>
      <div className="card">
        <div style={{fontWeight:800,marginBottom:12,fontSize:14}}>📅 {lang==='ar'?'تصفية بالشهر':'Filter by Month'}</div>
        <input type="month" className="form-control" value={filterMonth} onChange={e=>setFilterMonth(e.target.value)}/>
        <div style={{fontSize:12,color:'var(--gray)',marginTop:8}}>💡 {lang==='ar'?'إجمالي الرواتب للشهر المحدد:':'Total salaries for selected month:'} <strong style={{color:'var(--success)'}}>{totalSalaries} {lang==='ar'?'جنيه':'EGP'}</strong></div>
        <div className="divider"/>
        <div style={{fontWeight:800,marginBottom:10,fontSize:13,color:'var(--primary)'}}>💰 {lang==='ar'?'الإيراد المتوقع شهرياً بالمجموعة':'Expected Monthly Revenue by Group'}</div>
        {data.groups.length===0?<div style={{color:'var(--gray)',fontSize:13}}>لا توجد مجموعات</div>:
        data.groups.map(g=>{
          const groupStudents=data.students.filter(s=>s.groupId===g.id&&s.status!=='suspended'&&s.fee);
          const groupRevenue=groupStudents.reduce((sum,s)=>sum+(+s.fee||0),0);

// ─── INSTRUCTOR TASKS MODULE ─────────────────────────────────────────────────
function InstTasksModule({data,update,lang='ar'}){
  const [showAdd,setShowAdd]=useState(false);
  const [f,setF]=useState({instructorId:'',title:'',body:'',dueDate:''});
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));

  function addTask(){
    if(!f.instructorId||!f.title.trim()){alert(lang==='ar'?'المحاضر والعنوان مطلوبان':'Instructor and title required');return;}
    update('instTasks',[...(data.instTasks||[]),{...f,id:makeId(),createdAt:today(),done:false}]);
    setShowAdd(false);setF({instructorId:'',title:'',body:'',dueDate:''});
  }
  function toggleDone(id){update('instTasks',(data.instTasks||[]).map(t=>t.id===id?{...t,done:!t.done}:t));}
  function deleteTask(id){if(!confirm(lang==='ar'?'حذف المهمة؟':'Delete task?'))return;update('instTasks',(data.instTasks||[]).filter(t=>t.id!==id));}

  const grouped={};
  (data.instTasks||[]).forEach(t=>{if(!grouped[t.instructorId])grouped[t.instructorId]=[];grouped[t.instructorId].push(t);});

  return <div>
    <div className="section-header" style={{marginBottom:16}}>
      <span className="section-title">📋 {lang==='ar'?'مهام المحاضرين':'Instructor Tasks'}</span>
      <button className="btn btn-primary" onClick={()=>setShowAdd(true)}>➕ {lang==='ar'?'مهمة جديدة':'New Task'}</button>
    </div>
    {data.instructors.length===0?<div className="card" style={{textAlign:'center',padding:40,color:'var(--gray)'}}>لا يوجد محاضرون</div>:
    data.instructors.map(inst=>{
      const tasks=grouped[inst.id]||[];
      return <div key={inst.id} className="card" style={{marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
          <div className="avatar" style={{background:'var(--orange-light)',color:'var(--orange-dark)'}}>{inst.name?.[0]}</div>
          <div style={{fontWeight:800,fontSize:15}}>{inst.name}</div>
          <span className="badge badge-primary" style={{marginRight:'auto'}}>{tasks.filter(t=>!t.done).length} {lang==='ar'?'مهمة معلقة':'pending'}</span>
        </div>
        {tasks.length===0?<div style={{color:'var(--gray)',fontSize:13,padding:'8px 0'}}>{lang==='ar'?'لا توجد مهام':'No tasks'}</div>:
        tasks.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).map(t=><div key={t.id} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'10px 12px',borderRadius:10,marginBottom:6,background:t.done?'var(--light-gray)':'white',border:`1.5px solid ${t.done?'var(--border)':'var(--primary)'}`,opacity:t.done?.7:1}}>
          <input type="checkbox" checked={t.done} onChange={()=>toggleDone(t.id)} style={{width:18,height:18,marginTop:2,flexShrink:0,cursor:'pointer'}}/>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:13,textDecoration:t.done?'line-through':'none'}}>{t.title}</div>
            {t.body&&<div style={{fontSize:12.5,color:'var(--gray)',marginTop:3,lineHeight:1.6}}>{t.body}</div>}
            {t.dueDate&&<div style={{fontSize:11,color:'var(--orange-dark)',marginTop:4}}>📅 {lang==='ar'?'الموعد:':'Due:'} {formatDate(t.dueDate)}</div>}
          </div>
          <button className="btn btn-danger btn-sm btn-icon" onClick={()=>deleteTask(t.id)}>🗑️</button>
        </div>)}
      </div>;
    })}
    <Modal show={showAdd} onClose={()=>setShowAdd(false)} title={lang==='ar'?'إضافة مهمة':'New Task'}
      footer={<><button className="btn btn-ghost" onClick={()=>setShowAdd(false)}>{lang==='ar'?'إلغاء':'Cancel'}</button><button className="btn btn-primary" onClick={addTask}>➕ {lang==='ar'?'إضافة':'Add'}</button></>}>
      <Select label={lang==='ar'?'المحاضر':'Instructor'} required value={f.instructorId} onChange={set('instructorId')}>
        <option value="">-- {lang==='ar'?'اختر المحاضر':'Select Instructor'} --</option>
        {data.instructors.map(i=><option key={i.id} value={i.id}>{i.name}</option>)}
      </Select>
      <Input label={lang==='ar'?'عنوان المهمة':'Task Title'} required value={f.title} onChange={set('title')} placeholder={lang==='ar'?'مثال: مراجعة ملف المحاضرة 5':'E.g. Review lecture 5 materials'}/>
      <Textarea label={lang==='ar'?'تفاصيل المهمة':'Task Details'} value={f.body} onChange={set('body')} rows="3"/>
      <Input label={lang==='ar'?'الموعد النهائي':'Due Date'} type="date" value={f.dueDate} onChange={set('dueDate')}/>
    </Modal>
  </div>;
}

// ─── QUIZZES MODULE ───────────────────────────────────────────────────────────
function QuizzesModule({data,update,lang='ar'}){
  const [showAdd,setShowAdd]=useState(false);
  const [f,setF]=useState({afterLecture:8,course:'',grade:'Grade 1',title:'',questions:[{q:'',options:['','','',''],correct:0}]});
  const [editQ,setEditQ]=useState(null);

  function addQ(){setF(p=>({...p,questions:[...p.questions,{q:'',options:['','','',''],correct:0}]}));}
  function removeQ(i){setF(p=>({...p,questions:p.questions.filter((_,j)=>j!==i)}));}
  function setQText(i,v){setF(p=>{const qs=[...p.questions];qs[i]={...qs[i],q:v};return {...p,questions:qs};});}
  function setOpt(qi,oi,v){setF(p=>{const qs=[...p.questions];const opts=[...qs[qi].options];opts[oi]=v;qs[qi]={...qs[qi],options:opts};return {...p,questions:qs};});}
  function setCorrect(qi,v){setF(p=>{const qs=[...p.questions];qs[qi]={...qs[qi],correct:+v};return {...p,questions:qs};});}

  function saveQuiz(){
    if(!f.title.trim()){alert(lang==='ar'?'العنوان مطلوب':'Title required');return;}
    const quiz={...f,id:makeId(),createdAt:today()};
    update('quizzes',[...(data.quizzes||[]),quiz]);
    setShowAdd(false);setF({afterLecture:8,title:'',questions:[{q:'',options:['','','',''],correct:0}]});
  }
  function deleteQuiz(id){if(!confirm(lang==='ar'?'حذف الاختبار؟':'Delete quiz?'))return;update('quizzes',(data.quizzes||[]).filter(q=>q.id!==id));}

  return <div>
    <div className="section-header" style={{marginBottom:16}}>
      <span className="section-title">📝 {lang==='ar'?'الاختبارات الدورية':'Periodic Quizzes'}</span>
      <button className="btn btn-primary" onClick={()=>setShowAdd(true)}>➕ {lang==='ar'?'اختبار جديد':'New Quiz'}</button>
    </div>
    {(data.quizzes||[]).length===0?<div className="card" style={{textAlign:'center',padding:40,color:'var(--gray)'}}>
      <div style={{fontSize:36,marginBottom:8}}>📝</div>
      <div style={{fontWeight:700}}>{lang==='ar'?'لا توجد اختبارات بعد':'No quizzes yet'}</div>
    </div>:
    (data.quizzes||[]).map(quiz=><div key={quiz.id} className="card" style={{marginBottom:12}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <div style={{fontWeight:800,fontSize:15}}>{quiz.title}</div>
          <div style={{fontSize:12,color:'var(--gray)',marginTop:4}}>
            📖 {lang==='ar'?'بعد المحاضرة':'After Lecture'} {quiz.afterLecture} • {quiz.questions?.length} {lang==='ar'?'سؤال':'questions'}
            {quiz.course&&<span className="badge badge-primary" style={{marginRight:6,fontSize:10}}>{quiz.course}</span>}
            {quiz.grade&&<span className="badge badge-orange" style={{fontSize:10}}>{quiz.grade}</span>}
            {!quiz.course&&<span style={{fontSize:10,color:'var(--success)',marginRight:6}}>✓ كل الكورسات</span>}
          </div>
        </div>
        <button className="btn btn-danger btn-sm" onClick={()=>deleteQuiz(quiz.id)}>🗑️ {lang==='ar'?'حذف':'Delete'}</button>
      </div>
    </div>)}
    {showAdd&&<Modal show={showAdd} onClose={()=>setShowAdd(false)} title={lang==='ar'?'إنشاء اختبار جديد':'Create New Quiz'} size="modal-lg"
      footer={<><button className="btn btn-ghost" onClick={()=>setShowAdd(false)}>{lang==='ar'?'إلغاء':'Cancel'}</button><button className="btn btn-primary" onClick={saveQuiz}>{lang==='ar'?'حفظ الاختبار':'Save Quiz'}</button></>}>
      <div className="form-row">
        <Input label={lang==='ar'?'عنوان الاختبار':'Quiz Title'} required value={f.title} onChange={e=>setF(p=>({...p,title:e.target.value}))} placeholder={lang==='ar'?'اختبار المنتصف':'Midterm Quiz'}/>
        <Select label={lang==='ar'?'يظهر بعد المحاضرة رقم':'Show After Lecture'} value={f.afterLecture} onChange={e=>setF(p=>({...p,afterLecture:+e.target.value}))}>
          {[8,16].map(n=><option key={n} value={n}>{lang==='ar'?'بعد':'After'} {n}</option>)}
        </Select>
      </div>
      <div className="form-row">
        <Select label={lang==='ar'?'الكورس (اتركه فارغاً للكل)':'Course (leave blank for all)'} value={f.course} onChange={e=>setF(p=>({...p,course:e.target.value}))}>
          <option value="">{lang==='ar'?'-- كل الكورسات --':'-- All Courses --'}</option>
          {(data.courseNames||COURSES).map((c,i)=><option key={i} value={c}>{c}</option>)}
        </Select>
        <Select label={lang==='ar'?'الـ Grade (اتركه فارغاً للكل)':'Grade (leave blank for all)'} value={f.grade} onChange={e=>setF(p=>({...p,grade:e.target.value}))}>
          <option value="">{lang==='ar'?'-- كل المستويات --':'-- All Grades --'}</option>
          {getGrades(data).map(g=><option key={g} value={g}>{g}</option>)}
        </Select>
      </div>
      <div style={{fontWeight:700,marginBottom:10,fontSize:14}}>{lang==='ar'?'الأسئلة:':'Questions:'}</div>
      {f.questions.map((q,qi)=><div key={qi} style={{padding:'14px',borderRadius:10,border:'1.5px solid var(--border)',marginBottom:10,background:'var(--light-gray)'}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
          <span style={{fontWeight:700,fontSize:13}}>{lang==='ar'?'سؤال':'Q'} {qi+1}</span>
          {f.questions.length>1&&<button className="btn btn-danger btn-sm btn-icon" onClick={()=>removeQ(qi)}>✕</button>}
        </div>
        <Input label={lang==='ar'?'نص السؤال':'Question text'} value={q.q} onChange={e=>setQText(qi,e.target.value)} placeholder={lang==='ar'?'اكتب السؤال هنا...':'Write question here...'}/>
        <div style={{fontSize:12,fontWeight:700,color:'var(--gray)',marginBottom:8}}>{lang==='ar'?'الخيارات (اختر الصحيح):':'Options (select correct):'}</div>
        {q.options.map((opt,oi)=><div key={oi} style={{display:'flex',gap:8,marginBottom:6,alignItems:'center'}}>
          <input type="radio" name={`q${qi}`} checked={q.correct===oi} onChange={()=>setCorrect(qi,oi)} style={{flexShrink:0}}/>
          <input className="form-control" value={opt} onChange={e=>setOpt(qi,oi,e.target.value)} placeholder={`${lang==='ar'?'خيار':'Option'} ${oi+1}`} style={{flex:1}}/>
        </div>)}
      </div>)}
      <button className="btn btn-ghost" style={{width:'100%'}} onClick={addQ}>➕ {lang==='ar'?'إضافة سؤال':'Add Question'}</button>
    </Modal>}
  </div>;
}

// ─── INSTRUCTOR FILES MODULE ─────────────────────────────────────────────────
function InstFilesModule({data,update,lang='ar'}){
  const [showAdd,setShowAdd]=useState(false);
  const [selInst,setSelInst]=useState('');
  const [fileTitle,setFileTitle]=useState('');
  const [fileUrl,setFileUrl]=useState('');
  const [fileNote,setFileNote]=useState('');
  const [uploadName,setUploadName]=useState('');
  const [uploadData,setUploadData]=useState('');
  const [uploading,setUploading]=useState(false);

  function handleFileUpload(e){
    const file=e.target.files[0];
    if(!file)return;
    if(file.size>5*1024*1024){alert(lang==='ar'?'حجم الملف أكبر من 5MB. استخدم رابط خارجي بدلاً منه.':'File size exceeds 5MB. Use an external link instead.');return;}
    setUploading(true);
    const reader=new FileReader();
    reader.onload=ev=>{
      setUploadData(ev.target.result);
      setUploadName(file.name);
      if(!fileTitle)setFileTitle(file.name);
      setUploading(false);
    };
    reader.readAsDataURL(file);
  }

  function addFile(){
    if(!selInst){alert(lang==='ar'?'اختر المحاضر':'Select instructor');return;}
    if(!fileTitle.trim()){alert(lang==='ar'?'أدخل عنوان الملف':'Enter file title');return;}
    if(!fileUrl&&!uploadData){alert(lang==='ar'?'أضف رابطاً أو ارفع ملفاً':'Add a link or upload a file');return;}
    const newFile={
      id:makeId(),instructorId:selInst,title:fileTitle,
      url:fileUrl||null,fileData:uploadData||null,fileName:uploadName||null,
      note:fileNote,createdAt:today(),seen:false
    };
    update('instFilesList',[...(data.instFilesList||[]),newFile]);
    setShowAdd(false);setSelInst('');setFileTitle('');setFileUrl('');setFileNote('');setUploadData('');setUploadName('');
  }

  function deleteFile(id){
    if(!confirm(lang==='ar'?'حذف الملف؟':'Delete file?'))return;
    update('instFilesList',(data.instFilesList||[]).filter(f=>f.id!==id));
  }

  const grouped={};
  (data.instFilesList||[]).forEach(f=>{
    if(!grouped[f.instructorId])grouped[f.instructorId]=[];
    grouped[f.instructorId].push(f);
  });

  return <div>
    <div className="section-header" style={{marginBottom:20}}>
      <div>
        <div className="section-title">📁 {lang==='ar'?'ملفات المحاضرين':'Instructor Files'}</div>
        <div style={{fontSize:12,color:'var(--gray)',marginTop:4}}>{lang==='ar'?'أرسل روابط أو ملفات لكل محاضر — لن يراها الطلاب':'Send links or files to each instructor — students cannot see these'}</div>
      </div>
      <button className="btn btn-primary" onClick={()=>setShowAdd(true)}>➕ {lang==='ar'?'ملف جديد':'New File'}</button>
    </div>

    {data.instructors.length===0?<div className="card" style={{textAlign:'center',padding:40,color:'var(--gray)'}}>
      <div style={{fontSize:36,marginBottom:8}}>👨‍🏫</div>
      <div style={{fontWeight:700}}>{lang==='ar'?'لا يوجد محاضرون':'No instructors'}</div>
    </div>:
    data.instructors.map(inst=>{
      const files=(grouped[inst.id]||[]).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
      const unseen=files.filter(f=>!f.seen).length;
      return <div key={inst.id} className="card" style={{marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
          <div className="avatar" style={{background:'var(--orange-light)',color:'var(--orange-dark)'}}>{inst.name?.[0]}</div>
          <div style={{fontWeight:800,fontSize:15}}>{inst.name}</div>
          {unseen>0&&<span className="badge badge-danger" style={{marginRight:'auto'}}>{unseen} {lang==='ar'?'جديد':'new'}</span>}
          {files.length>0&&!unseen&&<span className="badge badge-success" style={{marginRight:'auto'}}>{files.length} {lang==='ar'?'ملف':'file(s)'}</span>}
        </div>
        {files.length===0?<div style={{color:'var(--gray)',fontSize:13,padding:'8px 0'}}>{lang==='ar'?'لا توجد ملفات لهذا المحاضر':'No files for this instructor'}</div>:
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {files.map(f=><div key={f.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderRadius:10,background:f.seen?'var(--light-gray)':'var(--primary-bg)',border:`1.5px solid ${f.seen?'var(--border)':'var(--primary)'}`}}>
            <span style={{fontSize:22,flexShrink:0}}>{f.fileData?'📄':'🔗'}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:13}}>{f.title}</div>
              {f.note&&<div style={{fontSize:12,color:'var(--gray)',marginTop:2}}>{f.note}</div>}
              <div style={{fontSize:11,color:'var(--gray)',marginTop:2}}>{formatDate(f.createdAt)} {f.seen?<span style={{color:'var(--success)'}}>• ✓ {lang==='ar'?'تم الاطلاع':'Seen'}</span>:<span style={{color:'var(--primary)'}}>• {lang==='ar'?'لم يُطلع عليه بعد':'Not seen yet'}</span>}</div>
            </div>
            <div style={{display:'flex',gap:6}}>
              {(f.url||f.fileData)&&<a href={f.url||f.fileData} target="_blank" rel="noreferrer" download={f.fileName||undefined} className="btn btn-primary btn-sm">👁️ {lang==='ar'?'فتح':'Open'}</a>}
              <button className="btn btn-danger btn-sm btn-icon" onClick={()=>deleteFile(f.id)}>🗑️</button>
            </div>
          </div>)}
        </div>}
      </div>;
    })}

    <Modal show={showAdd} onClose={()=>{setShowAdd(false);setUploadData('');setUploadName('');}} title={lang==='ar'?'إضافة ملف لمحاضر':'Add File for Instructor'} size="modal-lg"
      footer={<><button className="btn btn-ghost" onClick={()=>{setShowAdd(false);setUploadData('');setUploadName('');}}>{lang==='ar'?'إلغاء':'Cancel'}</button><button className="btn btn-primary" onClick={addFile} disabled={uploading}>📁 {lang==='ar'?'إرسال':'Send'}</button></>}>
      <div className="form-group">
        <label className="form-label">{lang==='ar'?'اختر المحاضر':'Select Instructor'} <span style={{color:'var(--danger)'}}>*</span></label>
        <select className="form-control" value={selInst} onChange={e=>setSelInst(e.target.value)} key={`inst-sel-${data.instructors.length}`}>
          <option value="">-- {lang==='ar'?'اختر المحاضر':'Select Instructor'} --</option>
          {(data.instructors||[]).filter(i=>i.status!=='deleted').map(i=><option key={i.id} value={i.id}>{i.name}</option>)}
        </select>
        {data.instructors.length===0&&<div style={{fontSize:12,color:'var(--danger)',marginTop:4}}>⚠️ {lang==='ar'?'لا يوجد محاضرون مسجلون بعد':'No instructors registered yet'}</div>}
      </div>
      <Input label={lang==='ar'?'عنوان الملف':'File Title'} required value={fileTitle} onChange={e=>setFileTitle(e.target.value)} placeholder={lang==='ar'?'مثال: مذكرة المحاضرة 5':'E.g. Lecture 5 Notes'}/>
      <Textarea label={lang==='ar'?'ملاحظة للمحاضر (اختياري)':'Note for instructor (optional)'} value={fileNote} onChange={e=>setFileNote(e.target.value)} rows="2"/>
      <div className="divider"/>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <div>
          <div style={{fontWeight:700,marginBottom:8,fontSize:13}}>🔗 {lang==='ar'?'رابط خارجي (Google Drive, Dropbox...)':'External Link'}</div>
          <Input label="" value={fileUrl} onChange={e=>setFileUrl(e.target.value)} placeholder="https://drive.google.com/..."/>
        </div>
        <div>
          <div style={{fontWeight:700,marginBottom:8,fontSize:13}}>📤 {lang==='ar'?'رفع ملف مباشر (PDF, صورة - حتى 5MB)':'Upload File (PDF, image - max 5MB)'}</div>
          <div style={{border:'2px dashed var(--border)',borderRadius:10,padding:'20px',textAlign:'center',cursor:'pointer',background:'var(--light-gray)'}} onClick={()=>document.getElementById('inst-file-input').click()}>
            {uploadData?<div><div style={{fontSize:20,marginBottom:4}}>✅</div><div style={{fontSize:12,fontWeight:700,color:'var(--success)'}}>{uploadName}</div></div>:
            <div><div style={{fontSize:24,marginBottom:4}}>📁</div><div style={{fontSize:12,color:'var(--gray)'}}>{uploading?'جاري الرفع...':lang==='ar'?'اضغط لاختيار ملف':'Click to choose file'}</div></div>}
          </div>
          <input id="inst-file-input" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.jpg,.jpeg,.png,.mp4,.zip" style={{display:'none'}} onChange={handleFileUpload}/>
        </div>
      </div>
      {fileUrl&&uploadData&&<div className="alert alert-warning" style={{marginTop:8}}>⚠️ {lang==='ar'?'سيتم استخدام الرابط الخارجي وتجاهل الملف المرفوع':'External link will be used, uploaded file ignored'}</div>}
    </Modal>
  </div>;
}

// ─── HOMEWORK MODULE ─────────────────────────────────────────────────────────
const BADGES=[
  {id:'star',icon:'⭐',label:'نجم المحاضرة'},
  {id:'fire',icon:'🔥',label:'متميز'},
  {id:'trophy',icon:'🏆',label:'الأول'},
  {id:'diamond',icon:'💎',label:'ممتاز'},
  {id:'rocket',icon:'🚀',label:'صاروخ'},
  {id:'crown',icon:'👑',label:'ملك الفصل'},
  {id:'medal',icon:'🥇',label:'ذهبية'},
  {id:'brain',icon:'🧠',label:'عبقري'},
];

function HomeworkModule({data,update,lang='ar'}){
  const [selStudent,setSelStudent]=useState(null);
  const [selLec,setSelLec]=useState(null); // {studentId, ckey, lectureNum}
  const [gradeVal,setGradeVal]=useState('');
  const [gradeNote,setGradeNote]=useState('');
  const [showBadge,setShowBadge]=useState(false);
  const [search,setSearch]=useState('');

  const filtered=data.students.filter(s=>ci(s.name,search)||ci(s.studentId,search));

  function getStudentQuizzes(studentId){
    return Object.entries(data.quizResults||{})
      .filter(([k])=>k.startsWith(studentId+'_'))
      .map(([k,v])=>({...v,key:k}))
      .sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt));
  }

  function saveGrade(quizKey){
    if(!gradeVal){alert('أدخل الدرجة');return;}
    update('quizResults',{...(data.quizResults||{}),[quizKey]:{
      ...(data.quizResults||{})[quizKey],
      teacherGrade:+gradeVal,teacherNote:gradeNote,gradedAt:new Date().toISOString()
    }});
    setGradeVal('');setGradeNote('');setSelLec(null);
  }
  function sendReportToParent(student,quiz){
    if(!student.phone){alert('لا يوجد رقم هاتف لولي الأمر');return;}
    const msg=`مرحباً ولي أمر ${student.name}،
نتيجة الواجب - محاضرة ${quiz.lectureNum}:
📊 النتيجة: ${quiz.score}/${quiz.total}
🎯 الدرجة: ${quiz.teacherGrade||'لم تُحدد بعد'}/100
📝 ملاحظة المعلم: ${quiz.teacherNote||'—'}

روبوتيكو 🤖`;
    window.open(waLink(student.phone,msg),'_blank');
  }

  function giveBadge(studentId,badge){
    const cur=(data.studentBadges||{})[studentId]||[];
    update('studentBadges',{...(data.studentBadges||{}),[studentId]:[
      ...cur,{...badge,date:new Date().toISOString(),note:gradeNote}
    ]});
    setShowBadge(false);setGradeNote('');
  }

  function removeBadge(studentId,idx){
    if(!confirm('حذف الشارة؟'))return;
    const cur=[...(data.studentBadges||{})[studentId]||[]];
    cur.splice(idx,1);
    update('studentBadges',{...(data.studentBadges||{}),[studentId]:cur});
  }

  const submittedCount=Object.keys(data.quizResults||{}).length;
  const gradedCount=Object.values(data.quizResults||{}).filter(v=>v.teacherGrade!=null).length;

  return <div>
    {/* Stats */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:20}}>
      <div className="stat-card"><div className="stat-icon blue">📝</div><div className="stat-number">{submittedCount}</div><div className="stat-label">واجب مُسلَّم</div></div>
      <div className="stat-card success"><div className="stat-icon green">✅</div><div className="stat-number">{gradedCount}</div><div className="stat-label">تم تقييمه</div></div>
      <div className="stat-card orange"><div className="stat-icon orange">⭐</div><div className="stat-number">{Object.values(data.studentBadges||{}).reduce((s,b)=>s+b.length,0)}</div><div className="stat-label">شارة تكريمية</div></div>
    </div>

    <div className="grid-2" style={{alignItems:'start',gap:16}}>
      {/* Students list */}
      <div className="card">
        <div style={{fontWeight:800,fontSize:15,marginBottom:12}}>👥 الطلاب</div>
        <input className="form-control" value={search} onChange={e=>setSearch(e.target.value)} placeholder="بحث..." style={{marginBottom:12}}/>
        <div style={{display:'flex',flexDirection:'column',gap:6,maxHeight:480,overflowY:'auto'}}>
          {filtered.map(s=>{
            const quizzes=getStudentQuizzes(s.id);
            const badges=(data.studentBadges||{})[s.id]||[];
            const ungraded=quizzes.filter(q=>q.teacherGrade==null).length;
            return <div key={s.id} onClick={()=>setSelStudent(s.id===selStudent?null:s.id)}
              style={{padding:'10px 14px',borderRadius:10,cursor:'pointer',
                background:selStudent===s.id?'var(--primary-bg)':'white',
                border:`1.5px solid ${selStudent===s.id?'var(--primary)':'var(--border)'}`,transition:'.15s'}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <div className="avatar" style={{flexShrink:0}}>{s.name?.[0]}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:13}}>{s.name}</div>
                  <div style={{fontSize:11,color:'var(--gray)'}}>{quizzes.length} واجب مُسلَّم</div>
                </div>
                <div style={{display:'flex',gap:4,flexShrink:0}}>
                  {ungraded>0&&<span className="badge badge-warning">{ungraded} جديد</span>}
                  {badges.length>0&&<span style={{fontSize:16}}>{badges.slice(-2).map(b=>b.icon).join('')}</span>}
                </div>
              </div>
              {selStudent===s.id&&<div style={{marginTop:12,borderTop:'1px solid var(--border)',paddingTop:12}}>
                {/* Badges */}
                <div style={{marginBottom:10}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                    <span style={{fontSize:12,fontWeight:700,color:'var(--orange-dark)'}}>⭐ شاراته التكريمية</span>
                    <button className="btn btn-orange btn-sm" style={{fontSize:11}} onClick={e=>{e.stopPropagation();setShowBadge(s.id);}}>+ منح شارة</button>
                  </div>
                  {badges.length===0?<span style={{fontSize:12,color:'var(--gray)'}}>لا توجد شارات بعد</span>:
                  <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                    {badges.map((b,bi)=><div key={bi} style={{display:'flex',alignItems:'center',gap:4,padding:'4px 8px',background:'#FFFBEB',borderRadius:8,border:'1px solid #FDE68A',fontSize:12}}>
                      <span style={{fontSize:16}}>{b.icon}</span><span style={{fontWeight:600}}>{b.label}</span>
                      <button onClick={ev=>{ev.stopPropagation();removeBadge(s.id,bi);}} style={{background:'none',border:'none',cursor:'pointer',color:'var(--gray)',fontSize:12,padding:0}}>✕</button>
                    </div>)}
                  </div>}
                </div>
                {/* Quizzes */}
                {quizzes.length===0?<div style={{fontSize:12,color:'var(--gray)',textAlign:'center',padding:'8px 0'}}>لم يُسلِّم أي واجب بعد</div>:
                quizzes.map(q=>{
                  const ckey=q.key.split('_').slice(1).join('_');
                  const qs=(data.lectureQs||{})[ckey]||[];
                  return <div key={q.key} style={{padding:'8px 10px',borderRadius:8,marginBottom:6,background:q.teacherGrade!=null?'#ECFDF5':'#FFFBEB',border:`1px solid ${q.teacherGrade!=null?'#A7F3D0':'#FDE68A'}`}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div>
                      <div style={{fontSize:12,fontWeight:700}}>محاضرة {q.lectureNum} — النتيجة: {q.score}/{q.total}</div>
                      <div style={{fontSize:11,color:'var(--gray)'}}>{q.submittedAt?new Date(q.submittedAt).toLocaleDateString('ar-EG'):''}</div>
                    </div>
                    <div style={{display:'flex',gap:4,alignItems:'center'}}>
                      {q.teacherGrade!=null?
                        <span style={{fontWeight:800,color:'var(--success)',fontSize:12}}>🎯 {q.teacherGrade}/100</span>:
                        <button className="btn btn-primary btn-sm" style={{fontSize:10}} onClick={e=>{e.stopPropagation();setSelLec({key:q.key,lectureNum:q.lectureNum,score:q.score,total:q.total});}}>✏️</button>}
                      {q.teacherGrade!=null&&<button className="btn btn-wa btn-sm btn-icon" style={{fontSize:10}} title="إرسال تقرير لولي الأمر" onClick={e=>{e.stopPropagation();sendReportToParent(data.students.find(s=>s.id===selStudent)||{},q);}}>💬</button>}
                    </div>
                  </div>
                  {/* Show actual student answers */}
                  {qs.length>0&&<div style={{marginTop:8,borderTop:'1px dashed var(--border)',paddingTop:8}}>
                    <div style={{fontSize:11,fontWeight:700,color:'var(--primary)',marginBottom:5}}>📋 إجابات الطالب:</div>
                    {qs.map((question,qi)=><AnswerDisplay key={qi} question={question} ans={q.answers?.[qi]} qi={qi}/>)}
                  </div>}
                  {q.teacherNote&&<div style={{fontSize:11,color:'var(--gray)',marginTop:4,fontStyle:'italic'}}>{q.teacherNote}</div>}
                </div>
              })}
              </div>}
            </div>;
          })}
        </div>
      </div>

      {/* Right panel - Grade or Badge */}
      <div>
        {selLec&&<div className="card" style={{marginBottom:16,border:'1.5px solid var(--primary)'}}>
          <div style={{fontWeight:800,fontSize:15,marginBottom:12,color:'var(--primary)'}}>✏️ تقييم الواجب — محاضرة {selLec.lectureNum}</div>
          <div style={{padding:'10px 14px',background:'var(--primary-bg)',borderRadius:10,marginBottom:12}}>
            <div style={{fontSize:13}}>النتيجة التلقائية: <strong>{selLec.score}/{selLec.total}</strong></div>
          </div>
          <Input label="الدرجة (من 100)" type="number" value={gradeVal} onChange={e=>setGradeVal(e.target.value)} placeholder="85"/>
          <Textarea label="ملاحظة للطالب (اختياري)" value={gradeNote} onChange={e=>setGradeNote(e.target.value)} rows="2"/>
          <div style={{display:'flex',gap:8,marginTop:4}}>
            <button className="btn btn-primary" style={{flex:1}} onClick={()=>saveGrade(selLec.key)}>💾 حفظ التقييم</button>
            <button className="btn btn-ghost" onClick={()=>setSelLec(null)}>إلغاء</button>
          </div>
        </div>}

        {!selLec&&!showBadge&&<div className="card" style={{textAlign:'center',padding:40,color:'var(--gray)'}}>
          <div style={{fontSize:40,marginBottom:8}}>📝</div>
          <div style={{fontWeight:700}}>اختر طالباً لتقييم واجباته أو منح شارة</div>
        </div>}
      </div>
    </div>

    {/* Badge Modal */}
    {showBadge&&<div className="modal-overlay" onClick={()=>setShowBadge(false)}>
      <div className="modal modal-sm" onClick={e=>e.stopPropagation()}>
        <div className="modal-header">
          <span className="modal-title">⭐ منح شارة تكريمية</span>
          <button className="modal-close" onClick={()=>setShowBadge(false)}>✕</button>
        </div>
        <div className="modal-body">
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:14}}>
            {BADGES.map(b=><div key={b.id} onClick={()=>giveBadge(showBadge,b)}
              style={{padding:'12px 8px',borderRadius:12,textAlign:'center',cursor:'pointer',background:'#FFFBEB',border:'1.5px solid #FDE68A',transition:'.15s'}}
              onMouseOver={e=>e.currentTarget.style.transform='scale(1.05)'}
              onMouseOut={e=>e.currentTarget.style.transform='scale(1)'}>
              <div style={{fontSize:28,marginBottom:4}}>{b.icon}</div>
              <div style={{fontSize:11,fontWeight:700,color:'var(--orange-dark)'}}>{b.label}</div>
            </div>)}
          </div>
          <Textarea label="ملاحظة مع الشارة (اختياري)" value={gradeNote} onChange={e=>setGradeNote(e.target.value)} rows="2"/>
        </div>
      </div>
    </div>}
  </div>;
}

// ─── SUPER ADMIN PANEL ───────────────────────────────────────────────────────
function SuperAdminPanel({data,setData,currentUser,setCurrentUser,lang='ar',toggleLang}){
  const [section,setSection]=useState('content');
  const update=(k,v)=>setData(p=>{const n={...p,[k]:v};save(n);return n;});

  const navItems=[
    {id:'content',icon:'📚',label:lang==='ar'?'المحتوى التعليمي':'Course Content'},
    {id:'homework',icon:'📝',label:lang==='ar'?'مراجعة الواجبات':'Homework Review'},
    {id:'tasks',icon:'📋',label:lang==='ar'?'مهام المحاضرين':'Instructor Tasks'},
    {id:'quizzes',icon:'📝',label:lang==='ar'?'الاختبارات الدورية':'Periodic Quizzes'},
    {id:'ratings',icon:'⭐',label:lang==='ar'?'التقييمات والملاحظات':'Ratings & Notes'},
    {id:'users',icon:'🔑',label:lang==='ar'?'إدارة المستخدمين':'User Management'},

  return <div className="app">
    <aside className="sidebar">
      <div className="sidebar-logo">
        <div className="sidebar-logo-icon" style={{background:'var(--primary-light)',fontSize:22}}>⚙️</div>
        <div><div className="sidebar-logo-text">{lang==='ar'?'روبوتيكو':'Robotico'}</div><div className="sidebar-logo-sub">{lang==='ar'?'الإدارة العامة':'General Admin'}</div></div>
      </div>
      <nav className="sidebar-nav">
        <div className="sidebar-section">
          <div className="sidebar-section-title">{lang==='ar'?'الأدوات':'TOOLS'}</div>
          {navItems.map(item=><div key={item.id} className={`nav-item ${section===item.id?'active':''}`} onClick={()=>setSection(item.id)}>
            <span className="icon">{item.icon}</span>
            <span>{item.label}</span>
            {item.id==='ratings'&&unreadCount>0&&<span className="nav-badge">{unreadCount}</span>}
          </div>)}
        </div>
      </nav>
      <div className="sidebar-footer">
        <div className="sidebar-user">
          <div className="sidebar-avatar">⚙</div>
          <div className="sidebar-user-info">
            <div className="sidebar-user-name">{currentUser.name||'الإدارة العامة'}</div>
            <div className="sidebar-user-role">{lang==='ar'?'إدارة عامة':'Super Admin'}</div>
          </div>
          <button className="logout-btn" onClick={()=>{if(confirm(lang==='ar'?'خروج؟':'Logout?'))setCurrentUser(null);}}>⏻</button>
        </div>
      </div>
    </aside>
    <main className="main">
      <div className="topbar">
        <div>
          <div className="topbar-breadcrumb">{lang==='ar'?'الإدارة العامة':'Super Admin'}</div>
          <div className="topbar-title">{navItems.find(n=>n.id===section)?.label}</div>
        </div>
        <div className="topbar-actions">
          <button onClick={toggleLang} className="btn btn-ghost btn-sm" style={{fontWeight:700}}>🌐 {T[lang].lang}</button>
          <button className="btn btn-danger btn-sm" onClick={()=>{if(confirm(lang==='ar'?'خروج؟':'Logout?'))setCurrentUser(null);}}>⏻ {T[lang].logout}</button>
        </div>
      </div>
      <div className="content">
        {section==='content'&&<ContentModule data={data} update={update}/>}
        {section==='homework'&&<HomeworkModule data={data} update={update} lang={lang}/>}
        {section==='tasks'&&<InstTasksModule data={data} update={update} lang={lang}/>}
        {section==='quizzes'&&<QuizzesModule data={data} update={update} lang={lang}/>}
        {section==='instfiles'&&<InstFilesModule data={data} update={update} lang={lang}/>}
        {section==='ratings'&&<RatingsModule data={data} update={update} lang={lang}/>}
        {section==='users'&&<SuperUsersModule data={data} update={update} currentUser={currentUser} lang={lang}/>}
      </div>
    </main>
  </div>;
}

// ─── SUPER USERS MODULE (password/username management only) ───────────────────
function SuperUsersModule({data,update,currentUser,lang='ar'}){
  // Stats
  const totalStudents=data.students.length;
  const activeStudents=data.students.filter(s=>s.status!=='suspended').length;
  const cm=new Date().toISOString().substr(0,7);
  const monthPayments=data.payments.filter(p=>p.date?.startsWith(cm)).reduce((s,p)=>s+(+p.amount||0),0);
  
  // Filter out students from users table - managed separately
  const nonStudentUsers=(data.users||[]).filter(u=>u.role!=='student');
  const [editUser,setEditUser]=useState(null);
  const [editUname,setEditUname]=useState('');
  const [editPass,setEditPass]=useState('');
  const [editPass2,setEditPass2]=useState('');
  const [showPass,setShowPass]=useState(false);
  const [msg,setMsg]=useState('');

  // Also manage super_admin own credentials
  const [myUname,setMyUname]=useState('');
  const [myPass,setMyPass]=useState('');
  const [myPass2,setMyPass2]=useState('');
  const [myMsg,setMyMsg]=useState('');

  function saveEdit(){
    if(!editUname.trim()){alert(lang==='ar'?'اسم المستخدم مطلوب':'Username required');return;}
    if(editPass&&editPass!==editPass2){alert(lang==='ar'?'كلمتا المرور غير متطابقتين':'Passwords do not match');return;}
    const users=data.users.map(u=>u.id===editUser.id?{...u,username:editUname,password:editPass||u.password}:u);
    update('users',users);
    setMsg(lang==='ar'?'✅ تم الحفظ':'✅ Saved');
    setEditUser(null);
    setTimeout(()=>setMsg(''),3000);
  }
  function saveMyCredentials(){
    if(!myUname.trim()){setMyMsg(lang==='ar'?'❌ اسم المستخدم مطلوب':'❌ Username required');return;}
    if(myPass&&myPass!==myPass2){setMyMsg(lang==='ar'?'❌ كلمتا المرور غير متطابقتين':'❌ Passwords do not match');return;}
    const users=data.users.map(u=>u.id===currentUser.id?{...u,username:myUname,password:myPass||u.password}:u);
    update('users',users);
    setMyMsg(lang==='ar'?'✅ تم التحديث':'✅ Updated');
    setMyPass('');setMyPass2('');
    setTimeout(()=>setMyMsg(''),3000);
  }

  const roleLabel={admin:lang==='ar'?'مدير':'Admin',super_admin:lang==='ar'?'إدارة عامة':'Super Admin',instructor:lang==='ar'?'محاضر':'Instructor',student:lang==='ar'?'طالب':'Student'};
  const roleColor={admin:'badge-danger',super_admin:'badge-primary',instructor:'badge-orange',student:'badge-success'};
  const myUser=data.users.find(u=>u.id===currentUser.id);

  return <div>
    {/* Super Admin Own Credentials */}
    <div className="card" style={{marginBottom:20,border:'2px solid var(--primary)'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <div style={{width:44,height:44,background:'var(--primary)',borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>🔐</div>
        <div>
          <div style={{fontWeight:800,fontSize:15,color:'var(--primary)'}}>{lang==='ar'?'بيانات دخول الإدارة العامة':'Super Admin Login Credentials'}</div>
          <div style={{fontSize:12,color:'var(--gray)'}}>{lang==='ar'?'تغيير بياناتك الشخصية':'Change your own credentials'}</div>
        </div>
      </div>
      {myMsg&&<div className={`alert ${myMsg.startsWith('✅')?'alert-success':'alert-danger'}`}>{myMsg}</div>}
      <div className="form-row">
        <div className="form-group">
          <label className="form-label">{lang==='ar'?'اسم المستخدم الحالي':'Current Username'}</label>
          <div className="cred-box"><span className="cred-text">{myUser?.username}</span></div>
        </div>
        <Input label={lang==='ar'?'اسم المستخدم الجديد':'New Username'} value={myUname} onChange={e=>setMyUname(e.target.value)} placeholder={myUser?.username}/>
      </div>
      <div className="form-row">
        <Input label={lang==='ar'?'كلمة المرور الجديدة':'New Password'} type={showPass?'text':'password'} value={myPass} onChange={e=>setMyPass(e.target.value)} placeholder="••••••••"/>
        <Input label={lang==='ar'?'تأكيد كلمة المرور':'Confirm Password'} type={showPass?'text':'password'} value={myPass2} onChange={e=>setMyPass2(e.target.value)} placeholder="••••••••"/>
      </div>
      <div style={{display:'flex',gap:10,alignItems:'center'}}>
        <button className="btn btn-primary" onClick={saveMyCredentials}>{T[lang].save}</button>
        <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',fontSize:13,color:'var(--gray)',fontWeight:600}}>
          <input type="checkbox" checked={showPass} onChange={e=>setShowPass(e.target.checked)}/> {lang==='ar'?'إظهار':'Show'}
        </label>
      </div>
    </div>

    {/* All Users Table */}
    {/* Stats */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:20}}>
      <div className="stat-card"><div className="stat-icon blue">🎓</div><div className="stat-number">{totalStudents}</div><div className="stat-label">{lang==='ar'?'إجمالي الطلاب':'Total Students'}</div></div>
      <div className="stat-card success"><div className="stat-icon green">✅</div><div className="stat-number">{activeStudents}</div><div className="stat-label">{lang==='ar'?'الطلاب النشطون':'Active Students'}</div></div>
      <div className="stat-card orange"><div className="stat-icon orange">💰</div><div className="stat-number">{monthPayments}</div><div className="stat-label">{lang==='ar'?'مدفوعات هذا الشهر (جنيه)':'This Month Payments (EGP)'}</div></div>
    </div>

    {msg&&<div className="alert alert-success" style={{marginBottom:12}}>{msg}</div>}
    <div className="card">
      <div className="section-title" style={{marginBottom:16}}>{lang==='ar'?'مستخدمو النظام (بدون الطلاب)':'System Users (Excluding Students)'} ({nonStudentUsers.length})</div>
      <div className="table-wrap"><table>
        <thead><tr>
          <th>{lang==='ar'?'الاسم':'Name'}</th>
          <th>{lang==='ar'?'اسم المستخدم':'Username'}</th>
          <th>{lang==='ar'?'كلمة المرور':'Password'}</th>
          <th>{lang==='ar'?'الدور':'Role'}</th>
          <th>{lang==='ar'?'الحالة / تعديل':'Status / Edit'}</th>
        </tr></thead>
        <tbody>{nonStudentUsers.map(u=><tr key={u.id}>
          <td><div style={{display:'flex',alignItems:'center',gap:8}}>
            <div className="avatar" style={{fontSize:13}}>{u.name?.[0]||'؟'}</div>
            <div style={{fontWeight:700}}>{u.name}</div>
          </div></td>
          <td><span className="badge badge-primary" style={{fontFamily:'monospace',fontSize:12}}>{u.username}</span></td>
          <td><div style={{fontFamily:'monospace',fontSize:12,color:'var(--gray)',letterSpacing:1}}>{u.role==='student'?'••••••••':u.password}</div></td>
          <td><span className={`badge ${roleColor[u.role]||'badge-primary'}`}>{roleLabel[u.role]||u.role}</span></td>
          <td>
            {u.role==='student'?(()=>{
              const st=data.students.find(s=>s.id===u.studentId);
              return <span className={`badge ${st?.status==='suspended'?'badge-warning':'badge-success'}`}>
                {st?.status==='suspended'?(lang==='ar'?'⏸️ موقف':'⏸️ Suspended'):(lang==='ar'?'✅ نشط':'✅ Active')}
              </span>;
            })():
            <button className="btn btn-outline btn-sm" onClick={()=>{setEditUser(u);setEditUname(u.username);setEditPass('');setEditPass2('');}}>✏️ {lang==='ar'?'تعديل':'Edit'}</button>}
          </td>
        </tr>)}</tbody>
      </table></div>
    </div>

    {/* Edit User Modal */}
    {editUser&&<Modal show={!!editUser} onClose={()=>setEditUser(null)} title={`${lang==='ar'?'تعديل':'Edit'}: ${editUser.name}`} size="modal-sm"
      footer={<><button className="btn btn-ghost" onClick={()=>setEditUser(null)}>{T[lang].cancel}</button><button className="btn btn-primary" onClick={saveEdit}>{T[lang].save}</button></>}>
      <div className="alert alert-warning" style={{fontSize:12}}>⚠️ {lang==='ar'?'تغيير البيانات سيؤثر على دخول هذا المستخدم':'Changing these will affect this user login'}</div>
      <Input label={lang==='ar'?'اسم المستخدم الجديد':'New Username'} value={editUname} onChange={e=>setEditUname(e.target.value)}/>
      <div className="form-row">
        <Input label={lang==='ar'?'كلمة المرور الجديدة':'New Password'} type={showPass?'text':'password'} value={editPass} onChange={e=>setEditPass(e.target.value)} placeholder={lang==='ar'?'اتركه فارغاً للإبقاء على الحالية':'Leave blank to keep current'}/>
        <Input label={lang==='ar'?'تأكيد':'Confirm'} type={showPass?'text':'password'} value={editPass2} onChange={e=>setEditPass2(e.target.value)} placeholder="••••••••"/>
      </div>
      <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',fontSize:13,color:'var(--gray)',fontWeight:600}}>
        <input type="checkbox" checked={showPass} onChange={e=>setShowPass(e.target.checked)}/> {lang==='ar'?'إظهار كلمة المرور':'Show password'}
      </label>
    </Modal>}
  </div>;
}

// ─── CERTIFICATE GENERATOR ───────────────────────────────────────────────────
function CertificateGenerator({student,grade,course,date,onClose,readOnly=false}){
  const [tab,setTab]=useState('preview');
  const [cfg,setCfg]=useState({
    academyName:'Robotico Academy',
    certTitle:'Certificate of Completion',
    subText:'This is to certify that',
    bodyText1:'has successfully completed all requirements and passed the final assessment of',
    bodyText2:'demonstrating outstanding achievement in Robotics & Programming Education',
    directorLabel:'Academy Director',
    directorName:'',
    instructorLabel:'Course Instructor',
    instructorName:'',
    ornament:'🏆 ✦ 🤖 ✦ 🏆',
    primaryColor:'#2C687B',
    accentColor:'#F97316',
    showCertId:true,
    bgStyle:'gradient',
    logoImg:'',
    logoSize:80,
    logoPos:'top',
    bgImg:'',
    bgOpacity:0.08,
    directorSigImg:'',
    instructorSigImg:'',
    showOrnament:true,
  });
  const set=k=>e=>setCfg(p=>({...p,[k]:e.target.value}));
  const setNum=k=>e=>setCfg(p=>({...p,[k]:+e.target.value}));
  const setCheck=k=>e=>setCfg(p=>({...p,[k]:e.target.checked}));
  const setImg=k=>e=>{
    const file=e.target.files?.[0];
    if(!file)return;
    if(file.size>2*1024*1024){alert('حجم الصورة يجب أن يكون أقل من 2MB');return;}
    const reader=new FileReader();
    reader.onload=ev=>setCfg(p=>({...p,[k]:ev.target.result}));
    reader.readAsDataURL(file);
  };

  const bgMap={
    gradient:'linear-gradient(135deg,#f8fbff 0%,white 50%,#f8fbff 100%)',
    white:'white',
    light:'linear-gradient(160deg,#fffdf7,#fff,#f0f9ff)',
    dark:'linear-gradient(135deg,#1a2a35,#0f1e28)',
  };

  function buildHTML(){
    const certId='ROBO-'+Date.now().toString(36).toUpperCase();
    const bg=bgMap[cfg.bgStyle]||bgMap.gradient;
    const isDark=cfg.bgStyle==='dark';
    const textClr=isDark?'#e8e0d0':'#444';
    const headClr=isDark?'#e8e0d0':'#1a1a1a';

    const logoHTML=cfg.logoImg
      ? (cfg.logoPos==='left'||cfg.logoPos==='right')
        ? ''
        : '<div class="logo-wrap"><img src="'+cfg.logoImg+'" style="height:'+cfg.logoSize+'px;max-width:160px;object-fit:contain;display:block;margin:0 auto 8px"/></div>'
      : '';
    const logoLeftHTML=cfg.logoImg&&cfg.logoPos==='left'
      ? '<img src="'+cfg.logoImg+'" style="position:absolute;top:18mm;left:18mm;height:'+cfg.logoSize+'px;max-width:120px;object-fit:contain"/>'
      : '';
    const logoRightHTML=cfg.logoImg&&cfg.logoPos==='right'
      ? '<img src="'+cfg.logoImg+'" style="position:absolute;top:18mm;right:18mm;height:'+cfg.logoSize+'px;max-width:120px;object-fit:contain"/>'

    const bgImgHTML=cfg.bgImg
      ? '<img src="'+cfg.bgImg+'" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:'+cfg.bgOpacity+';pointer-events:none;z-index:0"/>'
      : '';
    const dirSigHTML=cfg.directorSigImg
      ? '<img src="'+cfg.directorSigImg+'" style="height:44px;max-width:110px;object-fit:contain;display:block;margin:0 auto 4px"/>'
      : '';
    const instSigHTML=cfg.instructorSigImg
      ? '<img src="'+cfg.instructorSigImg+'" style="height:44px;max-width:110px;object-fit:contain;display:block;margin:0 auto 4px"/>'
      : '';

    return '<!DOCTYPE html><html><head><meta charset="UTF-8">\n'+
'<style>\n'+
'  @import url(\'https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap\');\n'+
'  *{margin:0;padding:0;box-sizing:border-box}\n'+
'  body{width:297mm;height:210mm;background:white;font-family:\'Lato\',sans-serif;display:flex;align-items:center;justify-content:center}\n'+
'  .cert{width:280mm;height:195mm;border:8px double '+cfg.primaryColor+';padding:10mm 20mm;text-align:center;position:relative;background:'+bg+';overflow:hidden}\n'+
'  .cert-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;height:100%}\n'+
'  .cert::before{content:\'\';position:absolute;top:12px;left:12px;right:12px;bottom:12px;border:2px solid '+cfg.accentColor+';pointer-events:none;z-index:2}\n'+
'  .top-ornament{font-size:24px;margin-bottom:4px;color:'+cfg.primaryColor+'}\n'+
'  .academy{font-size:12px;color:'+cfg.accentColor+';font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}\n'+
'  .cert-title{font-family:\'Playfair Display\',serif;font-size:34px;color:'+cfg.primaryColor+';margin-bottom:10px}\n'+
'  .cert-sub{font-size:11px;color:#777;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}\n'+
'  .student-name{font-family:\'Playfair Display\',serif;font-size:30px;color:'+headClr+';border-bottom:2px solid '+cfg.accentColor+';display:inline-block;padding-bottom:5px;margin-bottom:12px}\n'+
'  .cert-body{font-size:12px;color:'+textClr+';line-height:1.7;margin-bottom:10px}\n'+
'  .grade-box{display:inline-block;background:linear-gradient(135deg,'+cfg.primaryColor+','+cfg.primaryColor+'cc);color:white;padding:6px 24px;border-radius:30px;font-size:15px;font-weight:700;letter-spacing:2px;margin-bottom:12px}\n'+
'  .course-tag{font-size:10px;color:'+cfg.accentColor+';font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}\n'+
'  .footer{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;width:100%;padding-top:8px}\n'+
'  .sig{text-align:center}\n'+
'  .sig-line{width:110px;border-top:1px solid #333;margin:0 auto 4px}\n'+
'  .sig-name{font-size:11px;color:#333;font-weight:700;margin-bottom:2px}\n'+
'  .sig-label{font-size:9px;color:#666;text-transform:uppercase;letter-spacing:1px}\n'+
'  .date-box{font-size:10px;color:#888;text-align:center}\n'+
'</style></head><body><div class="cert">\n'+
bgImgHTML+logoLeftHTML+logoRightHTML+
'<div class="cert-inner">\n'+
(cfg.showOrnament&&cfg.logoPos==='top'?'  <div class="top-ornament">'+cfg.ornament+'</div>\n':'')+
logoHTML+
'  <div class="academy">'+cfg.academyName+'</div>\n'+
'  <div class="cert-title">'+cfg.certTitle+'</div>\n'+
'  <div class="cert-sub">'+cfg.subText+'</div>\n'+
'  <div class="student-name">'+student.name+'</div>\n'+
'  <div class="cert-body">'+cfg.bodyText1+'</div>\n'+
'  <div class="course-tag">'+course+'</div>\n'+
'  <div class="grade-box">'+grade+'</div>\n'+
'  <div class="cert-body">'+cfg.bodyText2+'</div>\n'+
'  <div class="footer">\n'+
'    <div class="sig">'+dirSigHTML+'<div class="sig-line"></div>'+(cfg.directorName?'<div class="sig-name">'+cfg.directorName+'</div>':'')+'<div class="sig-label">'+cfg.directorLabel+'</div></div>\n'+
'    <div class="date-box"><div style="font-size:16px">⭐</div><div>Issued on: '+date+'</div>'+(cfg.showCertId?'<div style="margin-top:3px;font-size:8px;color:#bbb">ID: '+certId+'</div>':'')+'</div>\n'+
'    <div class="sig">'+instSigHTML+'<div class="sig-line"></div>'+(cfg.instructorName?'<div class="sig-name">'+cfg.instructorName+'</div>':'')+'<div class="sig-label">'+cfg.instructorLabel+'</div></div>\n'+
'  </div>\n'+
'</div></div></body></html>';
  }

  function downloadPDF(){
    const win=window.open('','_blank');
    if(!win){alert('اسمح للمتصفح بفتح نوافذ جديدة');return;}
    win.document.write(buildHTML());
    win.document.close();
    setTimeout(()=>{win.print();},700);
  }

  const PreviewPane=()=>{
    const bg=bgMap[cfg.bgStyle]||bgMap.gradient;
    const isDark=cfg.bgStyle==='dark';
    return <div style={{overflowX:'auto',padding:'8px 0'}}>
      <div style={{width:740,margin:'0 auto',height:520,border:'5px double '+cfg.primaryColor,background:bg,

        {cfg.bgImg&&<img src={cfg.bgImg} style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',objectFit:'cover',opacity:cfg.bgOpacity,pointerEvents:'none'}}/>}
        <div style={{position:'absolute',top:8,left:8,right:8,bottom:8,border:'1.5px solid '+cfg.accentColor,pointerEvents:'none',zIndex:2}}/>
        {cfg.logoImg&&cfg.logoPos==='left'&&<img src={cfg.logoImg} style={{position:'absolute',top:24,left:24,height:cfg.logoSize,maxWidth:100,objectFit:'contain',zIndex:3}}/>}
        {cfg.logoImg&&cfg.logoPos==='right'&&<img src={cfg.logoImg} style={{position:'absolute',top:24,right:24,height:cfg.logoSize,maxWidth:100,objectFit:'contain',zIndex:3}}/>}
        <div style={{position:'relative',zIndex:3,display:'flex',flexDirection:'column',alignItems:'center',height:'100%',padding:'28px 40px',textAlign:'center',fontFamily:'Georgia,serif'}}>
          {cfg.showOrnament&&cfg.logoPos==='top'&&<div style={{fontSize:20,marginBottom:4,color:cfg.primaryColor}}>{cfg.ornament}</div>}
          {cfg.logoImg&&cfg.logoPos==='top'&&<img src={cfg.logoImg} style={{height:Math.min(cfg.logoSize,60),maxWidth:130,objectFit:'contain',marginBottom:6}}/>}
          <div style={{fontSize:10,color:cfg.accentColor,fontWeight:700,letterSpacing:3,textTransform:'uppercase',marginBottom:8}}>{cfg.academyName}</div>
          <div style={{fontSize:26,color:cfg.primaryColor,fontWeight:700,marginBottom:8}}>{cfg.certTitle}</div>
          <div style={{fontSize:9,color:'#777',letterSpacing:2,textTransform:'uppercase',marginBottom:12}}>{cfg.subText}</div>
          <div style={{fontSize:24,color:isDark?'#e8e0d0':'#1a1a1a',fontWeight:700,borderBottom:'2px solid '+cfg.accentColor,paddingBottom:4,marginBottom:10,display:'inline-block'}}>{student.name}</div>
          <div style={{fontSize:10,color:isDark?'#ccc':'#444',lineHeight:1.7,marginBottom:8,maxWidth:460}}>{cfg.bodyText1}</div>
          <div style={{fontSize:9,color:cfg.accentColor,fontWeight:700,letterSpacing:2,textTransform:'uppercase',marginBottom:4}}>{course}</div>
          <div style={{display:'inline-block',background:cfg.primaryColor,color:'white',padding:'5px 20px',borderRadius:18,fontSize:13,fontWeight:700,letterSpacing:2,marginBottom:10}}>{grade}</div>
          <div style={{fontSize:10,color:isDark?'#ccc':'#444',lineHeight:1.7,maxWidth:460,marginBottom:'auto'}}>{cfg.bodyText2}</div>
          <div style={{display:'flex',justifyContent:'space-between',width:'100%',marginTop:12,alignItems:'flex-end'}}>
            <div style={{textAlign:'center'}}>
              {cfg.directorSigImg&&<img src={cfg.directorSigImg} style={{height:36,maxWidth:90,objectFit:'contain',display:'block',margin:'0 auto 3px'}}/>}
              <div style={{width:90,borderTop:'1px solid #333',marginBottom:3}}/>
              {cfg.directorName&&<div style={{fontSize:9,fontWeight:700}}>{cfg.directorName}</div>}
              <div style={{fontSize:8,color:'#666',textTransform:'uppercase',letterSpacing:1}}>{cfg.directorLabel}</div>
            </div>
            <div style={{textAlign:'center',fontSize:9,color:'#888'}}>
              <div style={{fontSize:14}}>⭐</div><div>Issued on: {date}</div>
            </div>
            <div style={{textAlign:'center'}}>
              {cfg.instructorSigImg&&<img src={cfg.instructorSigImg} style={{height:36,maxWidth:90,objectFit:'contain',display:'block',margin:'0 auto 3px'}}/>}
              <div style={{width:90,borderTop:'1px solid #333',marginBottom:3}}/>
              {cfg.instructorName&&<div style={{fontSize:9,fontWeight:700}}>{cfg.instructorName}</div>}
              <div style={{fontSize:8,color:'#666',textTransform:'uppercase',letterSpacing:1}}>{cfg.instructorLabel}</div>
            </div>
          </div>
        </div>
      </div>
    </div>;
  };

  const inputStyle={width:'100%',padding:'7px 10px',border:'1.5px solid var(--border)',borderRadius:8,fontFamily:'inherit',fontSize:13,outline:'none',marginTop:4};
  const labelStyle={fontSize:12,fontWeight:700,color:'var(--gray)',display:'block',marginBottom:2};

  const ImgUploadBox=({label,imgKey,hint})=>{
    const val=cfg[imgKey];
    return <div>
      <label style={labelStyle}>{label}</label>
      <div style={{marginTop:4,border:'2px dashed var(--border)',borderRadius:10,padding:val?0:16,textAlign:'center',background:'var(--light-gray)',overflow:'hidden',position:'relative'}}>
        {val
          ? <div style={{position:'relative'}}>
              <img src={val} style={{maxHeight:80,maxWidth:'100%',display:'block',margin:'0 auto',objectFit:'contain',padding:8}}/>
              <button onClick={()=>setCfg(p=>({...p,[imgKey]:''}))}
                style={{position:'absolute',top:4,right:4,background:'#ef4444',color:'white',border:'none',borderRadius:6,width:22,height:22,cursor:'pointer',fontSize:12,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
            </div>
          : <label style={{cursor:'pointer',display:'block'}}>
              <div style={{fontSize:24,marginBottom:4}}>🖼️</div>
              <div style={{fontSize:12,color:'var(--primary)',fontWeight:700}}>اضغط لرفع صورة</div>
              {hint&&<div style={{fontSize:10,color:'var(--gray)',marginTop:2}}>{hint}</div>}
              <input type="file" accept="image/*" onChange={setImg(imgKey)} style={{display:'none'}}/>
            </label>}
      </div>
    </div>;
  };

  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal" style={{maxWidth:860,width:'96vw',maxHeight:'92vh',display:'flex',flexDirection:'column'}}>
      <div className="modal-header" style={{background:'linear-gradient(135deg,'+cfg.primaryColor+','+cfg.primaryColor+'cc)',flexShrink:0}}>
        <span className="modal-title" style={{color:'white'}}>🏆 شهادة إتمام المستوى — {student.name}</span>
        <button className="modal-close" style={{background:'rgba(255,255,255,.2)',color:'white'}} onClick={onClose}>✕</button>

      <div style={{display:'flex',borderBottom:'2px solid var(--border)',background:'white',flexShrink:0}}>
        {[['preview','👁️ معاينة'],!readOnly&&['edit','✏️ نصوص'],!readOnly&&['images','🖼️ صور'],!readOnly&&['design','🎨 تصميم']].filter(Boolean).map(([id,label])=>
          <button key={id} onClick={()=>setTab(id)} style={{padding:'10px 18px',fontFamily:'inherit',fontSize:13,fontWeight:tab===id?800:500,color:tab===id?cfg.primaryColor:'var(--gray)',background:'none',border:'none',borderBottom:tab===id?'2.5px solid '+cfg.primaryColor:'2.5px solid transparent',cursor:'pointer',marginBottom:-2}}>
            {label}
          </button>)}
        {readOnly&&<div style={{marginRight:'auto',display:'flex',alignItems:'center',paddingLeft:16,fontSize:11,color:'var(--gray)'}}>🔒 للتعديل تواصل مع الإدارة</div>}

      <div style={{overflowY:'auto',flex:1}}>
